# EXPERIMENT -- see docs/REUSE_BOOTH.md. `booth prepare gha` provisions a
# GitHub-hosted Ubuntu 26.04 runner with the base setups, an example's Boothfile
# and the CB_TARGET-guarded booth-entry copy; a later step, in a shell that reads
# no profile, then runs the example's own checks. 89 jobs, so it runs only when
# started by hand (Actions -> host-provision experiment -> Run workflow).
name: host-provision experiment

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # The booth binary, with the prepare kit embedded, built once for every job.
  cli:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - run: ./build/cli-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: booth-linux-amd64
          path: bin/codingbooth-linux-amd64

  provision:
    needs: cli
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Known working (Boothfile part; config.toml settings are listed as DROP in
      # the report), then the batch being tried. Left out (docs/REUSE_BOOTH.md):
      #   known not working:
      #     xonsh-example      login shell is a config.toml run-arg (Where it breaks, item 10)
      #     helix-example      its config is a config.toml shared-dir (item 10)
      #   skipped, they need a non-base variant (a GHA run is a base booth):
      #     i3-desktop-example, tiling-example, empty-example   i3 runs inside XFCE
      #     conda-example                                       jupyter comes from the notebook variant
      #     zed-example                                         a GUI editor on the xfce variant
      matrix:
        example:
          - go-example
          - zig-example
          - bun-example
          - deno-example
          - npm-example
          - pip-example
          - clang-example
          - systemlib-example    # APT_SNAPSHOT is not applied off-booth (item 11)
          - bash-example
          - csharp-example
          - goose-lang-example
          - lsp-example          # flaky: its nvim recipe waits a fixed sleep 3 for the servers
          - ocaml-example
          - php-example
          - apt-example
          - homebrew-example
          # first run: the rest of the examples, most with newly added in-booth tests
          - spring-boot-example
          - android-example
          - angular-example
          - appwrite-example
          - aws-example
          - browser-shared-example
          - cache-example
          - claude-example
          - claude-token-example
          - codex-example
          - codex-token-example
          - data-example
          - desktop-terminals-example
          - dind-example
          - django-example
          - egress-allowlist-extra-example
          - egress-envoy-example
          - elixir-example
          - fastapi-example
          - firebase-example
          - flask-example
          - floci-example
          - flutter-example
          - fsharp-example
          - gcloud-example
          - gleam-example
          - grok-example
          - haskell-example
          - herdr-example
          - java-example
          - jetbrain-exmple
          - js-example
          - kind-app-example
          - kind-example
          - kotlin-example
          - lamp-example
          - latex-example
          - lazarus-example
          - lean-example
          - lean-mathlib-example
          - lemp-example
          - mean-example
          - mern-example
          - mojo-example
          - mvn-deps-example
          - n8n-example
          - neovim-example
          - nextjs-example
          - nodejs-example
          - npm-deps-example
          - octave-example
          - omp-example
          - omp-token-example
          - pern-example
          - pip-deps-example
          - playground3
          - playwright-example
          - playwright-polyglot-example
          - pocketbase-example
          - postgrest-example
          - python-example
          - rails-example
          - react-example
          - rlang-example
          - ruby-example
          - rust-example
          - server-example
          - server-example-2
          - turtle-example
          - vaadin-example
          - wails-android-example
          - wails-example
          - wordpress-example
          - zig-snake-example
    steps:
      - uses: actions/checkout@v4

      - name: What the runner already has
        run: |
          . /etc/os-release; echo "$PRETTY_NAME"; id
          for t in go zig python3 node java gpg just; do printf '%-8s %s\n' "$t" "$(command -v $t || echo -)"; done
          apt-cache madison clang-18 | head -n 3

      - uses: actions/download-artifact@v4
        with:
          name: booth-linux-amd64
          path: ${{ runner.temp }}/cli

      - name: booth prepare gha
        working-directory: examples/workspaces/${{ matrix.example }}
        run: |
          install -m 0755 "$RUNNER_TEMP/cli/codingbooth-linux-amd64" "$RUNNER_TEMP/booth"
          "$RUNNER_TEMP/booth" prepare gha --report "$RUNNER_TEMP/report.txt"

      # A later step is a fresh `bash --noprofile --norc`: what booth prepare wrote
      # to GITHUB_ENV / GITHUB_PATH must be enough. The package commands are listed
      # because some examples' own tests fetch on demand (`bun x cowsay`).
      - name: Later step, default shell (reads no profile)
        if: always()
        continue-on-error: true
        run: |
          for t in go zig bun deno node clang xonsh just cowsay figlet prettier tsc; do printf '%-5s %s\n' "$t" "$(command -v $t || echo MISSING)"; done

      - name: Later step, default shell runs the example's own checks
        if: always()
        working-directory: examples/workspaces/${{ matrix.example }}
        env:
          REPORT: ${{ runner.temp }}/report.txt
          CHECK_SHELL: bash -c
          BOOTH_CONTAINER_NAME: host-provision
        run: |
          "$GITHUB_WORKSPACE/experiments/host-provision/check-example.sh"
          ! grep -q '^FAIL ' "$REPORT"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-provision-report-${{ matrix.example }}
          path: |
            ${{ runner.temp }}/report.txt
            ${{ runner.temp }}/report-tests.log
            /tmp/startups.log
          if-no-files-found: warn

  # One table over every example's report: provisioning lines that failed, and the
  # example's own in-booth tests.
  summary:
    needs: provision
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: host-provision-report-*
          path: reports
      - name: Summary
        run: |
          {
            echo '| example | provision FAIL | tests PASS | tests FAIL | first failure |'
            echo '| --- | --- | --- | --- | --- |'
            for d in reports/host-provision-report-*; do
              ex="${d#reports/host-provision-report-}"; r="$(find "$d" -name report.txt | head -n 1)"
              if [ -z "$r" ]; then echo "| $ex | no report | | | |"; continue; fi
              pf=$(grep -cE '^FAIL +(setup|install) ' "$r" || true)
              tp=$(grep -cE '^PASS +example: ' "$r" || true)
              tf=$(grep -cE '^FAIL +example: ' "$r" || true)
              first=$(grep -m1 -E '^FAIL ' "$r" | cut -c1-140 | tr '|' '/' || true)
              grep -q '^UNTESTED' "$r" && first="UNTESTED ${first}"
              echo "| $ex | $pf | $tp | $tf | ${first} |"
            done
          } | tee summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: host-provision-summary
          path: summary.md
