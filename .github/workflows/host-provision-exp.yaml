# EXPERIMENT -- see docs/REUSE_BOOTH.md. Provisions a GitHub-hosted Ubuntu 26.04
# runner with the base setups, an example's Boothfile and the CB_TARGET-guarded
# booth-entry copy, then runs the example's own checks. Runs only on this branch.
name: host-provision experiment

on:
  push:
    branches: [host-provision-exp]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Known working (Boothfile part; config.toml settings are listed as DROP in
      # the report), then the batch being tried. Left out (docs/REUSE_BOOTH.md):
      #   known not working:
      #     xonsh-example      login shell is a config.toml run-arg (Where it breaks, item 10)
      #     helix-example      its config is a config.toml shared-dir (item 10)
      #     systemlib-example  APT_SNAPSHOT is older than the machine's packages (item 11)
      #   untested: spring-boot-example (provisions; it has no in-booth tests)
      matrix:
        example:
          - go-example
          - zig-example
          - bun-example
          - deno-example
          - npm-example
          - pip-example
          - clang-example
          - bash-example
          - csharp-example
          - goose-lang-example
          - lsp-example          # flaky: its nvim recipe waits a fixed sleep 3 for the servers
          - ocaml-example
          - php-example
          # trying: test fixes (Boothfile path, PID-based ports)
          - apt-example
          - homebrew-example
    steps:
      - uses: actions/checkout@v4

      - name: What the runner already has
        run: |
          . /etc/os-release; echo "$PRETTY_NAME"; id
          for t in go zig python3 node java gpg just; do printf '%-8s %s\n' "$t" "$(command -v $t || echo -)"; done
          apt-cache madison clang-18 | head -n 3

      - name: Provision + check (CB_TARGET=gha)
        env:
          REPORT: ${{ runner.temp }}/report.txt
        run: experiments/host-provision/run.sh gha examples/workspaces/${{ matrix.example }}

      # A later step is a fresh `bash --noprofile --norc`: does anything carry over?
      # The package commands are listed because some examples' own tests fetch on
      # demand (`bun x cowsay`, `deno run npm:cowsay`) and pass without the install.
      - name: Later step, default shell (reads no profile)
        continue-on-error: true
        run: |
          for t in go zig bun deno node clang xonsh just cowsay figlet prettier tsc; do printf '%-5s %s\n' "$t" "$(command -v $t || echo MISSING)"; done

      - name: Later step, login shell (bash -l) runs the example's own tests
        shell: bash -leo pipefail {0}
        working-directory: examples/workspaces/${{ matrix.example }}
        env:
          BOOTH_CONTAINER_NAME: host-provision
        run: bash .cb-tests/inBooth--run-all-tests.sh

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-provision-report-${{ matrix.example }}
          path: |
            ${{ runner.temp }}/report.txt
            /tmp/startups.log
          if-no-files-found: warn
