# Builds and pushes Docker images to Docker Hub with cosign signatures.
#
# Multi-arch images are built NATIVELY: each architecture is built on a runner
# of that architecture (no QEMU emulation), pushed by digest, then assembled
# into the final multi-arch tag and signed in a separate "merge" job.
#
# Pipeline:
#   build-base  (amd64 + arm64, native, push-by-digest)
#     -> merge-base   (imagetools create + cosign sign)
#       -> build-variants  (amd64 + arm64 per variant, native, push-by-digest)
#         -> merge-variants  (imagetools create + cosign sign)
#           -> integration-tests
#
# Triggers on: manual dispatch only.
name: Publish docker images

on:
  workflow_dispatch:

env:
  DOCKER_BUILDKIT: "1"

jobs:

  # ---------------------------------------------------------
  # 0. Refuse to publish images for pre-release (--rc) versions
  # ---------------------------------------------------------
  guard-no-rc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Reject pre-release (--rc) versions
        run: |
          set -euo pipefail
          VERSION=$(tr -d ' \t\r\n' < version.txt)
          echo "version.txt: $VERSION"
          if [[ "$VERSION" =~ --rc([0-9]+)?$ ]]; then
            echo "::error::Refusing to publish Docker images for pre-release version '$VERSION'. Docker publishing is only allowed for stable (non-rc) versions."
            exit 1
          fi
          echo "Stable version — proceeding."

  # ---------------------------------------------------------
  # 1. Build the base container natively, one arch per runner
  # ---------------------------------------------------------
  build-base:
    needs: guard-no-rc
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Build & push base (${{ matrix.arch }}, by digest)
        run: ./build/docker-build.sh --push --arch ${{ matrix.arch }} base
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN:    ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Upload base digest (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: digests-base-${{ matrix.arch }}
          path: build/.digests/base-${{ matrix.arch }}.digest
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------
  # 2. Assemble + sign the multi-arch base tag
  # ---------------------------------------------------------
  merge-base:
    needs: build-base
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Download base digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-base-*
          merge-multiple: true
          path: build/.digests

      - name: Merge & sign base
        run: ./build/docker-build.sh --merge base
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN:    ${{ secrets.DOCKERHUB_TOKEN }}
          COSIGN_PASSWORD:    ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_KEY:         ${{ secrets.COSIGN_KEY }}

  # ---------------------------------------------------------
  # 3. Build every other variant natively, one arch per runner
  #    (variants are FROM nawaman/codingbooth:base-<version>,
  #     so they need the merged base first)
  # ---------------------------------------------------------
  build-variants:
    needs: merge-base
    strategy:
      fail-fast: false
      matrix:
        variant: [notebook, codeserver, desktop-xfce, desktop-kde]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Clean up disk space
        if: matrix.variant == 'desktop-kde'
        run: |
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Build & push ${{ matrix.variant }} (${{ matrix.arch }}, by digest)
        run: ./build/docker-build.sh --push --arch ${{ matrix.arch }} ${{ matrix.variant }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN:    ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Upload ${{ matrix.variant }} digest (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.variant }}-${{ matrix.arch }}
          path: build/.digests/${{ matrix.variant }}-${{ matrix.arch }}.digest
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------
  # 4. Assemble + sign each multi-arch variant tag
  # ---------------------------------------------------------
  merge-variants:
    needs: build-variants
    strategy:
      fail-fast: false
      matrix:
        variant: [notebook, codeserver, desktop-xfce, desktop-kde]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Download ${{ matrix.variant }} digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.variant }}-*
          merge-multiple: true
          path: build/.digests

      - name: Merge & sign ${{ matrix.variant }}
        run: ./build/docker-build.sh --merge ${{ matrix.variant }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN:    ${{ secrets.DOCKERHUB_TOKEN }}
          COSIGN_PASSWORD:    ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_KEY:         ${{ secrets.COSIGN_KEY }}

  # ---------------------------------------------------------
  # 5. Run integration tests after all images are published
  # ---------------------------------------------------------
  integration-tests:
    needs: [merge-base, merge-variants]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.1'

      - name: Build CLI
        run: ./build/cli-build.sh

      - name: Go Integration tests
        run: cd tests/unit && ./run-go-integration-tests.sh

      - name: Basic tests
        run: cd tests/basic && ./run-basic-tests.sh

      - name: Complex tests
        run: cd tests/complex && ./run-complex-tests.sh
