# Points the Homebrew formula (NawaMan/homebrew-tap, Formula/codingbooth.rb) at a
# stable release's `booth` wrapper, and pushes that to the tap.
# Triggers on: manual dispatch only. NOT part of `Release everything`: it is run
# by hand after a release has succeeded (docs/HOMEBREW.md, Phase 3).
#
# Secret: HOMEBREW_TAP_TOKEN — a fine-grained token with Contents: read and write
# on NawaMan/homebrew-tap only. GITHUB_TOKEN cannot write to another repo.
name: Bump Homebrew formula

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release to point the formula at (X.Y.Z). Empty = version.txt on the chosen branch."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Pick the version
        id: get_version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION:-$(tr -d ' \t\r\n' < version.txt)}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not a stable release version (X.Y.Z)."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Pointing the formula at CodingBooth $VERSION"

      - name: Bump the formula and push the tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::error::The HOMEBREW_TAP_TOKEN secret is not set."
            exit 1
          fi
          TAP="$RUNNER_TEMP/homebrew-tap"
          git clone --quiet --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/NawaMan/homebrew-tap.git" "$TAP"
          # The sha256 comes from the published asset; the release must exist.
          ./build/bump-homebrew-formula.sh "$VERSION" "$TAP/Formula/codingbooth.rb" \
            | tee "$RUNNER_TEMP/brew-bump.log"
          if [ "$(tail -n 1 "$RUNNER_TEMP/brew-bump.log")" = unchanged ]; then
            echo "The formula already points at ${VERSION}." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git -C "$TAP" config user.name  "github-actions[bot]"
          git -C "$TAP" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$TAP" commit --quiet -am "codingbooth ${VERSION}"
          git -C "$TAP" push --quiet origin HEAD
          echo "Homebrew formula → ${VERSION}" | tee -a "$GITHUB_STEP_SUMMARY"
