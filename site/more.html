<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>More — CodingBooth</title>
    <meta name="description" content="More about CodingBooth — deeper guides and reference material.">
    <link rel="icon" type="image/png" sizes="32x32" href="favicons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="favicons/favicon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="favicons/apple-touch-icon.png">
    <meta name="theme-color" content="#000d33">
    <style>
        :root {
            --bg: #000d33;
            --bg-elev: #001a4d;
            --fg: #ffffff;
            --fg-muted: #a8b3d1;
            --accent: #fc962f;
            --accent-strong: #e07a14;
            --border: #1a2856;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--fg);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        a {
            color: var(--accent);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 0 24px;
        }

        nav {
            border-bottom: 1px solid var(--border);
            padding: 16px 0;
        }

        .brand {
            font-weight: 700;
            font-size: 18px;
            color: var(--fg);
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            text-align: center;
            padding: 80px 0;
        }

        h1 {
            font-size: clamp(32px, 5vw, 48px);
            margin: 0 0 16px;
            letter-spacing: -0.02em;
        }

        .lead {
            color: var(--fg-muted);
            font-size: 18px;
            margin: 0 0 32px;
        }

        .back {
            display: inline-block;
            padding: 10px 20px;
            background: var(--accent);
            color: #000d33;
            border-radius: 6px;
            font-weight: 600;
        }

        .back:hover {
            background: var(--accent-strong);
            color: #ffffff;
            text-decoration: none;
        }

        footer {
            padding: 24px 0;
            text-align: center;
            color: var(--fg-muted);
            font-size: 14px;
            border-top: 1px solid var(--border);
        }
    </style>
</head>

<body>
    <nav>
        <div class="container">
            <a href="/" class="brand">CodingBooth</a>
        </div>
    </nav>

    <main>
        <div class="container">
            <h1>Under construction</h1>
            <p class="lead">
                This page will host deeper guides and reference material. In the meantime,
                the <a href="https://github.com/NawaMan/CodingBooth#documentation">documentation on GitHub</a>
                has what you need.
            </p>
            <a class="back" href="index.html">← Back to home</a>
        </div>
    </main>

    <footer>
        <div class="container">
            © 2026 <a href="https://nawaman.net">NawaMan</a>
            — <a href="https://github.com/NawaMan/CodingBooth/blob/main/LICENSE">Apache 2.0</a>
        </div>
    </footer>
</body>

</html>
