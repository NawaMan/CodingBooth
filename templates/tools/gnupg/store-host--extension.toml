cb-version = "1.0.1"
display-name = "Host Keyring (live)"
display-disc = "Use the host's gpg keyring in the booth, live — private keys included"
display-detail = """Mounts the host's gpg home (GNUPG_HOST_HOME, default ~/.gnupg) at the booth's ~/.gnupg, read-write: the booth has the same keys as the host — public, private, and the trust given to each — and a key added, changed or removed in the booth is added, changed or removed on the host. The booth's own gpg-agent asks for a key's passphrase in the booth's terminal; it keeps its sockets in /run/user/<uid>/gnupg inside the booth, not in the shared gpg home. This is full trust: every private key in the keyring is in the booth, and anything run there can read, change or copy the keys (and see a passphrase typed there). Each start says so. To bring only chosen keys, use +keys instead; to have all of them as a copy the booth cannot write back, +seed-host. The host folder must exist. It cannot be combined with +keys or tools/envfolio+seed — each would write a second key into the host's gpg home — nor with +seed-host, whose copy would have nowhere to go, nor with tools/envfolio+store-host, which mounts the same folder with the EnvFolio store, and the booth does not start if it is. With +store-cache, +seed or +store-share the host's keyring is the one mounted, and each start says the other is skipped. Add tools/envfolio+host-agent to have the booth's gpg use the host's gpg-agent, so the passphrase is asked and cached on the host (Linux hosts). Needs the booth to run on the machine that has the keyring: not for a remote or cloud booth."""
display-order = 5
auto-select = false
tags = ["gpg", "credential", "key", "host"]

# The CLI reads CB_GNUPG_HOST from these run-args before the container starts: it checks the
# combination and the host folder, adds the /run/user/<uid> tmpfs for gpg's sockets, and warns.
run-args = [
    "-v", "${GNUPG_HOST_HOME}:/home/coder/.gnupg",
    "-e", "CB_GNUPG_HOST=1",
]

[params.GNUPG_HOST_HOME]
default = "~/.gnupg"
