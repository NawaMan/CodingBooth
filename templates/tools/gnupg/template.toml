cb-version = "1.1.1"
display-name = "GnuPG"
primary = true
display-disc = "GPG keys in the booth: from the host (+keys), from the project (+seed, +store-share), or kept (+store-cache)"
display-detail = "GnuPG 2.5 (gpg) is in every booth already; this template adds nothing on its own. Select +keys to bring chosen private keys from the host's keyring, still protected by their passphrase, together with the host's public keyring — to decrypt, sign (git commits too, once user.signingkey is set), or encrypt: to yourself as it is, and to the people the host knows with `--trust-model always`, since the host's trust in their keys is not brought. The booth's keyring is otherwise lost with the container: +store-cache keeps it in .booth/cache/ on this machine, +seed starts that cached keyring from one committed with the project, and +store-share keeps the keyring itself in git (.booth/shared/), private keys included — for keys made for the project. For the EnvFolio store's key, tools/envfolio+seed brings it already."
display-order = 65
in-variants = ["base"]
tags = [
    "cli",
    "gpg",
    "secrets",
    "signing",
]
