cb-version = "1.1.0"
display-name = "SSH Credentials"
display-disc = "Mount host SSH keys and config into the booth"
display-detail = "Mounts the host ~/.ssh read-only and copies it into the booth's home at start, so git over SSH and ssh to your servers use your own keys; the host files are never written. All of ~/.ssh comes in, private keys included, and any code in the booth can read them: use it for code you trust. For GitHub alone, gh+token with a token scoped to the repo exposes less."
display-order = 3
auto-select = false
tags = [
    "ssh",
    "credential",
    "git"
]

run-args = [
    "-v", "~/.ssh:/etc/cb-home-seed/.ssh:ro",
]
