cb-version = "1.1.0"
display-name = "SSH Credentials (all of ~/.ssh)"
display-disc = "All of the host ~/.ssh, private keys included: you are on your own"
display-detail = "Mounts the host ~/.ssh read-only and copies all of it into the booth's home at start: every private key, config and known_hosts. The host files are never written, but any code in the booth can read every key and use it anywhere it works, after the booth is gone. This is the you-are-on-your-own mode, for code you trust. For general use prefer +agent (keys never enter the booth) or +keys (only a folder you choose); for GitHub alone, gh+token with a token scoped to the repo."
display-order = 5
auto-select = false
tags = [
    "ssh",
    "credential",
    "git"
]

run-args = [
    "-v", "~/.ssh:/etc/cb-home-seed/.ssh:ro",
]
