display-detail = "Installs ChucK, a music language where time is a value you advance (250::ms => now), so a drum pattern reads like the beat it plays and several patterns run side by side as shreds. chuck drums.ck plays through ALSA's default device — select host-audio to hear it on your speakers; chuck --silent with a WvOut records to a file without one."
