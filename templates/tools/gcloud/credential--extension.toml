display-name = "GCloud Credentials"
display-disc = "Mount host Google Cloud SDK credentials"
display-order = 90
auto-select = true
tags = ["credential", "gcloud"]

run-args = [
    # Linux / macOS
    "-v", "~/.config/gcloud:/etc/cb-home-seed/.config/gcloud:ro",
    # Windows
    "-v", "~/AppData/Roaming/gcloud:/etc/cb-home-seed/.config/gcloud:ro",
]
