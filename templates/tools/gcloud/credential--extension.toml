# NOTE: This template has not been tested -- no time (sorry). Please report success or failure. :-p
display-name = "GCloud Credentials"
display-disc = "Mount host Google Cloud SDK credentials"
display-detail = "Seeds the credential stores (`credentials.db`, `access_tokens.db`, `legacy_credentials/`, `application_default_credentials.json`) and the active configuration (`configurations/`, `active_config`, `default_configs.db`). `logs/` is deliberately not seeded: gcloud writes a new log file on every invocation, so it is the overwhelming majority of the directory's file count and none of it is a credential."
display-order = 90
auto-select = true
tags = ["credential", "gcloud"]

# Both OS layouts are listed; whichever paths do not exist on the host are
# dropped before `docker run` (see FilterMissingVolumeMounts).
run-args = [
    # Linux / macOS
    "-v", "~/.config/gcloud/credentials.db:/etc/cb-home-seed/.config/gcloud/credentials.db:ro",
    "-v", "~/.config/gcloud/access_tokens.db:/etc/cb-home-seed/.config/gcloud/access_tokens.db:ro",
    "-v", "~/.config/gcloud/default_configs.db:/etc/cb-home-seed/.config/gcloud/default_configs.db:ro",
    "-v", "~/.config/gcloud/application_default_credentials.json:/etc/cb-home-seed/.config/gcloud/application_default_credentials.json:ro",
    "-v", "~/.config/gcloud/legacy_credentials:/etc/cb-home-seed/.config/gcloud/legacy_credentials:ro",
    "-v", "~/.config/gcloud/configurations:/etc/cb-home-seed/.config/gcloud/configurations:ro",
    "-v", "~/.config/gcloud/active_config:/etc/cb-home-seed/.config/gcloud/active_config:ro",
    # Windows
    "-v", "~/AppData/Roaming/gcloud/credentials.db:/etc/cb-home-seed/.config/gcloud/credentials.db:ro",
    "-v", "~/AppData/Roaming/gcloud/access_tokens.db:/etc/cb-home-seed/.config/gcloud/access_tokens.db:ro",
    "-v", "~/AppData/Roaming/gcloud/default_configs.db:/etc/cb-home-seed/.config/gcloud/default_configs.db:ro",
    "-v", "~/AppData/Roaming/gcloud/application_default_credentials.json:/etc/cb-home-seed/.config/gcloud/application_default_credentials.json:ro",
    "-v", "~/AppData/Roaming/gcloud/legacy_credentials:/etc/cb-home-seed/.config/gcloud/legacy_credentials:ro",
    "-v", "~/AppData/Roaming/gcloud/configurations:/etc/cb-home-seed/.config/gcloud/configurations:ro",
    "-v", "~/AppData/Roaming/gcloud/active_config:/etc/cb-home-seed/.config/gcloud/active_config:ro",
]
