display-name = "Expose PlantUML Port"
display-disc = "Expose PlantUML Server port to host network"
display-order = 1
auto-select = false
tags = [
    "plantuml",
    "port",
    "network"
]

run-args = [
    "-p", "${PLANTUML_HOST_PORT}:${PLANTUML_PORT}",
]

# Host-side port. Defaults to the port the service listens on, so moving the service
# moves the published port with it. Override only when the host port is already taken.
[params.PLANTUML_HOST_PORT]
default = "${PLANTUML_PORT}"
