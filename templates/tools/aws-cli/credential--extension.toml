# NOTE: This template has not been tested -- no time (sorry). Please report success or failure. :-p
display-name = "AWS Credentials"
display-disc = "Mount host AWS CLI credentials"
display-detail = "Seeds `~/.aws/config`, `~/.aws/credentials` and `~/.aws/sso/cache/` — the last so an existing SSO session carries into the booth instead of forcing a fresh `aws sso login`. `~/.aws/cli/cache/` is not seeded: it caches assumed-role credentials, which are short-lived and re-fetched on demand."
auto-select = true
tags = ["aws", "credential"]

run-args = [
    "-v", "~/.aws/config:/etc/cb-home-seed/.aws/config:ro",
    "-v", "~/.aws/credentials:/etc/cb-home-seed/.aws/credentials:ro",
    "-v", "~/.aws/sso/cache:/etc/cb-home-seed/.aws/sso/cache:ro",
]
