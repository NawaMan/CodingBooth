display-name = "Conda (Miniforge)"
display-disc = "Conda package manager with Miniforge"
display-detail = "Installs Miniforge-based Conda for managing Python environments, data science packages, and cross-platform dependencies."
display-order = 58
tags = [
    "conda",
    "miniforge",
    "python",
    "data-science"
]

[params.PYTHON_VERSION]
default = "3.12"
suggests = [
    "3.13",
    "3.12",
    "3.11",
    "3.10",
]

[segments]
Boothfile = """
setup conda ${PYTHON_VERSION}
"""
