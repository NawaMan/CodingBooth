cb-version = "1.0.0"
display-name = "Playwright Python"
display-disc = "Playwright Python bindings (playwright for Python)"
display-order = 10
auto-select = false
tags = [
    "playwright",
    "python",
    "testing",
]

requires = ["python"]

[segments]
# Pinned to the parent's PLAYWRIGHT_VERSION so the Python binding reuses the pre-baked
# browsers instead of floating to a newer Playwright that expects different ones.
"Boothfile--90" = """
run if [ "${PLAYWRIGHT_VERSION}" = "latest" ]; then pip install playwright; else pip install "playwright==${PLAYWRIGHT_VERSION}"; fi
"""
