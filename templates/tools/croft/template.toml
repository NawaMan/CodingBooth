cb-version = "0.1.0"
display-name = "Croft"
primary = true
display-disc = "VS Code-style terminal editor (single static binary)"
display-detail = """Installs Croft from the official GitHub release: the static musl build under /opt/croft, with croft on PATH. The archive is checked against the release SHA256SUMS. Config is ~/.config/croft/config.json. Select +config-shared to keep that directory in git. Pin a release with croft:0.2.32; the default is latest, falling back to 0.2.32."""
display-order = 19
tags = [
    "croft",
    "editor",
    "tui",
    "ide"
]

[params.CROFT_VERSION]
default = "latest"
suggests = ["latest", "0.2.32"]

[segments]
Boothfile = """
setup croft --version ${CROFT_VERSION}
"""
