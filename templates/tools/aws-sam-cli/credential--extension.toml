display-name = "AWS Credentials"
display-disc = "Mount host AWS CLI credentials (shared with AWS CLI)"
display-detail = "Same mounts as the AWS CLI credential extension — `~/.aws/config`, `~/.aws/credentials` and `~/.aws/sso/cache/`. Selecting both templates is harmless: identical mounts are deduplicated."
auto-select = true
tags = ["aws", "credential"]

run-args = [
    "-v", "~/.aws/config:/etc/cb-home-seed/.aws/config:ro",
    "-v", "~/.aws/credentials:/etc/cb-home-seed/.aws/credentials:ro",
    "-v", "~/.aws/sso/cache:/etc/cb-home-seed/.aws/sso/cache:ro",
]
