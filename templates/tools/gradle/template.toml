cb-version = "1.0.0"
display-name = "Gradle"
primary = true
display-disc = "Gradle build tool for JVM projects"
display-detail = "Installs Gradle build automation tool for Java, Kotlin, Groovy, and other JVM languages."
display-order = 64
tags = ["gradle", "build", "java", "jvm"]

requires = ["java"]

[params.GRADLE_VERSION]
default = "9.8.0"
suggests = ["9.8.0", "9.7.1", "9.6.1"]

[segments]
Boothfile = """
setup gradle ${GRADLE_VERSION}
"""
