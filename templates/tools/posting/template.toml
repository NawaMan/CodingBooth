cb-version = "1.0.0"
display-name = "Posting"
primary = true
display-disc = "HTTP client for your terminal"
display-detail = "Installs Posting, a keyboard-centric terminal HTTP client (a TUI alternative to Postman/Insomnia) with collections saved as YAML in your project, environments and variables, autocompletion, and OpenAPI import."
display-order = 78
tags = [
    "http",
    "api",
    "tui",
    "cli",
]

[params.POSTING_VERSION]
default = "2.11.0"
suggests = ["2.11.0", "latest"]

[segments]
Boothfile = """
setup posting --version ${POSTING_VERSION}
"""
