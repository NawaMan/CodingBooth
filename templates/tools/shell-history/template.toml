display-name = "Shell History"
display-disc = "Persist bash and zsh history across sessions"
display-detail = "Touches empty history files in .booth/cache/ so bash and zsh command history survives container recreation. No startup scripts needed — shells already write to their default history paths, and the cache mount maps them automatically."
display-order = 33
tags = [
    "shell",
    "history",
    "persistence",
]

cache-files = [
    "home/coder/.bash_history",
    "home/coder/.zsh_history",
]
