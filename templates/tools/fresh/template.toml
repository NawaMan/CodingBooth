cb-version = "0.3.0"
display-name = "Fresh"
primary = true
display-disc = "Terminal text editor with familiar keybindings"
display-detail = """Installs Fresh from the official GitHub release: the static musl build under /opt/fresh-editor, with fresh on PATH. TTT is the base image's default editor; to make Fresh $EDITOR, add env EDITOR=fresh. Config is ~/.config/fresh/config.json; at container start the setup links the booth-lsp plugin (language servers on PATH, plus an Install row for a missing one) and turns off upgrade checks and telemetry unless the config sets check_for_updates. Fresh uses the dark theme by default. fresh+theme is selected automatically and writes the theme on every start; pick another built-in with fresh+theme:dracula, or deselect it (fresh~theme) to keep a theme picked inside Fresh. Select +config-shared to keep that directory in git. Pin a release with fresh:0.5.4; the default is latest, falling back to 0.5.4."""
display-order = 23
tags = [
    "fresh",
    "editor",
    "tui"
]

[params.FRESH_VERSION]
default = "latest"
suggests = ["latest", "0.5.4"]

[segments]
Boothfile = """
setup fresh --version ${FRESH_VERSION}
"""
