cb-version = "0.2.0"
display-name = "Theme"
display-disc = "The terminal's own colors by default; pick any built-in Fresh theme"
display-detail = """Writes the theme into ~/.config/fresh/config.json when the container starts. The default is terminal, which uses the terminal's own colors. Choose another built-in with fresh+theme:dracula (dark, gruvbox, high-contrast, light, nord, nostalgia, solarized-dark, tokyo-night). fresh~theme leaves the factory theme, high-contrast. Other keys in that file stay. The selected theme is written again on the next start."""
display-order = 30
auto-select = true
tags = ["fresh", "editor", "theme"]

[params.FRESH_THEME]
default = "terminal"
suggests = [
    "terminal",
    "dark",
    "dracula",
    "gruvbox",
    "high-contrast",
    "light",
    "nord",
    "nostalgia",
    "solarized-dark",
    "tokyo-night",
]

[segments]
"startup--74.sh" = """
# Apply the selected Fresh theme. Other keys in the user config stay.
theme="${FRESH_THEME}"
conf="${HOME}/.config/fresh/config.json"
mkdir -p "$(dirname "$conf")"
if [[ ! -s "$conf" ]]; then
  jq -n --arg theme "$theme" '{version:1, theme:$theme}' > "$conf"
else
  tmp="$(mktemp)"
  if jq --arg theme "$theme" '.theme = $theme' "$conf" > "$tmp"; then
    mv "$tmp" "$conf"
  else
    rm -f "$tmp"
    echo "⚠️  Fresh theme was not set; ${conf} is not JSON." >&2
  fi
fi
"""
