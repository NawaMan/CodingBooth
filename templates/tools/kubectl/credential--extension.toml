display-name = "Kube Config"
display-disc = "Mount host kubeconfig"
display-detail = "Seeds `~/.kube/config`, the kubeconfig itself. `~/.kube/cache/` and `~/.kube/http-cache/` are deliberately not seeded: they hold per-cluster API discovery documents — thousands of small files for anyone with several clusters — and kubectl regenerates them on demand."
auto-select = true
tags = ["kubernetes", "credential"]

run-args = [
    "-v", "~/.kube/config:/etc/cb-home-seed/.kube/config:ro",
]
