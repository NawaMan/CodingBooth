cb-version = "1.0.0"
display-name = "Homebrew"
display-disc = "Homebrew package manager for Linux"
display-detail = "Installs Homebrew (Linuxbrew) package manager for installing additional tools and libraries."
display-order = 40
tags = [
    "homebrew",
    "packages"
]

# Image PATH, not a shell profile. `booth exec` runs the command with no shell,
# so /etc/profile.d never runs and a brew-installed tool would be "not found".
[segments]
Boothfile = """
env PATH=/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin:$PATH
setup homebrew
"""
