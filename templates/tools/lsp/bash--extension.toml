cb-version = "0.1.0"
display-name = "Bash (bash-language-server)"
display-disc = "Completion, hover docs, and shellcheck diagnostics; Bash IDE in VS Code"
display-order = 14
auto-select = false
requires = ["nodejs"]
tags = ["lsp", "language-server", "bash", "vscode"]

[segments]
"Boothfile--60" = """
