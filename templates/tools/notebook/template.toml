display-name = "Jupyter Notebook"
display-disc = "JupyterLab notebook server (requires python)"
display-detail = "Sets up JupyterLab with a Bash kernel for interactive notebook development. Requires the python template. Installs a 'start-notebook' launcher; add the auto-start extension to run it on container boot, and the expose extension to reach it from the host."
display-order = 24
requires = ["python"]
tags = [
    "jupyter",
    "notebook",
    "python"
]

[params.NOTEBOOK_PORT]
default = "18888"
suggests = [
    "18888",
    "8888",
]

[segments]
"Boothfile--60" = """
setup notebook ${NOTEBOOK_PORT}
"""
