display-name = "Azure Credentials"
display-disc = "Mount host Azure CLI credentials"
display-detail = "Seeds the signed-in account (`azureProfile.json`), the token cache (`msal_token_cache.json`), service-principal entries, and the CLI's own settings (`config`, `clouds.config`). The rest of `~/.azure` is deliberately not seeded: `cliextensions/` holds fully installed Python packages, and `commands/`, `logs/` and `telemetry/` gain a file per CLI invocation — thousands, on a machine that uses `az` regularly."
auto-select = true
tags = ["azure", "credential"]

run-args = [
    "-v", "~/.azure/azureProfile.json:/etc/cb-home-seed/.azure/azureProfile.json:ro",
    "-v", "~/.azure/msal_token_cache.json:/etc/cb-home-seed/.azure/msal_token_cache.json:ro",
    "-v", "~/.azure/service_principal_entries.json:/etc/cb-home-seed/.azure/service_principal_entries.json:ro",
    "-v", "~/.azure/config:/etc/cb-home-seed/.azure/config:ro",
    "-v", "~/.azure/clouds.config:/etc/cb-home-seed/.azure/clouds.config:ro",
]
