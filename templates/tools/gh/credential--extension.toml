display-name = "GitHub CLI Credentials"
display-disc = "Mount host GitHub CLI credentials"
auto-select = true
tags = ["github", "credential"]

run-args = [
    # Linux / macOS
    "-v", "~/.config/gh:/etc/cb-home-seed/.config/gh:ro",
    # Windows
    "-v", "~/AppData/Roaming/GitHub CLI:/etc/cb-home-seed/.config/gh:ro",
]
