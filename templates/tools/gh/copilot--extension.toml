display-name = "GitHub Copilot CLI"
display-disc = "GitHub Copilot extension for gh"
display-order = 1
auto-select = false
tags = [
    "github",
    "ai",
    "copilot"
]

run-args = [
    # GitHub Copilot credentials (home-seeding: may update tokens)
    "-v", "~/.config/github-copilot:/etc/cb-home-seed/.config/github-copilot:ro",
]

[segments]
Boothfile = """
setup gh-copilot
"""
