cb-version = "0.2.0"
display-name = "GitHub CLI Token"
display-disc = "Log gh in with GH_TOKEN / GITHUB_TOKEN from the host"
display-detail = "Passes `GH_TOKEN` and `GITHUB_TOKEN` from the host environment into the booth, so `gh` is logged in without `gh auth login`. A host that keeps the gh login in the system keyring (the default) can hand it over with `GH_TOKEN=$(gh auth token) booth ...`; a fine-grained personal access token works the same way. Either variable may instead go in `.booth/.env`, which reaches the booth without this extension. A variable not set on the host is left out, so selecting it without a token does nothing. The gh setup runs `gh auth setup-git` at start when a token is set, so git over HTTPS uses it too. For GitHub Enterprise, `GH_ENTERPRISE_TOKEN` and `GH_HOST` are passed the same way. The token is in the container's environment, so `docker inspect` on the booth shows it."
display-order = 2
auto-select = false
tags = ["github", "credential", "token"]

# Bare passthrough: booth emits each -e only when the host has the variable,
# so an unset token never lands as an empty one.
run-args = [
    "-e", "GH_TOKEN",
    "-e", "GITHUB_TOKEN",
    "-e", "GH_ENTERPRISE_TOKEN",
    "-e", "GH_HOST",
]
