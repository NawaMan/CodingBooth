display-name = "Docker-in-Docker"
display-disc = "Docker-in-Docker support for container workflows"
display-detail = """Enables Docker-in-Docker (DinD) mode so you can build and run Docker containers from inside \
the booth container. WARNING: The DinD sidecar runs privileged, which means code running in the booth can \
reach its Docker daemon and use it to step outside the booth's isolation and touch the host. Only \
select this for booths whose code you trust -- treat it the same caution you'd give running \
--privileged yourself, and be wary of enabling it for a booth of unknown origin."""
display-order = 62
dind = true
tags = [
    "docker",
    "dind"
]

[segments]
Boothfile = """
setup dind
"""
