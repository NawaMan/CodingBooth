display-name = "Expose nginx Port"
display-disc = "Publish nginx (container port 80) to the host"
display-detail = "nginx already auto-starts on container boot, but it only listens inside the booth. This publishes it to the host so you can open it in a browser. It serves on container port 80; NGINX_PORT is the host port to map that to, defaulting to 8080 to stay clear of a web server on the host. Note that nginx and apache both take container port 80 — they cannot run in the same booth."
display-order = 1
auto-select = false
tags = [
    "nginx",
    "web",
    "port",
    "network",
]

run-args = [
    "-p", "${NGINX_PORT}:80",
]

[params.NGINX_PORT]
default = "8080"
suggests = [
    "8080",
    "8000",
    "80",
]
