cb-version = "0.1.0"
display-name = "TTT"
primary = true
display-disc = "Terminal IDE with LSP, git, and an embedded terminal"
display-detail = """Installs the TTT Editor from the official GitHub release: a single Linux binary under /opt/ttt, with ttt on PATH. Workspace search needs rg, so the setup installs ripgrep when it is missing. Config is ~/.config/ttt/settings.json. Select +config-shared to keep that directory in git. Pin a release with ttt:1.8.0; the default is latest, falling back to 1.8.0."""
display-order = 18
tags = [
    "ttt",
    "editor",
    "tui",
    "ide"
]

[params.TTT_VERSION]
default = "latest"
suggests = ["latest", "1.8.0"]

[segments]
Boothfile = """
setup ttt --version ${TTT_VERSION}
"""
