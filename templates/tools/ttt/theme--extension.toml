cb-version = "0.2.0"
display-name = "Theme"
display-disc = "Pick TTT's theme and border style (default zenith, rounded)"
display-detail = """Every booth already starts TTT on zenith with rounded borders: the base image's \
start-up sets theme and editor.borderStyle in ~/.config/ttt/settings.json when the container starts, \
only where the file does not already have them, so a theme or border picked inside TTT stays. \
Select this to pick others: ttt+theme:dracula (aurora, bubblegum, default-dark, default-light, \
high-contrast-dark, high-contrast-light, hotline, monokai, nord, one-dark, rainy-day, rainy-day-dark, \
solarized-dark, solarized-light, turbo-vision, virtru-dark, vscode-dark-plus), and another border \
with ttt+theme:zenith,double (default, theme, rounded, sharp, double, bold, ascii, none). \
To leave a key to TTT's own default, set it empty in the container: \
booth config --env TTT_THEME= --env TTT_BORDER_STYLE=."""
display-order = 30
auto-select = true
tags = ["ttt", "editor", "theme"]

[params.TTT_THEME]
default = "zenith"
suggests = [
    "zenith",
    "default-dark",
    "dracula",
    "nord",
    "one-dark",
    "monokai",
    "solarized-dark",
    "vscode-dark-plus",
    "default-light",
]

[params.TTT_BORDER_STYLE]
default = "rounded"
suggests = ["rounded", "default", "sharp", "double", "bold", "ascii", "none"]

[segments]
"Boothfile--60" = """
env TTT_THEME=${TTT_THEME}
env TTT_BORDER_STYLE=${TTT_BORDER_STYLE}
"""
