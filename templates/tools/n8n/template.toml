display-name = "n8n"
display-disc = "Workflow automation editor (SQLite, npm)"
display-detail = """Installs n8n with npm on the catalog Node.js (n8n 2.x requires Node >= 24, selected automatically). Workflows, credentials, and the encryption key live in ~/.n8n on SQLite — no Postgres. Code nodes run JavaScript and Python in n8n's internal task runners; the Python runner is built from the matching n8n release, so no Docker sidecar is needed. Add +sandbox for the n8n Assistant's code sandbox, which is n8n's sandbox service on Docker (pulls in dind). Add +search for the Assistant's web search through SearXNG, also on Docker. The server does not start or publish a port on its own: add +autostart to run it on boot, +expose to reach it from the host, and +persist to keep ~/.n8n in .booth/cache. Default port is 21200 (n8n's own 5678 is still a valid pin). Default version is 2.41.5. n8n 2.x is the npm install line; a later major may ship as a container image only, so the pin stays on 2.x."""
display-order = 31
tags = [
    "n8n",
    "workflow",
    "automation",
    "server",
    "self-hosted"
]
requires = ["nodejs"]

[params.N8N_VERSION]
default = "2.41.5"
suggests = [
    "2.41.5",
    "latest",
]

[params.N8N_PORT]
default = "21200"
suggests = [
    "21200",
    "5678",
]

[segments]
"Boothfile--60" = """
setup n8n --version ${N8N_VERSION} --port ${N8N_PORT}
"""
