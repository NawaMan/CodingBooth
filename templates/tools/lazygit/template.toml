display-name = "Lazygit"
display-disc = "Simple terminal UI for git commands"
display-detail = "Installs lazygit, a simple terminal UI for git commands, making it easy to stage, commit, and manage branches."
display-order = 60
tags = ["git", "tui", "cli"]

[params.LAZYGIT_VERSION]
default = "latest"
suggests = ["latest"]

[segments]
Boothfile = """
setup lazygit --version ${LAZYGIT_VERSION}
"""
