cb-version = "1.0.0"
display-name = "Seed from the Host"
display-disc = "Copy chosen EnvFolio items from the host's store into the booth, still encrypted"
display-detail = """At each start, booth asks the host's folio which items FOLIO_SEED takes — the arguments you would give `folio exec`, e.g. `gh server @app1 --secrets` or `--use @app2/@prod --vars .booth/deploy.vars --secrets` — and copies just those, still encrypted, with the store's key id and public key, into .booth/.tmp/folio-seed/ (out of git, emptied at the next start). Nothing is decrypted and the store key is not unlocked: the booth gets the files, and whoever holds the key reads the secrets. Texts read with the public key alone. Items keep their paths (namespaces too), so the same `folio exec` command works in the booth and on the host (seed with the arguments you will run); a vars file must be inside the project, where both see it. FOLIO_SEED_MODE: `seed` makes the booth's store only when it has none (one kept by +store-cache is used as is); `fill` also adds the items an existing store lacks, when it uses the same key. Needs folio on the host; when it fails (a vars file naming a secret without --secrets, a missing entry), the booth does not start and folio's message says why."""
display-order = 92
auto-select = false
tags = ["secrets", "credential", "host"]

# The host side reads CB_FOLIO_SEED from these run-args before the container starts (the only way
# a param reaches it); the envfolio startup hook reads both inside.
run-args = [
    "-e", "CB_FOLIO_SEED=${FOLIO_SEED}",
    "-e", "CB_FOLIO_SEED_MODE=${FOLIO_SEED_MODE}",
]

[params.FOLIO_SEED]
default = ""

[params.FOLIO_SEED_MODE]
default = "seed"
suggests = ["seed", "fill"]
