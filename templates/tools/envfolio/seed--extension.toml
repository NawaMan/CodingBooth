cb-version = "1.1.0"
display-name = "Seed from the Host"
display-disc = "Copy chosen EnvFolio items from the host's store into the booth, still encrypted, with the store key"
display-detail = """At each start, booth asks the host's folio which items FOLIO_SEED takes — the arguments you would give `folio exec`, e.g. `gh server @app1 --secrets` or `--use @app2/@prod --vars .booth/deploy.vars --secrets` — and copies just those, still encrypted, with the store's key id and public key, into .booth/.tmp/folio-seed/ (out of git, emptied at the next start). The store key comes too: its private key files, as the host's gpg keeps them (still encrypted with the key's passphrase), go into the booth's ~/.gnupg, and the booth's own gpg-agent asks for the passphrase, in the booth's terminal (the Console UI too), the first time a secret is opened. Nothing is decrypted on the host, the key is not unlocked there and no passphrase is asked there, so `folio exec -s gh -- git push` works in a remote or cloud booth too. That is the risk as well: the key comes along, protected only by its passphrase, and any code in the booth can copy the key file (and see the passphrase when it is typed there); passing values in from the host instead (`folio exec -s gh -- booth --select gh+token`) keeps the key out. A key on a smartcard cannot be copied: the items still come, with a warning, and only the secrets cannot be opened. Texts read with the public key alone. Items keep their paths (namespaces too), so the same `folio exec` command works in the booth and on the host (seed with the arguments you will run); a vars file must be inside the project, where both see it. FOLIO_SEED_MODE: `seed` makes the booth's store only when it has none (one kept by +store-cache is used as is); `fill` also adds the items an existing store lacks, when it uses the same key. Only entries, VAR=<name>, --secrets, --all, --use <@namespace> and --vars <file> (a path inside the project) are accepted — the value is run past folio on the host, and a project config may be someone else's — and each start lists the items it copied. Needs folio on the host; when it fails (a vars file naming a secret without --secrets, a missing entry), the booth does not start and folio's message says why."""
display-order = 92
auto-select = false
tags = ["secrets", "credential", "host"]

# The host side reads CB_FOLIO_SEED from these run-args before the container starts (the only way
# a param reaches it); the envfolio startup hook reads both inside.
run-args = [
    "-e", "CB_FOLIO_SEED=${FOLIO_SEED}",
    "-e", "CB_FOLIO_SEED_MODE=${FOLIO_SEED_MODE}",
]

[params.FOLIO_SEED]
default = ""

[params.FOLIO_SEED_MODE]
default = "seed"
suggests = ["seed", "fill"]
