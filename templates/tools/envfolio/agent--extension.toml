cb-version = "1.0.0"
display-name = "Host gpg-agent"
display-disc = "Decrypt with your host's gpg-agent: the key never enters the booth"
display-detail = """Mounts the host gpg-agent's extra socket (made for remote use: it decrypts and signs, but hands out no key) read-only into the booth, and points the booth's gpg at it. Then folio in the booth opens secrets — e.g. ones brought in by +seed — with your host key, which stays on the host: `folio exec -s gh -- git push`. A passphrase is asked on the host (its pinentry), or not at all while the agent has it cached. While the booth runs, code in it can ask your agent to decrypt anything encrypted to your key that it has, but cannot take the key. The socket is ${XDG_RUNTIME_DIR}/gnupg/S.gpg-agent.extra, gpg's default on Linux with a native engine; with no agent there the mount is skipped with a notice. Docker Desktop and macOS run containers in a VM that cannot reach a host socket."""
display-order = 93
auto-select = false
tags = ["secrets", "credential", "gpg", "agent"]

# Read-only: a client still connects to a socket through it, and the booth cannot replace the
# socket file. Expanded at run time from the host environment; with no XDG_RUNTIME_DIR the source
# does not exist and the missing-mount filter drops it (as openssh+agent does).
run-args = [
    "-v", "${XDG_RUNTIME_DIR:-/nonexistent}/gnupg/S.gpg-agent.extra:/run/cb-gpg-agent.sock:ro",
    "-e", "CB_GPG_AGENT_SOCK=/run/cb-gpg-agent.sock",
]
