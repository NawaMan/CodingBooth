cb-version = "1.0.0"
display-name = "Store Cache"
display-disc = "Keep the EnvFolio store and its GPG key across sessions (.booth/cache)"
display-detail = """Persists ~/.envfolio (the store: texts plain and signed, secrets encrypted) and ~/.gnupg (the keyring, including the store's private key, protected by its passphrase) in .booth/cache/, which stays on this machine and out of git. Without it both are lost when the container is recreated; envfolio store backup / restore is the portable alternative."""
display-order = 91
tags = ["persistence", "cache", "secrets"]

cache-dirs = [
    "home/coder/.envfolio:0700",
    "home/coder/.gnupg:0700",
]
