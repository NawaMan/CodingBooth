display-name = "Expose Excalidraw Port"
display-disc = "Expose Excalidraw port to host network"
display-order = 1
auto-select = false
tags = [
    "excalidraw",
    "port",
    "network"
]

run-args = [
    "-p", "${EXCALIDRAW_HOST_PORT}:${EXCALIDRAW_PORT}",
]

# Host-side port. Defaults to the port the service listens on, so moving the service
# moves the published port with it. Override only when the host port is already taken.
[params.EXCALIDRAW_HOST_PORT]
default = "${EXCALIDRAW_PORT}"
