cb-version = "1.0.0"
display-name = "Excalidraw"
primary = true
display-disc = "Excalidraw collaborative whiteboard tool"
display-detail = "Installs Excalidraw, a collaborative whiteboard tool for sketching diagrams and wireframes."
display-order = 26
requires = ["nodejs"]
tags = [
    "excalidraw",
    "whiteboard",
    "drawing",
    "collaboration"
]

[params.EXCALIDRAW_PORT]
default = "20400"
suggests = [
    "20400",
    "13333",
]

[segments]
"Boothfile--60" = """
setup excalidraw ${EXCALIDRAW_PORT}
"""
