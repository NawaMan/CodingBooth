display-name = "k3d"
display-disc = "k3s in Docker for lightweight local Kubernetes"
display-detail = "Installs k3d for running k3s clusters inside Docker. Lighter alternative to kind."
display-order = 61
tags = [
    "kubernetes",
    "docker",
    "k8s",
    "k3s",
]

[params.K3D_VERSION]
default = "latest"
suggests = ["latest", "5.7.5", "5.7.4"]

[segments]
Boothfile = """
setup k3d --version ${K3D_VERSION}
"""
