display-name = "Appwrite CLI Credentials"
display-disc = "Mount host Appwrite CLI credentials"
display-detail = "Seeds `~/.appwrite` from the host so `appwrite login` / `appwrite client` sessions carry into the booth. Missing host paths are dropped, so a machine that has never run the CLI still starts."
display-order = 90
auto-select = true
tags = ["credential", "appwrite"]

run-args = [
    # Linux / macOS (XDG-style home)
    "-v", "~/.appwrite:/etc/cb-home-seed/.appwrite:ro",
    # Windows
    "-v", "~/AppData/Roaming/appwrite:/etc/cb-home-seed/.appwrite:ro",
]
