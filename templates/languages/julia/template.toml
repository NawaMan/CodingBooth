cb-version = "1.0.0"
display-name = "Julia"
display-disc = "Julia for high-performance scientific and numerical computing"
display-detail = "Sets up a Julia development environment with configurable version. Ideal for scientific computing, data science, and numerical analysis."
display-order = 40
tags = [
    "julia",
    "scientific",
    "data-science"
]

[params.JULIA_VERSION]
default = "1.13.1"
# 1.11.3 dropped: its libopenlibm.so ships GNU_STACK=RWE (an executable-stack
# requirement), which this base's glibc/kernel refuses to load ("cannot enable
# executable stack as shared object requires") -- confirmed via readelf -lW
# against the official tarball; 1.12.7 and 1.13.0 both ship GNU_STACK=RW and
# are unaffected. Re-check with readelf before reintroducing an older release.
suggests = ["1.13.1", "1.12.7"]

[segments]
Boothfile = """
setup julia ${JULIA_VERSION}
"""
