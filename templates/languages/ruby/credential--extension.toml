# NOTE: This template has not been tested -- no time (sorry). Please report success or failure. :-p
display-name = "Gem Credentials"
display-disc = "Mount host Ruby gem credentials"
display-detail = """Seeds ~/.gem/credentials from the host, so pushing to RubyGems or pulling from a private gem \
source works inside the booth without re-entering an API key. Mounts read-only; a host path that \
does not exist is dropped before the container starts, so this is harmless to leave selected when \
you have no credentials file."""
auto-select = true
tags = ["ruby", "gem", "credential"]

run-args = [
    "-v", "~/.gem/credentials:/etc/cb-home-seed/.gem/credentials:ro"
]
