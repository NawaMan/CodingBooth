cb-version = "1.1.0"
display-name = "Ruby"
primary = true
display-disc = "Ruby language with gem package manager"
display-detail = "Sets up Ruby with the gem package manager and bundler. Supports version pinning via the RUBY_VERSION parameter."
display-order = 60
tags = [
    "ruby",
    "scripting"
]

[params.RUBY_VERSION]
default = "3.4"
suggests = ["3.4", "3.3", "3.2"]

# Image environment, not a shell profile. `booth exec` runs the command with no
# shell, so /etc/profile.d never runs: these mirror what the setup's profile sets.
[segments]
Boothfile = """
env RBENV_ROOT=/opt/rbenv
env GEM_HOME=/home/coder/.gem
env PATH=/home/coder/.gem/bin:/opt/rbenv/shims:/opt/rbenv/bin:$PATH
setup ruby ${RUBY_VERSION}
"""
