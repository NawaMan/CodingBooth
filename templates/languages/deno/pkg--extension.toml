display-name = "Deno Packages"
display-disc = "Deno package installer for third-party modules"
display-detail = """Records third-party modules in /home/coder/deno.json with `deno add`, so your code can import them \
by bare specifier — this adds importable dependencies, not global commands. Every entry needs its \
registry prefix; an unprefixed name is not accepted. Unversioned takes the newest release and \
`@version` pins one: `npm:cowsay`, or `npm:cowsay@1.6.0` (JSR reads `jsr:@std/yaml`, \
`jsr:@std/[email protected]`)."""
display-order = 10
auto-select = false
tags = ["deno", "packages"]

[params.DENO_PKGS]
default = ""
variadic = true

[segments]
"Boothfile--60" = """
install deno-pkg ${DENO_PKGS}
"""

[files.setups]
"deno-pkg--install.sh" = """
#!/bin/bash
set -Eeuo pipefail
trap 'echo "❌ Error on line $LINENO"; exit 1' ERR

if [ "$EUID" -ne 0 ]; then
    echo "❌ This script must be run as root (use sudo)" >&2
    exit 1
fi

if [ $# -eq 0 ] || [ -z "$1" ]; then
    echo "Usage: $0 <pkg1,pkg2,...>" >&2
    exit 1
fi

if ! command -v deno &> /dev/null; then
    echo "❌ Deno is not installed. Run deno--setup.sh first." >&2
    exit 1
fi

IFS=',' read -ra PKGS <<< "$1"
for pkg in "${PKGS[@]}"; do
    pkg=$(echo "$pkg" | xargs)
    if [ -n "$pkg" ]; then
        echo "📦 Installing: deno add $pkg"
        sudo -u coder bash -lc "cd /home/coder && deno add $pkg"
    fi
done
"""
