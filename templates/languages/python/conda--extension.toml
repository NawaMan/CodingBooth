cb-version = "1.1.0"
display-name = "Conda"
display-disc = "Conda environment and package manager"
display-detail = """Sets up conda as the booth's environment manager, then installs the packages listed in your \
project's .booth/requirements.txt with pip into the conda environment at build time. If the file is \
missing, the build still succeeds and this step is skipped. For packages resolved by conda itself \
rather than pip, see the conda Packages extension."""
display-order = 11
auto-select = false
tags = [
    "python",
    "data",
    "packages"
]

# Image environment, not a shell profile. `booth exec` runs the command with no
# shell, so /etc/profile.d never runs: these mirror what the setup's profile sets.
[segments]
Boothfile = """
env CONDA_PREFIX=/opt/conda
env CONDA_ENVS_DIRS=/opt/conda-envs
env CONDA_PKGS_DIRS=/opt/conda-pkgs
env CONDA_AUTO_ACTIVATE_BASE=false
env PY_STABLE=/opt/python
env PIP_CACHE_DIR=/opt/pip-cache
env PIP_DISABLE_PIP_VERSION_CHECK=1
env PYTHONUNBUFFERED=1
env PATH=/opt/python/bin:/opt/conda/bin:$PATH
setup conda
"""
"Boothfile--90" = """ 
run --mount=type=bind,target=/tmp/ctx                                               \
    if [ -f /tmp/ctx/.booth/requirements.txt ]; then                                \
         pip install -r /tmp/ctx/.booth/requirements.txt;                           \
    else echo "Warning: .booth/requirements.txt not found -- skipping pip install"; \
    fi
"""
