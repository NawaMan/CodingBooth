cb-version = "1.2.0"
display-name = "Python"
primary = true
display-disc = "Python with pip package manager and venv support"
display-detail = "Sets up a Python development environment with pip, venv, and configurable version. Includes PYTHONDONTWRITEBYTECODE optimization for containerized development."
display-order = 20
tags = [
    "python",
    "data",
    "scripting"
]

run-args = [
    # This prevent python from creating python cache `.pyc`
    "-e", "PYTHONDONTWRITEBYTECODE=1"
]

[params.PYTHON_VERSION]
default = "3.14.9"
suggests = [
    "3.14.9",  "3.14",
    "3.13.17", "3.13",
    "3.12.14", "3.12",
    "3.11.14", "3.11",
    "3.10.19", "3.10",
]

# Image environment, not a shell profile. `booth exec` runs the command with no
# shell, so /etc/profile.d never runs: these mirror what the setup's profile sets.
# The per-series venv the profile picks at login is computed per shell; /opt/python
# is the same interpreter.
[segments]
Boothfile = """
env CB_PYENV_ROOT=/opt/pyenv
env CB_PY_STABLE=/opt/python
env CB_VENV_ROOT=/opt/venvs
env PIP_CACHE_DIR=/opt/pip-cache
env PIP_DISABLE_PIP_VERSION_CHECK=1
env PYTHONUNBUFFERED=1
env VIRTUAL_ENV=/opt/python
env PATH=/usr/local/uv/bin:/usr/local/uv:/opt/pyenv/bin:/opt/python/bin:$PATH
setup python ${PYTHON_VERSION}
"""
