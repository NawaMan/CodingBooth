display-name = "Python"
display-disc = "Python language with pip"
display-order = 20
tags = [
    "python",
    "data",
    "scripting"
]

run-args = [
    # This prevent python from creating python cache `.pyc`
    "-e", "PYTHONDONTWRITEBYTECODE=1"
]

[params.PYTHON_VERSION]
default = "3.13.12"
suggests = [
    "3.14.2",  "3.14",
    "3.13.12", "3.13",
    "3.12.12", "3.12",
    "3.11.14", "3.11",
    "3.10.19", "3.10",
]
