cb-version = "0.2.0"
display-name = "pip Cache"
display-disc = "Share the pip download cache across booths"
display-detail = """Mounts the machine-wide volume booth-cache-pip on /opt/pip-cache. That is where the Python \
setup points PIP_CACHE_DIR, including from its login profile, so the volume is the cache pip already uses. \
An image build can leave a root-owned directory, or files owned by the build-time uid, inside that \
volume. booth-entry reads .booth/owner-permission.yaml and takes coder:coder over everything under the \
mount, files included, setting mode 1777 on the directories, so coder can store new downloads. This is the download cache, not a virtualenv. The pip requirements extension still \
installs into the image at build time; this volume does not feed that build. Reset the cache with \
`docker volume rm booth-cache-pip`."""
display-order = 13
auto-select = false
tags = ["python", "pip", "cache"]

run-args = [
    "-e", "PIP_CACHE_DIR=/opt/pip-cache",
    "-v", "booth-cache-pip:/opt/pip-cache",
]

[[owner-permission]]
path = "/opt/pip-cache"
user = "coder"
group = "coder"
mode = "1777"
