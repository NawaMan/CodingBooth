cb-version = "2.1.0"
display-name = "Cargo Cache"
display-disc = "Mount host Cargo registry cache"
display-detail = """Bind-mounts your host's ~/.cargo/registry into the booth, so cargo reuses whatever you've already \
downloaded on the host instead of re-fetching it inside the container, and shares one cache across \
every booth using it; booth creates the folder when it is missing. The mount is writable, so booth asks for consent before starting (code in the \
booth can write to your host home) and a non-interactive start needs --privileged-allowed. Not \
selected by default: registry-cache keeps a per-project cache in .booth/cache/ without touching the \
host. Unlike the cargo fetch extension, nothing is baked into the image itself."""
auto-select = false
tags = ["rust", "cargo", "cache"]

run-args = [
    "-v", "$HOME/.cargo/registry:/home/coder/.cargo/registry:create"
]
