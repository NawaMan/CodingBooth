cb-version = "1.0.1"
display-name = "cargo fetch"
display-disc = "Pre-download Cargo dependencies into the image"
display-detail = """Pre-downloads your project's Cargo dependencies into the booth user's ~/.cargo/registry at \
build time with `cargo fetch`, so a later `cargo build` inside the booth resolves them from the image \
instead of the network -- including in a booth started offline. Works for a single crate and for a \
workspace. This is for your project's own dependencies; it does not build your code. If Cargo.toml is \
missing, the build still succeeds and this step is skipped. The step sees the whole project, so it \
re-runs when any file changes. registry-cache (selected by default) mounts over ~/.cargo/registry \
and hides what this baked in, so pair the two as rust+cargo-build~registry-cache."""
display-order = 15
auto-select = false
tags = ["rust", "cargo", "packages"]

[segments]
# Fetched in place, in the mounted project: cargo needs every workspace member's
# manifest and source layout, so copying the root Cargo.toml alone made `cargo
# fetch` fail. rw lets it write a missing Cargo.lock; the writes are discarded.
# CARGO_HOME points at the booth user's own registry -- as root, cargo would fill
# /root/.cargo, which the booth user can neither read nor use.
"Boothfile--90" = """
run --mount=type=bind,target=/tmp/ctx,rw \
  if [ -f /tmp/ctx/Cargo.toml ]; then \
    CARGO_HOME=/home/coder/.cargo cargo fetch --manifest-path /tmp/ctx/Cargo.toml \
    && chown -R coder:coder /home/coder/.cargo; \
  fi
"""
