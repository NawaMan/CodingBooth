# NOTE: This template has not been tested -- no time (sorry). Please report success or failure. :-p
display-name = "Cargo Credentials"
display-disc = "Mount host Rust/Cargo credentials"
display-detail = """Seeds ~/.cargo/credentials.toml from the host, so publishing to crates.io or pulling from a \
private registry works inside the booth without re-entering a token. Mounts read-only; a host path \
that does not exist is dropped before the container starts, so this is harmless to leave selected \
when you have no credentials file."""
auto-select = true
tags = ["rust", "cargo", "credential"]

run-args = [
    "-v", "~/.cargo/credentials.toml:/etc/cb-home-seed/.cargo/credentials.toml:ro"
]
