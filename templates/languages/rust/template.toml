display-name = "Rust"
primary = true
display-disc = "Rust toolchain with Cargo and rustup"
display-detail = "Sets up the Rust development environment with rustup, Cargo package manager, and configurable version. Includes rust-analyzer for IDE integration."
display-order = 40
tags = [
    "rust",
    "systems",
    "compiled"
]

run-args = [
    "-e", "CARGO_NET_GIT_FETCH_WITH_CLI=true",
]

[params.RUST_VERSION]
default = "stable"
suggests = [
    "stable",
    "nightly",
    "1.84.0",
    "1.83.0",
    "1.82.0",
    "1.81.0",
]

[segments]
Boothfile = """
setup rust ${RUST_VERSION}
"""
