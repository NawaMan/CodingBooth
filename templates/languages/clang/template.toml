cb-version = "1.1.0"
display-name = "Clang (C/C++)"
primary = true
display-disc = "LLVM/Clang toolchain for C and C++"
display-detail = "Installs LLVM/Clang (clang, clang++, clangd, clang-tidy, clang-format, lld, libc++, libomp). Sets clang as the default C/C++ compiler via update-alternatives. Coexists with GCC."
display-order = 41
tags = [
    "clang",
    "llvm",
    "c",
    "cpp",
    "systems",
    "compiled",
]

[params.LLVM_VERSION]
default = "22"
suggests = ["22", "21", "20", "18"]

# Image environment, not a shell profile. `booth exec` runs the command with no
# shell, so /etc/profile.d never runs: these mirror what the setup's profile sets.
[segments]
Boothfile = """
env CLANG_HOME=/opt/clang-stable
env PATH=/opt/clang-stable/bin:$PATH
env CC=clang
env CXX=clang++
setup clang --version ${LLVM_VERSION}
"""
