cb-version = "1.1.0"
display-name = "C#"
display-disc = "C# programming language with .NET SDK"
display-detail = "Installs the .NET SDK (dotnet) using the official installer with configurable channel version. Includes the dotnet CLI, C# compiler, and NuGet package manager. Telemetry is disabled by default in the container environment."
display-order = 35
tags = [
    "csharp",
    "dotnet",
    "backend",
    "web"
]

[params.DOTNET_CHANNEL]
default = "10.0"
suggests = [
    "10.0",
    "9.0",
    "8.0",
    "LTS",
    "current",
]

# Image environment, not a shell profile. `booth exec` runs the command with no
# shell, so /etc/profile.d never runs: these mirror what the setup's profile sets.
[segments]
Boothfile = """
env DOTNET_ROOT=/opt/dotnet-stable
env NUGET_PACKAGES=/opt/nuget-packages
env DOTNET_CLI_TELEMETRY_OPTOUT=1
env DOTNET_NOLOGO=1
env PATH=/home/coder/.dotnet/tools:/opt/dotnet-stable:$PATH
setup dotnet --channel ${DOTNET_CHANNEL}
"""
