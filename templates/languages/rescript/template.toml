display-name = "ReScript"
display-disc = "ReScript: typed language compiling to JavaScript"
display-detail = "Installs the ReScript compiler via npm. Successor to ReasonML; produces fast, readable JavaScript. Requires Node.js (auto-included)."
display-order = 77
tags = [
    "rescript",
    "reason",
    "functional",
    "frontend",
    "web",
]
requires = ["nodejs"]

[params.RESCRIPT_VERSION]
default = "latest"
suggests = ["latest", "11.1.4", "11.0.1", "10.1.4"]

[segments]
"Boothfile--60" = """
setup rescript --version ${RESCRIPT_VERSION}
"""
