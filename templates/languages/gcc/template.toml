cb-version = "1.1.0"
display-name = "GCC (C/C++)"
primary = true
display-disc = "GNU Compiler Collection for C and C++"
display-detail = "Installs GCC (gcc, g++) for C and C++ development. Registered with update-alternatives at priority 50; if Clang is also installed, Clang remains the default but both compilers are usable."
display-order = 42
tags = [
    "gcc",
    "gnu",
    "c",
    "cpp",
    "systems",
    "compiled",
]

[params.GCC_VERSION]
default = "15"
suggests = ["15", "14", "13", "12"]

# Image environment, not a shell profile. `booth exec` runs the command with no
# shell, so /etc/profile.d never runs: these mirror what the setup's profile sets.
# CC/CXX stay unset: cc resolves to gcc through update-alternatives, and clang's
# own CC must win when both are selected.
[segments]
Boothfile = """
env GCC_HOME=/opt/gcc-stable
env PATH=/opt/gcc-stable/bin:$PATH
setup gcc --version ${GCC_VERSION}
"""
