cb-version = "1.2.0"
display-name = "Gradle"
display-disc = "Gradle build tool for Java and JVM projects"
display-detail = """Installs Gradle itself, since the Java template ships no default build tool -- pick this or Maven. \
Pin GRADLE_VERSION for a reproducible build; the default tracks a recent release. Project \
build.gradle(.kts) dependencies are a different extension (gradle dependencies)."""
display-order = 11
auto-select = false
tags = [
    "build", "gradle"
]

[params.GRADLE_VERSION]
default = "9.8.2"
suggests = [
    "9.8.2", "9.7.1",
    "8.14.4",
]

# Image environment, not a shell profile. `booth exec` runs the command with no
# shell, so /etc/profile.d never runs: these mirror what the setup's profile sets.
[segments]
Boothfile = """
env GRADLE_HOME=/opt/gradle-stable
env PATH=/opt/gradle-stable/bin:$PATH
setup gradle "${GRADLE_VERSION}"
"""
