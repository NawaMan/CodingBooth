cb-version = "1.1.0"
display-name = "Maven"
display-disc = "Apache Maven build tool for Java projects"
display-detail = """Installs Maven itself, since the Java template ships no default build tool -- pick this or Gradle. \
Pin MAVEN_VERSION for a reproducible build; the default tracks a recent release. Project pom.xml \
dependencies are a different extension (mvn dependency:resolve)."""
display-order = 10
auto-select = false
tags = [
    "build",
    "maven"
]

[params.MAVEN_VERSION]
default = "3.9.16"
suggests = [
    "3.9.16", "3.9",
    "4.0.0-rc-5",
]

# Image environment, not a shell profile. `booth exec` runs the command with no
# shell, so /etc/profile.d never runs: these mirror what the setup's profile sets.
[segments]
Boothfile = """
env MAVEN_HOME=/opt/maven-stable
env PATH=/opt/maven-stable/bin:$PATH
setup mvn ${MAVEN_VERSION}
"""
