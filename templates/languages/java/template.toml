display-name = "Java"
primary = true
display-disc = "Java JDK with configurable version and distribution"
display-detail = "Installs the Java Development Kit (JDK) with configurable version and distribution (default: Temurin). Supports version pinning via JDK_VERSION and JDK_DISTRO parameters."
display-order = 30
tags = [
    "java",
    "jvm",
    "backend",
    "awesome"
]

[params.JDK_VERSION]
default = "25"
suggests = [
    "25",
    "21",
    "17",
    "11",
    "8"
]

[params.JDK_VENDOR]
default = "temurin"
suggests = [
    "temurin",
    "corretto",
    "openjdk"
]

[segments]
Boothfile = """
setup jdk ${JDK_VERSION} ${JDK_VENDOR}
"""