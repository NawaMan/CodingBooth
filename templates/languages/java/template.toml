cb-version = "1.1.0"
display-name = "Java"
primary = true
display-disc = "Java JDK with configurable version and distribution"
display-detail = """Installs the Java Development Kit (JDK) with configurable version and distribution \
(default: Temurin). Supports version pinning via JDK_VERSION and JDK_VENDOR.

JDK_VENDOR = graalvm installs GraalVM instead of a stock OpenJDK build -- its `native-image` tool \
(for ahead-of-time compiling a JAR to a standalone native binary) ships bundled in the JDK itself, \
no separate `gu install` step. Temurin/Corretto download directly; graalvm (and any other vendor) \
installs through JBang's own JDK manager instead, which is a less-exercised path in this catalog -- \
report success or failure."""
display-order = 30
tags = [
    "java",
    "jvm",
    "backend",
    "awesome"
]

[params.JDK_VERSION]
default = "25"
suggests = [
    "25",
    "21",
    "17",
    "11",
    "8"
]

[params.JDK_VENDOR]
default = "temurin"
suggests = [
    "temurin",
    "corretto",
    "openjdk",
    "graalvm"
]

# Image environment, not a shell profile. `booth exec` runs the command with no
# shell, so /etc/profile.d never runs: these mirror what the setup's profile sets.
# JAVA_HOME/bin goes last, as in the profile, so a version manager can take precedence.
[segments]
Boothfile = """
env JAVA_HOME=/opt/jdk${JDK_VERSION}
env CB_JAVA_HOME=/opt/jdk${JDK_VERSION}
env CB_JDK_VERSION=${JDK_VERSION}
env PATH=$PATH:/opt/jdk${JDK_VERSION}/bin
setup jdk ${JDK_VERSION} ${JDK_VENDOR}
"""