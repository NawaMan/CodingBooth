cb-version = "0.2.0"
display-name = "Ant"
display-disc = "Apache Ant build tool for Java projects"
display-detail = """Installs Ant itself, since the Java template ships no default build tool -- pick this, \
Gradle, or Maven. Ant predates both and has no built-in dependency resolution of its own (that's \
what Ivy or a manually-managed lib/ directory is for); reach for it for an existing build.xml-driven \
project rather than starting a new one. Pin ANT_VERSION for a reproducible build; the default \
tracks a recent release."""
display-order = 13
auto-select = false
tags = [
    "build",
    "ant",
]

[params.ANT_VERSION]
default = "1.10.18"
suggests = [
    "1.10.18",
    "1.10.15",
]

# Image environment, not a shell profile. `booth exec` runs the command with no
# shell, so /etc/profile.d never runs: these mirror what the setup's profile sets.
[segments]
Boothfile = """
env ANT_HOME=/opt/ant-stable
env PATH=/opt/ant-stable/bin:$PATH
setup ant ${ANT_VERSION}
"""
