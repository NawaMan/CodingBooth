display-name = ".NET Tools"
display-disc = "Install global .NET tools via dotnet tool install"
display-detail = """Installs NuGet-distributed .NET global tools into ~/.dotnet/tools (on PATH via the .NET profile) — \
dotnet-ef for the Entity Framework CLI, csharpier for formatting, or any other `dotnet tool \
install --global` package. Same extension as under the C# template. Unversioned takes the newest \
release, `package@version` pins one, which booth translates into dotnet's own `--version`: \
`dotnet-ef`, or `dotnet-ef@8.0.11`."""
display-order = 10
auto-select = false
tags = [
    "dotnet",
    "csharp",
    "tools",
    "packages",
    "ef",
]

[params.DOTNET_PKGS]
default = ""
variadic = true

[segments]
"Boothfile--60" = """
install dotnet ${DOTNET_PKGS}
"""
