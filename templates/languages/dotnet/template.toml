display-name = ".NET"
primary = true
display-disc = ".NET SDK with C#, F#, and VB.NET support"
display-detail = "Installs the .NET SDK using the official installer with configurable channel version. Includes the dotnet CLI, NuGet package manager, and support for C#, F#, and VB.NET. Telemetry is disabled by default in the container environment."
display-order = 35
tags = [
    "dotnet",
    "csharp",
    "fsharp",
    "backend",
    "web"
]

[params.DOTNET_CHANNEL]
default = "9.0"
suggests = [
    "9.0",
    "8.0",
    "6.0",
    "LTS",
    "current",
]

[segments]
Boothfile = """
setup dotnet --channel ${DOTNET_CHANNEL}
"""
