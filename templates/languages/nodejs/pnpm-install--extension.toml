display-name = "pnpm install"
display-disc = "Pre-install pnpm dependencies from package.json into the image"
display-order = 17
auto-select = false
tags = ["nodejs", "pnpm", "packages"]

[segments]
"Boothfile--60" = """
install npm pnpm
"""
"Boothfile--90" = """
run --mount=type=bind,target=/tmp/ctx \
  if [ -f /tmp/ctx/package.json ]; then \
    mkdir -p /opt/pnpm-cache \
    && cp /tmp/ctx/package.json /opt/pnpm-cache/ \
    && cp /tmp/ctx/pnpm-lock.yaml /opt/pnpm-cache/ 2>/dev/null || true \
    && cp /tmp/ctx/pnpm-workspace.yaml /opt/pnpm-cache/ 2>/dev/null || true \
    && cp /tmp/ctx/.npmrc /opt/pnpm-cache/ 2>/dev/null || true \
    && cd /opt/pnpm-cache && pnpm install; \
  fi
"""
"startup--60.sh" = """
# Restore pre-installed node_modules from image cache if missing
if [ -d /opt/pnpm-cache/node_modules ] && [ ! -d node_modules ]; then
  echo "📦 Restoring cached node_modules ..."
  cp -a /opt/pnpm-cache/node_modules .
fi
"""
