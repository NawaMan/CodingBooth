cb-version = "1.0.2"
display-name = "Nim"
display-disc = "Statically-typed compiled systems language"
display-detail = "Installs the Nim compiler (nim, nimble, nimsuggest) under /opt/nim-stable. x86_64 from nim-lang.org's release tarball; arm64, which nim-lang.org does not publish, from CodingBoothPrebuilt."
display-order = 85
tags = [
    "nim",
    "compiled",
    "systems",
]

[params.NIM_VERSION]
default = "latest"
suggests = ["latest"]

[segments]
Boothfile = """
setup nim --version ${NIM_VERSION}
"""
