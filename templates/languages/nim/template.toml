cb-version = "1.0.3"
display-name = "Nim"
display-disc = "Statically-typed compiled systems language"
display-detail = "Installs the Nim compiler (nim, nimble, nimsuggest) under /opt/nim-stable. Comes prebuilt (sha256-checked) from CodingBoothPrebuilt on x86_64 and arm64 alike; a version not prebuilt is built from nim-lang.org's source tarball."
display-order = 85
tags = [
    "nim",
    "compiled",
    "systems",
]

[params.NIM_VERSION]
default = "latest"
suggests = ["latest"]

[segments]
Boothfile = """
setup nim --version ${NIM_VERSION}
"""
