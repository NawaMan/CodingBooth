display-name = "Crystal"
display-disc = "Compiled, statically-typed language with Ruby-like syntax"
display-detail = "Installs the Crystal compiler and shards (Crystal's package manager) under /opt/crystal-stable. Single-binary tarball release from crystal-lang/crystal."
display-order = 84
tags = [
    "crystal",
    "compiled",
    "ruby-like",
]

[params.CRYSTAL_VERSION]
default = "latest"
suggests = ["latest"]

[segments]
Boothfile = """
setup crystal --version ${CRYSTAL_VERSION}
"""
