cb-version = "1.1.0"
display-name = "Go Notebook Kernel"
display-disc = "GoNB Jupyter notebook kernel for Go"
display-order = 5
auto-select = false
requires = ["notebook"]
tags = [
    "go",
    "kernel",
    "notebook"
]

[params.GONB_VERSION]
default = "0.11.5"
suggests = [
    "0.11.5",
    "0.11.4",
]

[segments]
"Boothfile--70" = """
setup go-nb-kernel --version ${GONB_VERSION}
"""
