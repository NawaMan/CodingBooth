display-name = "go mod download"
display-disc = "Pre-download Go module dependencies into the image"
display-detail = """Pre-downloads your project's Go module dependencies from go.mod/go.sum into the image's module \
cache at build time, so a later `go build` inside the booth resolves them from cache instead of the \
network. This is for your project's own dependencies, as opposed to the go Packages extension's ad \
hoc dev tools. If go.mod is missing, the build still succeeds and this step is skipped."""
display-order = 15
auto-select = false
tags = ["go", "packages"]

[segments]
"Boothfile--90" = """
run --mount=type=bind,target=/tmp/ctx \
  if [ -f /tmp/ctx/go.mod ]; then \
    mkdir -p /opt/go-mod-cache \
    && cp /tmp/ctx/go.mod /tmp/ctx/go.sum /opt/go-mod-cache/ 2>/dev/null || true \
    && cd /opt/go-mod-cache && GOPATH=/home/coder/go go mod download; \
  fi
"""
