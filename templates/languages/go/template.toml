cb-version = "1.2.0"
display-name = "Go"
primary = true
display-disc = "Go toolchain with gopls LSP and Delve debugger"
display-detail = "Provides a complete Go development environment including the Go compiler, gopls language server for IDE integration, and Delve debugger. Supports version pinning via the GO_VERSION parameter."
display-order = 10
tags = [
    "go",
    "golang",
    "backend"
]

[params.GO_VERSION]
default = "1.27.3"
suggests = [
    "1.27.3",  "1.27.0",
    "1.26.10", "1.26.0",
    "1.25.7",  "1.25.0",
    "1.24.13", "1.24.0",
    "1.23.12", "1.23.0",
]

# Image environment, not a shell profile. `booth exec` runs the command with no
# shell, so /etc/profile.d never runs: these mirror what the setup's profile sets.
[segments]
Boothfile = """
env GOPATH=/home/coder/go
env GOBIN=/home/coder/go/bin
env PATH=/home/coder/go/bin:/usr/local/go-current/bin:$PATH
setup go ${GO_VERSION}                                # GO tool chain
install go golang.org/x/tools/gopls@latest            # GO language server
install go github.com/go-delve/delve/cmd/dlv@latest   # Debugger
"""
