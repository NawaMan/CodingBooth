display-name = "composer install"
display-disc = "Pre-install Composer dependencies into the image"
display-order = 15
auto-select = false
tags = ["php", "composer", "packages"]

[segments]
"Boothfile--90" = """
run --mount=type=bind,target=/tmp/ctx \
  if [ -f /tmp/ctx/composer.json ]; then \
    mkdir -p /opt/composer-cache \
    && cp /tmp/ctx/composer.json /opt/composer-cache/ \
    && cp /tmp/ctx/composer.lock /opt/composer-cache/ 2>/dev/null || true \
    && cd /opt/composer-cache && composer install --no-scripts --no-autoloader; \
  fi
"""
"startup--60.sh" = """
# Restore pre-installed vendor from image cache if missing
if [ -d /opt/composer-cache/vendor ] && [ ! -d vendor ]; then
  echo "📦 Restoring cached vendor ..."
  cp -a /opt/composer-cache/vendor .
  composer dump-autoload 2>/dev/null || true
fi
"""
