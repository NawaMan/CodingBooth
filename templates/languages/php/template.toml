display-name = "PHP"
display-disc = "PHP language with Composer package manager"
display-detail = "Installs the PHP CLI with common extensions. Pin the version with PHP_VERSION. Add the Composer extension (`php+composer`) to install Composer globally; `+composer-install` then pre-installs project composer.json deps."
display-order = 62
tags = [
    "php",
    "web"
]

[params.PHP_VERSION]
default = "8.5"
suggests = ["8.5", "8.4", "8.3"]

[segments]
Boothfile = """
setup php --version ${PHP_VERSION}
"""
