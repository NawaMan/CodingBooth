display-name = "PHP"
display-disc = "PHP language with Composer package manager"
display-detail = "Installs PHP with Composer for dependency management. Supports version pinning via the PHP_VERSION parameter."
display-order = 62
tags = [
    "php",
    "web"
]

[params.PHP_VERSION]
default = "8.3"
suggests = ["8.3", "8.2", "8.1"]

[segments]
Boothfile = """
setup php --version ${PHP_VERSION}
"""
