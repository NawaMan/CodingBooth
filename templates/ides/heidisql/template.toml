cb-version = "0.3.0"
display-name = "HeidiSQL"
display-disc = "Native Linux HeidiSQL database GUI"
display-detail = "Installs HeidiSQL's native Linux build (currently beta upstream), a lightweight GUI for MySQL, MariaDB, PostgreSQL, SQL Server, and SQLite. Requires a desktop variant. Comes prebuilt from CodingBoothPrebuilt on amd64 and arm64."
display-order = 40
tags = [
    "heidisql",
    "database",
    "sql",
    "gui",
]

[params.HEIDISQL_VERSION]
default = "latest"
suggests = ["latest", "12.22"]

[segments]
"Boothfile--60" = """
setup heidisql --version ${HEIDISQL_VERSION}
"""
