display-name = "GoLand"
display-disc = "JetBrains GoLand IDE for Go development"
display-detail = """Installs JetBrains GoLand IDE for Go development with advanced refactoring and debugging. \
Requires a desktop variant.

WARNING: GoLand is commercial with no free tier -- unlike IntelliJ IDEA/PyCharm's Community \
Editions in this catalog, you need your own JetBrains license (or trial) to use it past the \
evaluation window. This setup only downloads and installs the IDE; per the JetBrains EULA, \
distributing an image with it pre-installed is not allowed even without an active license."""
display-order = 26
tags = [
    "jetbrains",
    "goland",
    "ide",
    "go"
]

