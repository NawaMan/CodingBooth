display-name = "PhpStorm"
display-disc = "JetBrains PhpStorm IDE for PHP development"
display-detail = """Installs JetBrains PhpStorm IDE for PHP development with framework support. Requires \
a desktop variant.

WARNING: PhpStorm is commercial with no free tier -- unlike IntelliJ IDEA/PyCharm's Community \
Editions in this catalog, you need your own JetBrains license (or trial) to use it past the \
evaluation window. This setup only downloads and installs the IDE; per the JetBrains EULA, \
distributing an image with it pre-installed is not allowed even without an active license."""
display-order = 30
tags = [
    "jetbrains",
    "phpstorm",
    "ide",
    "php"
]

[segments]
"Boothfile--60" = """
setup jetbrains phpstorm
"""
