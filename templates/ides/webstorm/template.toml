display-name = "WebStorm"
display-disc = "JetBrains WebStorm IDE for JavaScript/TypeScript"
display-detail = """Installs JetBrains WebStorm IDE for JavaScript and TypeScript development. Requires \
a desktop variant.

WARNING: WebStorm is commercial with no free tier -- unlike IntelliJ IDEA/PyCharm's Community \
Editions in this catalog, you need your own JetBrains license (or trial) to use it past the \
evaluation window. This setup only downloads and installs the IDE; per the JetBrains EULA, \
distributing an image with it pre-installed is not allowed even without an active license."""
display-order = 28
tags = [
    "jetbrains",
    "webstorm",
    "ide",
    "javascript",
    "web"
]

