display-name = "WebStorm Open Project"
display-disc = "Open the workspace project automatically, no Open-project wizard"
display-detail = "Like IntelliJ, WebStorm needs no separate workspace registration -- a folder with a package.json (or any JS/TS sources) opens directly, no import wizard. WebStorm's \"recent projects\" list lives in internal app state, not an editable file, so it can't be safely pre-seeded -- instead this patches the IDE's own starter script to default to opening the project directory whenever launched with no arguments, which both the CLI shim and the desktop icon already funnel through."
display-order = 1
auto-select = true
tags = [
    "jetbrains", "webstorm", "ide", "javascript", "open"
]

[segments]
"Boothfile--65" = """
setup jetbrains-import-project webstorm
"""
