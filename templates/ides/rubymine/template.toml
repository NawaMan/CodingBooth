display-name = "RubyMine"
display-disc = "JetBrains RubyMine IDE for Ruby development"
display-detail = """Installs JetBrains RubyMine IDE for Ruby and Rails development. Requires a desktop \
variant.

WARNING: RubyMine is commercial with no free tier -- unlike IntelliJ IDEA/PyCharm's Community \
Editions in this catalog, you need your own JetBrains license (or trial) to use it past the \
evaluation window. This setup only downloads and installs the IDE; per the JetBrains EULA, \
distributing an image with it pre-installed is not allowed even without an active license."""
