display-name = "CLion"
display-disc = "JetBrains CLion IDE for C and C++ development"
display-detail = """Installs JetBrains CLion IDE for C and C++ development with CMake integration. \
Requires a desktop variant.

WARNING: CLion is commercial with no free tier -- unlike IntelliJ IDEA/PyCharm's Community \
Editions in this catalog, you need your own JetBrains license (or trial) to use it past the \
evaluation window. This setup only downloads and installs the IDE; per the JetBrains EULA, \
distributing an image with it pre-installed is not allowed even without an active license."""
display-order = 32
tags = [
    "jetbrains",
    "clion",
    "ide",
    "c",
    "cpp"
]

[segments]
"Boothfile--60" = """
setup jetbrains clion
"""
