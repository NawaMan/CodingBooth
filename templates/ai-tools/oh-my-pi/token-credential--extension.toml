cb-version = "0.1.0"
display-name = "Oh My Pi Token Credential"
display-disc = "Authenticate Oh My Pi with a Claude long-lived OAuth token"
display-detail = "Passes `ANTHROPIC_OAUTH_TOKEN` from `.booth/.env` into the booth. Create the token on the host with `claude setup-token` (a Claude Pro/Max/Team/Enterprise subscription, not API billing), and omp runs Anthropic models on that subscription. Alternative to the host-file \"Oh My Pi Credentials\" extension for CI, headless hosts, or machines with no `~/.omp`. Select it *instead* of the file mount: `oh-my-pi+token-credential~credential`. Other providers' API keys (`OPENAI_API_KEY`, `XAI_API_KEY`, ...) can be passed the same way with `--env`."
display-order = 93
auto-select = false
tags = ["credential", "oh-my-pi", "omp", "token", "oauth", "anthropic"]

# Alternative to the "Oh My Pi Credentials" extension for hosts with no
# ~/.omp/agent/agent.db to mount.
#
# Generate on the host with `claude setup-token`, then put
# ANTHROPIC_OAUTH_TOKEN=<token> in .booth/.env. Unset expands to empty, so
# this stays harmless if selected without a token configured.
run-args = [
    "-e", "ANTHROPIC_OAUTH_TOKEN=${ANTHROPIC_OAUTH_TOKEN}",
]
