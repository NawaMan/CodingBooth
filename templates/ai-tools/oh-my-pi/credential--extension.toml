display-name = "Oh My Pi Credentials"
display-disc = "Mount host Oh My Pi auth store and settings"
display-detail = "Seeds `~/.omp/agent/agent.db` (OAuth tokens and API credentials) and `~/.omp/agent/config.yml` (model roles and UI settings). Deliberately does **not** seed the rest of `~/.omp`: `agent/sessions/`, `logs/`, `natives/`, `puppeteer/`, and `run/` are host-side transcripts, caches, and runtime state."
display-order = 90
auto-select = true
tags = ["credential", "oh-my-pi", "omp"]

run-args = [
    # Auth store + settings only — see display-detail for what is left behind.
    "-v", "~/.omp/agent/agent.db:/etc/cb-home-seed/.omp/agent/agent.db:ro",
    "-v", "~/.omp/agent/config.yml:/etc/cb-home-seed/.omp/agent/config.yml:ro",
]
