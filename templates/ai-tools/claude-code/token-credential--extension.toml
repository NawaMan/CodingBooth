display-name = "Claude Code Token Credential"
display-disc = "Authenticate Claude Code with a long-lived OAuth token"
display-order = 92
auto-select = false
tags = ["credential", "claude", "token", "oauth"]

# Alternative to the "Claude Code Credentials" extension for hosts with no
# ~/.claude files to mount (CI, a remote/headless box, or a host that only
# ever authenticates via this token already).
#
# Generate on the host with `claude setup-token` (requires a Pro/Max/Team/
# Enterprise subscription -- not API/console billing), then put
# CLAUDE_CODE_OAUTH_TOKEN=<token> in .booth/.env. Unset expands to empty, so
# this stays harmless if selected without a token configured.
run-args = [
    "-e", "CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN}",
]
