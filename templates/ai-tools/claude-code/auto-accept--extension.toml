display-name = "Accept Edits"
display-disc = "Auto-accept all Claude Code operations (safe inside a booth)"
display-order = 10
auto-select = false
tags = [
    "claude",
    "permissions",
    "edits"
]

# No blanket MCP allow rule. Claude Code rejects a bare "mcp__*" in `allow` — a glob is
# permitted only in the tool position, after a literal mcp__<server>__ prefix — so the rule
# never took effect and instead raised a "Settings Warning" modal that had to be dismissed
# before the session could start, on every single launch. Allowing a server means naming it:
# add "mcp__<server>__*" to a project's own .claude/settings.json. Deny and ask rules still
# accept wildcards anywhere, so the deny list below is unaffected.
[files.home-seed]
".claude/settings.json" = """
{
    "permissions": {
        "allow": [
            "Bash",
            "Edit",
            "Write",
            "Read",
            "Glob",
            "Grep",
            "NotebookEdit",
            "WebFetch",
            "WebSearch",
            "TodoWrite",
            "TaskCreate",
            "TaskUpdate"
        ],
        "deny": [
            "Bash(git push --force*)",
            "Bash(git push * --force*)",
            "Bash(git reset --hard*)",
            "Bash(git clean -f*)",
            "Bash(git checkout -- .)",
            "Bash(git checkout -- .*)",
            "Bash(git branch -D*)",
            "Bash(git restore .)",
            "Bash(git restore -- .)",
            "Bash(git restore --staged *)",
            "Bash(git push * --delete*)",
            "Bash(git push * :*)",
            "Bash(git stash clear)",
            "Bash(rm -rf /*)",
            "Bash(rm -rf /)",
            "Bash(chmod 777 *)",
            "Bash(curl *|bash*)",
            "Bash(wget *|bash*)",
            "Bash(curl *| bash*)",
            "Bash(wget *| bash*)"
        ]
    }
}
"""

[segments]
"startup--90.sh" = """
# Detect user-bound volumes and protect them from accidental rm -rf
# by patching Claude Code's deny rules with jq.
settings="$HOME/.claude/settings.json"
if [ -f "$settings" ] && command -v jq &>/dev/null; then
    # Collect non-system mount points from mountinfo.
    # These are likely user-bound persistent volumes.
    protected=$(awk '{print $5}' /proc/self/mountinfo 2>/dev/null \
        | sort -u \
        | grep -v -xE '/' \
        | grep -v -E '^/(proc|sys|dev|run|tmp)(/|$)' \
        | grep -v -E '^/etc/(resolv\\.conf|hostname|hosts)$' \
        || true)
    if [ -n "$protected" ]; then
        deny_rules='[]'
        while IFS= read -r mp; do
            deny_rules=$(echo "$deny_rules" | jq --arg p "$mp" \
                '. + ["Bash(rm -rf \\($p))", "Bash(rm -rf \\($p)/*)"]')
        done <<< "$protected"
        jq --argjson new_deny "$deny_rules" '
            .permissions.deny = ((.permissions.deny // []) + $new_deny | unique)
        ' "$settings" > "${settings}.tmp" && command mv -f "${settings}.tmp" "$settings"
    fi
fi
"""
