display-name = "Accept Edits"
display-disc = "Auto-accept all file operations in Claude Code (no confirmation prompts)"
display-order = 10
auto-select = false
tags = [
    "claude",
    "permissions",
    "edits"
]

[files.home-seed]
".claude/settings.json" = """
{
    "permissions": {
        "allow": [
            "Bash",
            "Edit",
            "Write",
            "NotebookEdit"
        ],
        "deny": [
            "Bash(git push --force*)",
            "Bash(git push * --force*)",
            "Bash(git reset --hard*)",
            "Bash(git clean -f*)",
            "Bash(git checkout -- .)",
            "Bash(git checkout -- .*)",
            "Bash(git branch -D*)",
            "Bash(git restore .)",
            "Bash(git restore -- .)",
            "Bash(git restore --staged *)",
            "Bash(rm -rf /*)",
            "Bash(rm -rf /)"
        ]
    }
}
"""

[segments]
"startup--90.sh" = """
# Detect user-bound volumes and protect them from accidental rm -rf
# by patching Claude Code's deny rules with jq.
settings="$HOME/.claude/settings.json"
if [ -f "$settings" ] && command -v jq &>/dev/null; then
    # Collect non-system mount points from mountinfo.
    # These are likely user-bound persistent volumes.
    protected=$(awk '{print $5}' /proc/self/mountinfo 2>/dev/null \
        | sort -u \
        | grep -v -xE '/' \
        | grep -v -E '^/(proc|sys|dev|run|tmp)(/|$)' \
        | grep -v -E '^/etc/(resolv\\.conf|hostname|hosts)$' \
        || true)
    if [ -n "$protected" ]; then
        deny_rules='[]'
        while IFS= read -r mp; do
            deny_rules=$(echo "$deny_rules" | jq --arg p "$mp" \
                '. + ["Bash(rm -rf \\($p))", "Bash(rm -rf \\($p)/*)"]')
        done <<< "$protected"
        jq --argjson new_deny "$deny_rules" '
            .permissions.deny = ((.permissions.deny // []) + $new_deny | unique)
        ' "$settings" > "${settings}.tmp" && mv "${settings}.tmp" "$settings"
    fi
fi
"""
