# NOTE: This template has not been tested -- no time (sorry). Please report success or failure. :-p
display-name = "Antigravity Credentials"
display-disc = "Mount host Antigravity credentials"
auto-select = true
tags = ["antigravity", "credential"]

run-args = [
    # Linux
    "-v", "~/.config/Antigravity:/etc/cb-home-seed/.config/Antigravity:ro",
    # macOS
    "-v", "~/Library/Application Support/Antigravity:/etc/cb-home-seed/.config/Antigravity:ro",
    # Windows
    "-v", "~/AppData/Roaming/Antigravity:/etc/cb-home-seed/.config/Antigravity:ro",
    # Legacy
    "-v", "~/.antigravity:/etc/cb-home-seed/.antigravity:ro",
]
