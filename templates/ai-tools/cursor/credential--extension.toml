# NOTE: This template has not been tested -- no time (sorry). Please report success or failure. :-p
display-name = "Cursor Credentials"
display-disc = "Mount host Cursor editor credentials"
display-detail = "Seeds Cursor's sign-in and settings from the host. Cursor is a VS Code fork, so the sign-in lives under the editor's config directory (~/.config/Cursor) rather than in a single credential file; ~/.cursor carries CLI and extension state. Mounts whose host path does not exist are dropped before the container starts, so the macOS and Windows entries cost nothing on Linux."
auto-select = true
tags = ["cursor", "credential"]

run-args = [
    # Linux
    "-v", "~/.config/Cursor:/etc/cb-home-seed/.config/Cursor:ro",
    # macOS
    "-v", "~/Library/Application Support/Cursor:/etc/cb-home-seed/.config/Cursor:ro",
    # Windows
    "-v", "~/AppData/Roaming/Cursor:/etc/cb-home-seed/.config/Cursor:ro",
    # CLI / extension state (all platforms)
    "-v", "~/.cursor:/etc/cb-home-seed/.cursor:ro",
]
