display-name = "Gemini CLI Credentials"
display-disc = "Mount host Gemini CLI settings and OAuth creds"
display-detail = "Seeds `~/.gemini/settings.json` and `~/.gemini/oauth_creds.json` only. Does **not** seed the rest of `~/.gemini` (Antigravity profiles, browser data, and large app state share that tree)."
display-order = 90
auto-select = true
tags = ["credential", "gemini", "google"]

run-args = [
    "-v", "~/.gemini/settings.json:/etc/cb-home-seed/.gemini/settings.json:ro",
    "-v", "~/.gemini/oauth_creds.json:/etc/cb-home-seed/.gemini/oauth_creds.json:ro",
]
