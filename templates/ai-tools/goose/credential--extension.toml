display-name = "Goose Credentials"
display-disc = "Mount host Goose config and secrets"
display-detail = "Seeds `~/.config/goose/config.yaml` and `~/.config/goose/secrets.yaml` when present. Does **not** seed logs, session history, or the whole `~/.config/goose` tree."
display-order = 90
auto-select = true
tags = ["credential", "goose"]

run-args = [
    "-v", "~/.config/goose/config.yaml:/etc/cb-home-seed/.config/goose/config.yaml:ro",
    "-v", "~/.config/goose/secrets.yaml:/etc/cb-home-seed/.config/goose/secrets.yaml:ro",
]
