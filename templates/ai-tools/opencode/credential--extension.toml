display-name = "OpenCode Credentials"
display-disc = "Mount host OpenCode auth and config"
display-detail = "Seeds `~/.local/share/opencode/auth.json` (provider OAuth/API credentials) and `~/.config/opencode/opencode.json` (model/provider settings). Deliberately does **not** seed storage/logs/sessions under `~/.local/share/opencode/` or the full config tree."
display-order = 90
auto-select = true
tags = ["credential", "opencode"]

run-args = [
    "-v", "~/.local/share/opencode/auth.json:/etc/cb-home-seed/.local/share/opencode/auth.json:ro",
    "-v", "~/.config/opencode/opencode.json:/etc/cb-home-seed/.config/opencode/opencode.json:ro",
]
