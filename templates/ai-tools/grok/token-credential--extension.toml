display-name = "Grok Token Credential"
display-disc = "Authenticate Grok Build with XAI_API_KEY"
display-detail = "Passes `XAI_API_KEY` from `.booth/.env` into the booth (a console.x.ai API key). Alternative to the host-file \"Grok Build Credentials\" extension for CI, headless hosts, or machines with no `~/.grok`. Grok prefers a session in `~/.grok/auth.json` over the API key, so select this *instead* of the file mount: `grok+token-credential~credential`. Unset expands to empty, so selecting it without a key configured stays harmless."
display-order = 93
auto-select = false
tags = ["credential", "grok", "xai", "token", "api-key"]

# Alternative to the "Grok Build Credentials" extension for hosts with no
# ~/.grok/auth.json to mount (CI, a remote/headless box, or a host that
# authenticates with a console API key).
#
# Put XAI_API_KEY=<key> in .booth/.env (from console.x.ai). Unset expands
# to empty, so this stays harmless if selected without a key configured.
# A seeded auth.json session wins over the API key — drop the file
# credential with ~credential when using this path.
run-args = [
    "-e", "XAI_API_KEY=${XAI_API_KEY}",
]
