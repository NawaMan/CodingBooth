display-name = "Grok Build"
primary = true
display-disc = "xAI Grok Build coding agent CLI"
display-detail = "Installs the official xAI Grok Build coding agent (binary: grok; alias: agent). Interactive TUI for complex coding work powered by Grok. Authenticate with 'grok login' (seeds ~/.grok/auth.json) or GROK_DEPLOYMENT_KEY. Pair with the credential extension to reuse host auth inside the booth."
display-order = 18
tags = [
    "ai",
    "grok",
    "xai",
    "llm",
    "coding-agent",
    "cli",
    "tui"
]

[params.GROK_VERSION]
default = "latest"
suggests = ["latest"]

[segments]
Boothfile = """
setup grok --version ${GROK_VERSION}
"""
