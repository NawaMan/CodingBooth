display-name = "Grok Build Credentials"
display-disc = "Mount host Grok Build auth and config"
display-detail = "Seeds `~/.grok/auth.json` (from `grok login` or a deployment key flow) and `~/.grok/config.toml` (CLI settings). Deliberately does **not** seed the rest of `~/.grok`: `sessions/`, `worktrees/`, `downloads/`, `logs/`, and caches are large host-side state and not credentials."
display-order = 90
auto-select = true
tags = ["credential", "grok", "xai"]

run-args = [
    # Auth + settings only — see display-detail for what is left behind.
    "-v", "~/.grok/auth.json:/etc/cb-home-seed/.grok/auth.json:ro",
    "-v", "~/.grok/config.toml:/etc/cb-home-seed/.grok/config.toml:ro",
]
