display-name = "Grok Credentials"
display-disc = "Mount host xAI / Grok credentials and config"
display-order = 90
auto-select = true
tags = ["credential", "grok", "xai"]

run-args = [
    # xAI/Grok config dir (if you store keys or profiles on host)
    "-v", "~/.config/xai:/etc/cb-home-seed/.config/xai:ro",
    # Common alternative location some tools use
    "-v", "~/.xai:/etc/cb-home-seed/.xai:ro",
]
