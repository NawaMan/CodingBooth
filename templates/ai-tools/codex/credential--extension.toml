# NOTE: This template has not been tested -- no time (sorry). Please report success or failure. :-p
display-name = "Codex Credentials"
display-disc = "Mount host OpenAI Codex credentials"
display-detail = "Seeds `~/.codex/auth.json` (the credential) and `~/.codex/config.toml` (settings). The rest of `~/.codex` is deliberately not seeded: `sessions/`, `history.jsonl` and the sqlite logs are a transcript of every Codex conversation on the host and grow without bound, while `plugins/` and `cache/` are re-fetched on demand."
display-order = 90
auto-select = true
tags = ["credential", "openai"]

run-args = [
    # Credential and settings only — see display-detail for what is left behind.
    "-v", "~/.codex/auth.json:/etc/cb-home-seed/.codex/auth.json:ro",
    "-v", "~/.codex/config.toml:/etc/cb-home-seed/.codex/config.toml:ro",
]
