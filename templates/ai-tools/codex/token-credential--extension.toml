cb-version = "0.1.0"
display-name = "Codex Token Credential"
display-disc = "Authenticate Codex with CODEX_ACCESS_TOKEN or CODEX_API_KEY"
display-detail = "Passes `CODEX_ACCESS_TOKEN` (a Codex access token, created in a ChatGPT Business/Enterprise workspace; billed to the workspace plan) and `CODEX_API_KEY` (an OpenAI platform API key; billed per use) from `.booth/.env` into the booth. Set one of them. Alternative to the host-file \"Codex Credentials\" extension for CI, headless hosts, or machines with no `~/.codex`. Select it *instead* of the file mount: `codex+token-credential~credential`. Codex reads `CODEX_API_KEY` directly only in `codex exec`; `OPENAI_API_KEY` is not read from the environment at all."
display-order = 92
auto-select = false
tags = ["credential", "openai", "token", "api-key"]

# Alternative to the "Codex Credentials" extension for hosts with no
# ~/.codex/auth.json to mount (CI, a remote/headless box, or a booth that
# should hold only something revocable).
#
# Put ONE of these in .booth/.env:
#   CODEX_ACCESS_TOKEN=<token>  -- ChatGPT Business/Enterprise workspaces only;
#                                  an admin grants permission to create them.
#   CODEX_API_KEY=<sk-...>      -- an OpenAI platform API key (usage billing).
# Unset expands to empty, so this stays harmless if selected without either.
run-args = [
    "-e", "CODEX_ACCESS_TOKEN=${CODEX_ACCESS_TOKEN}",
    "-e", "CODEX_API_KEY=${CODEX_API_KEY}",
]
