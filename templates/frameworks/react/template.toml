cb-version = "0.1.0"
display-name = "React"
display-disc = "React snippets for VS Code (ES7+ React/Redux/React-Native)"
display-detail = """Editor support only for now: it adds no runtime, so pick the runtime yourself \
(nodejs, bun or deno) — React is a library, not a runtime, so this does not `require` one. \
Installs the ES7+ React/Redux/React-Native snippets extension. JSX/TSX language support is \
built into the editor. \
Needs an editor in the image (the codeserver or desktop variant, or the codeserver / vscode \
template); without one the setup skips and nothing is installed."""
display-order = 10
tags = [
    "react",
    "javascript",
    "typescript",
    "frontend",
    "vscode",
]

[segments]
"Boothfile--65" = """
setup react-code-extension
"""
