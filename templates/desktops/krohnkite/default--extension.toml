cb-version = "1.0.0"
display-name   = "Tiling at Login"
display-disc   = "The KDE desktop tiles its windows with Krohnkite from login"
display-detail = """\
Turns Krohnkite on as KWin's default, so the desktop tiles from the moment it \
starts. stop-krohnkite still turns it off, and it stays off until \
start-krohnkite. Drop it with krohnkite~default to log in untiled and tile only \
on demand with start-krohnkite or the desktop icon."""
display-order  = 18
auto-select    = true
tags = [
    "desktop",
    "tiling",
    "krohnkite"
]

[segments]
"Boothfile--42" = """
setup krohnkite-default
"""
