display-name   = "Cortile Tiling"
display-disc   = "Start Cortile auto-tiling on every XFCE login"
display-detail = """\
Cortile (github.com/leukipp/cortile) tiles windows automatically — Ctrl+Shift+T \
toggles tiling, Ctrl+Shift+arrows switch layouts; its config is written to \
~/.config/cortile/config.toml on first run. XFCE booths ship it installed but \
not started; this extension starts it on login. Without it, run `cortile &` \
to try it for one session. Once enabled, a user can still turn it off in \
Settings → Session and Startup."""
display-order  = 17
auto-select    = false
tags = [
    "desktop",
    "xfce",
    "tiling",
    "window-manager"
]

# After xfce's own `setup cortile` (order 40) has installed it.
[segments]
"Boothfile--42" = """
setup cortile --enable
"""
