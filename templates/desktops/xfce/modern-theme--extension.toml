display-name   = "Modern Theme"
display-disc   = "Greybird-dark windows and apps, Adwaita icons"
display-detail = """\
Sets XFCE's default look to Greybird-dark — both the window decorations (xfwm4) \
and the GTK app theme — with the Adwaita icon theme, and keeps the xfwm4 \
compositor on. Only the system defaults change, so a theme picked later from \
Settings → Appearance or Window Manager always wins. Same look as the \
desktop-xfce variant."""
display-order  = 15
auto-select    = true
tags = [
    "desktop",
    "xfce",
    "theme",
    "dark"
]

[segments]
"Boothfile--41" = """
setup xfce-theme
"""
