display-name   = "i3 Tiling"
display-disc   = "i3 tiling window manager in place of xfwm4, inside the XFCE session"
display-detail = """\
Swaps XFCE's window manager (xfwm4) for i3, keeping the rest of the XFCE \
session: the top panel is the bar, and the menu, tray, Thunar and \
notifications are unchanged. Windows tile; Alt is the mod key by default \
(Alt+Enter terminal, Alt+d dmenu, Alt+Shift+d app finder, Alt+1..0 \
workspaces, Alt+Shift+q close); every binding also works as Ctrl+Alt, for \
Firefox, which keeps Alt shortcuts for itself. Pick super with xfce+i3:super \
if your browser passes the Super key through to noVNC. xfdesktop does not run under i3, so \
the desktop shows the wallpaper but no icons. Customize by copying \
/etc/xdg/i3/config to ~/.config/i3/config."""
display-order  = 17
tags = [
    "desktop",
    "xfce",
    "tiling",
    "i3",
    "window-manager"
]

[params.I3_MOD]
default     = "alt"
suggests    = ["alt", "super"]

[segments]
"Boothfile--41" = """
setup i3 ${I3_MOD}
"""
