cb-version = "2.0.0"
display-name = "MongoDB"
display-disc = "MongoDB database with persistent volume"
display-detail = "Installs MongoDB document database with a persistent Docker volume for data storage across container restarts. The volume is per project (booth-mongodata-<project>), so projects do not share data."
display-order = 30
tags = [
    "database",
    "mongodb",
    "nosql"
]

run-args = [
    # Persist MongoDB data across container restarts
    "-v", "booth-mongodata-{project}:/home/coder/.mongodb",
]

[params.MONGO_VERSION]
default = "latest"
suggests = ["latest"]

[segments]
Boothfile = """
setup mongodb --version ${MONGO_VERSION}
"""
