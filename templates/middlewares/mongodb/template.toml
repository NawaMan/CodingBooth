cb-version = "2.0.0"
display-name = "MongoDB"
display-disc = "MongoDB database with persistent volume"
display-detail = "Installs MongoDB document database with a persistent Docker volume for data storage across container restarts. The volume is per booth (booth-mongodata-<booth name>; the default booth name is the project folder), so projects, and two booths of one project, do not share data."
display-order = 30
tags = [
    "database",
    "mongodb",
    "nosql"
]

run-args = [
    # Persist MongoDB data across container restarts
    "-v", "booth-mongodata-{name}:/home/coder/.mongodb",
]

[params.MONGO_VERSION]
default = "latest"
suggests = ["latest"]

[segments]
Boothfile = """
setup mongodb --version ${MONGO_VERSION}
"""
