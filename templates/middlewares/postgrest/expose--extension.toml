display-name = "Expose PostgREST Port [experimental]"
display-disc = "Experimental — publish PostgREST to the host"
display-detail = "EXPERIMENTAL — new, not yet battle-tested; expect rough edges. PostgREST listens inside the booth on POSTGREST_PORT (default 3000). This publishes it so curl, a frontend, or an app on the host can point at it. Autostart is a separate extension — without it, nothing is listening on this port yet."
display-order = 1
auto-select = false
tags = [
    "postgrest",
    "port",
    "network",
    "experimental",
]

run-args = [
    "-p", "${POSTGREST_HOST_PORT}:${POSTGREST_PORT}",
]

# Host-side port. Defaults to the port the service listens on, so moving the service
# moves the published port with it. Override only when the host port is already taken.
[params.POSTGREST_HOST_PORT]
default = "${POSTGREST_PORT}"
