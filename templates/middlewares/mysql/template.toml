cb-version = "2.0.0"
display-name = "MySQL"
display-disc = "MySQL database with persistent volume"
display-detail = "Installs MySQL relational database with a persistent Docker volume for data storage across container restarts. The volume is per project (booth-mysqldata-<project>), so projects do not share data."
display-order = 22
tags = [
    "database",
    "mysql",
    "sql"
]

run-args = [
    # Persist MySQL data across container restarts
    "-v", "booth-mysqldata-{project}:/var/lib/mysql",
]

[segments]
Boothfile = """
setup mysql
"""
