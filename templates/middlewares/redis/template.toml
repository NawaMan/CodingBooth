cb-version = "2.0.0"
display-name = "Redis"
display-disc = "Redis in-memory store with persistent volume"
display-detail = "Installs Redis in-memory data store with a persistent Docker volume for data storage across container restarts. The volume is per booth (booth-redisdata-<booth name>; the default booth name is the project folder), so projects, and two booths of one project, do not share data."
display-order = 20
tags = [
    "database",
    "redis",
    "cache"
]

run-args = [
    # Persist Redis data across container restarts
    "-v", "booth-redisdata-{name}:/home/coder/.redis",
]

[params.REDIS_VERSION]
default = "latest"
suggests = ["latest"]

[segments]
Boothfile = """
setup redis --version ${REDIS_VERSION}
"""
