display-name = "RabbitMQ"
display-disc = "RabbitMQ message broker (AMQP 0-9-1) + management UI"
display-detail = "Installs RabbitMQ from the distro package and configures a dev user, vhost, and management UI. Data dir: /opt/rabbitmq."
display-order = 50
tags = [
    "rabbitmq",
    "messaging",
    "amqp",
]

run-args = [
    # Persist RabbitMQ data across container restarts
    "-v", "booth-rabbitmqdata:/opt/rabbitmq",
]

[params.RABBIT_VERSION]
default = "latest"
suggests = ["latest"]

# rabbitmq--setup.sh accepts --port and --mgmt-port, so these genuinely move the
# listeners rather than just remapping a host port.
[params.RABBIT_PORT]
default = "5672"
suggests = ["5672", "15672"]

[params.RABBIT_MGMTPORT]
default = "15672"
suggests = ["15672", "15673"]

[segments]
Boothfile = """
setup rabbitmq --version ${RABBIT_VERSION} --port ${RABBIT_PORT} --mgmt-port ${RABBIT_MGMTPORT}
"""
