cb-version = "2.0.0"
display-name = "PostgreSQL"
primary = true
display-disc = "PostgreSQL database with persistent volume"
display-detail = "Installs PostgreSQL relational database with a persistent Docker volume for data storage across container restarts. The volume is per booth (booth-pgdata-<booth name>; the default booth name is the project folder), so projects, and two booths of one project, do not share data."
display-order = 20
tags = [
    "database",
    "postgresql",
    "sql"
]

run-args = [
    # Persist PostgreSQL data across container restarts
    "-v", "booth-pgdata-{name}:/var/lib/postgresql",
]

[params.PG_VERSION]
default = "latest"
suggests = ["latest"]

[segments]
Boothfile = """
setup postgresql --version ${PG_VERSION}
"""
