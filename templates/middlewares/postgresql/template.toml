display-name = "PostgreSQL"
display-disc = "PostgreSQL database with persistent volume"
display-detail = "Installs PostgreSQL relational database with a persistent Docker volume for data storage across container restarts."
display-order = 20
tags = [
    "database",
    "postgresql",
    "sql"
]

run-args = [
    # Persist PostgreSQL data across container restarts
    "-v", "booth-pgdata:/var/lib/postgresql",
]

[params.PG_VERSION]
default = "latest"
suggests = ["latest"]

[segments]
Boothfile = """
setup postgresql --version ${PG_VERSION}
"""
