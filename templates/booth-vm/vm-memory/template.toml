cb-version = "0.1.0"
display-name = "VM Memory"
display-disc = "Memory for the booth's VM — macOS / Apple container only"
display-detail = """Sets how much memory the VM the booth runs in may use (`vm-memory` in config.toml, \
`--vm-memory` on the command line).

Only takes effect on macOS with Apple container (`--engine apple`), where every booth runs in its \
own small VM — 1 GB by default, which a desktop variant outgrows (KDE uses about 700 MB idle). \
Ignored on Docker and Podman, which have no per-booth VM: there a booth already shares the engine's \
memory, so nothing is capped.

Select with a size: `--select vm-memory:8g`. Units k, m, g, t."""
display-order = 1
primary = true
tags = [
    "macos",
    "apple-container",
    "vm",
    "memory",
    "resources",
]

vm-memory = "${VM_MEMORY}"

[params.VM_MEMORY]
default = "4g"
suggests = ["2g", "4g", "8g", "16g"]
runtime = true
