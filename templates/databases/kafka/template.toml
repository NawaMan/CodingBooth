display-name = "Kafka"
display-disc = "Apache Kafka single-node KRaft broker"
display-detail = "Installs Apache Kafka in single-node KRaft mode (broker + controller). Includes openjdk-17-jre. Data dir: /opt/kafkadata; install: /opt/kafka."
display-order = 40
tags = [
    "kafka",
    "messaging",
    "streaming",
    "apache",
]

run-args = [
    # Persist Kafka data across container restarts
    "-v", "booth-kafkadata:/opt/kafkadata",
]

[params.KAFKA_VERSION]
default = "3.7.0"
suggests = ["3.7.0", "3.6.1", "3.5.2"]

[segments]
Boothfile = """
setup kafka --version ${KAFKA_VERSION}
"""
