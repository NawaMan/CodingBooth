display-name = "Expose Scratch Port"
display-disc = "Expose Scratch editor port to host network"
display-order = 1
auto-select = false
tags = [
    "scratch",
    "port",
    "network",
]

run-args = [
    "-p", "${SCRATCH_HOST_PORT}:${SCRATCH_PORT}",
]

# Host-side port. Defaults to the port the service listens on, so moving the service
# moves the published port with it. Override only when the host port is already taken.
[params.SCRATCH_HOST_PORT]
default = "${SCRATCH_PORT}"
