<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>${BOOTH_CONTAINER_NAME} (${BOOTH_HOST_PORT})</title>
  ${BOOTH_FAVICON_LINK}
  <meta name="booth-project" content="${BOOTH_CONTAINER_NAME}">
  <!-- Warms the browser cache for ttyd's Nerd Font before any pane's iframe
       loads it — this shell renders before ttyd is ready (see BoothReady
       below), so the fetch has a head start instead of racing each pane's
       own late-injected preload. Same origin, so the cache is shared. -->
  <link rel="preload" as="font" type="font/woff2" href="booth-assets/fonts/FiraCodeNerdFontMono-Regular.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="booth-assets/fonts/FiraCodeNerdFontMono-Bold.woff2" crossorigin>
  ${BOOTH_READY_JS}
  ${BOOTH_KEYBOARD_CAPTURE_JS}
  ${BOOTH_TILING_JS}
  <!-- Optional project-checked-in starting layout/tabs; see .booth/console.json
       and start-ttyd-split. type="application/json" rather than assigning a
       raw object literal to a window var: the browser never tries to parse
       this as JS, so even if start-ttyd-split's jq validation somehow let
       something malformed through, it can't take the whole page's script
       down with a syntax error — readConsoleConfig() below JSON.parses it
       defensively instead. -->
  <script type="application/json" id="cb-console-config">${BOOTH_CONSOLE_CONFIG_JSON}</script>
  <!-- "" (default), "shared", or "cache" — see console-spec in start-ttyd-split.
       A plain quoted string, unlike the JSON above, so no template-literal-vs-
       plain-string parsing hazard to design around here. -->
  <script>window.BOOTH_CONSOLE_SPEC = "${BOOTH_CONSOLE_SPEC}";</script>
  <!-- CodingBooth Help in the Booth panel (booth-message-overlay.html): this
       page wraps no desktop, so it asks for the button itself, keeps only the
       General tab (Clipboard is about the desktop's noVNC panel) and opens on
       the Console Shortcuts tab added below. -->
  <script>
    window.BOOTH_HELP = {
      tabs: ["general"],
      open: window.BoothTiling ? "console" : "general",
      title: "Help using this booth, including the console's keyboard shortcuts"
    };
  </script>
  <style>
    /* Declared here purely so document.fonts.load() below has a face to
       actually fetch and wait on — this document never renders any text
       in it. Without a matching @font-face, .load() would find nothing to
       match and resolve immediately regardless of whether the real font
       bytes are ready. Keep the family name, weights, and URLs in sync
       with the @font-face rules nginx injects into each pane (see
       nginx.conf.template) — a mismatch here leaves the pane's own load
       unguarded again. */
    @font-face {
      font-family: "FiraCode Nerd Font Mono";
      font-weight: 400;
      font-style: normal;
      src: url(booth-assets/fonts/FiraCodeNerdFontMono-Regular.woff2) format("woff2");
    }
    @font-face {
      font-family: "FiraCode Nerd Font Mono";
      font-weight: 700;
      font-style: normal;
      src: url(booth-assets/fonts/FiraCodeNerdFontMono-Bold.woff2) format("woff2");
    }

    :root {
      --bg: #0b1018;
      --panel: #141c27;
      --panel-edge: #2b3a4d;
      --text: #e7edf5;
      --muted: #9badc2;
      --accent: #2f8dff;
      --terminal: #0a0e14;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      background: radial-gradient(circle at 20% 0, #1f2a3a 0%, var(--bg) 45%);
      color: var(--text);
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
    }

    body.dragging-col {
      cursor: col-resize;
      user-select: none;
    }

    body.dragging-row {
      cursor: row-resize;
      user-select: none;
    }

    body.dragging-col .pane iframe,
    body.dragging-row .pane iframe {
      pointer-events: none;
    }

    .shell {
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100%;
      min-height: 0;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      background: linear-gradient(180deg, #1a2533 0%, #111a25 100%);
      border-bottom: 1px solid var(--panel-edge);
    }

    .title {
      font-size: 13px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      margin-right: 8px;
      white-space: nowrap;
    }

    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      border: 1px solid var(--panel-edge);
      background: var(--panel);
      color: var(--text);
      font-family: "JetBrains Mono", "Fira Code", monospace;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    button[data-layout] {
      padding: 5px 8px;
    }

    button[data-layout] svg,
    #tree-layout svg {
      display: block;
    }

    #tree-layout {
      padding: 5px 8px;
    }

    button.pane-count {
      min-width: 30px;
      font-weight: 600;
    }

    button.pane-count:disabled {
      opacity: 0.4;
      cursor: default;
    }

    button.active {
      border-color: var(--accent);
      color: white;
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent), transparent 55%);
    }

    .grid {
      --pane-gap: 8px;
      padding: 8px;
      min-height: 0;
      height: 100%;
      position: relative;
    }

    .pane {
      display: none;
      border: 1px solid var(--panel-edge);
      border-radius: 10px;
      overflow: hidden;
      min-height: 0;
      background: var(--terminal);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }

    .pane.active {
      display: grid;
      /* Three explicit rows, not two, and every row-owning child below is
         pinned to one with grid-row — the tab strip goes display:none
         outside Web view, and CSS grid auto-placement skips display:none
         items entirely, so without a pin pane-body would slide up into the
         tab strip's row and everything would collapse to zero height. */
      grid-template-rows: auto auto 1fr;
    }

    .pane-header {
      grid-row: 1;
      display: flex;
      align-items: center;
      gap: 6px;
      background: #101722;
      border-bottom: 1px solid var(--panel-edge);
      color: var(--muted);
      font-family: "JetBrains Mono", "Fira Code", monospace;
      font-size: 11px;
      padding: 6px 10px;
    }

    .tab-strip {
      grid-row: 2;
      display: none;
      align-items: center;
      gap: 4px;
      background: #0d131c;
      border-bottom: 1px solid var(--panel-edge);
      padding: 4px 6px;
      overflow-x: auto;
    }

    .pane.mode-web .tab-strip {
      display: flex;
    }

    .tab-list {
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
      flex: 1;
      overflow-x: auto;
    }

    .tab-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      max-width: 160px;
      background: var(--panel);
      border: 1px solid var(--panel-edge);
      border-radius: 6px;
      padding: 3px 6px;
      color: var(--muted);
      font-family: "JetBrains Mono", "Fira Code", monospace;
      font-size: 11px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .tab-pill.is-active {
      border-color: var(--accent);
      color: var(--text);
    }

    .tab-pill-label {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 120px;
    }

    .tab-pill-close {
      background: none;
      border: none;
      color: inherit;
      opacity: 0.7;
      cursor: pointer;
      padding: 0;
      line-height: 1;
      flex-shrink: 0;
    }

    .tab-pill-close:hover {
      opacity: 1;
      color: #e74c3c;
    }

    .tab-add {
      background: none;
      border: 1px dashed var(--panel-edge);
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
      padding: 2px 8px;
      font-size: 12px;
      line-height: 1.4;
      flex-shrink: 0;
    }

    .tab-add:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    .pane-body {
      grid-row: 3;
      position: relative;
      min-height: 0;
    }

    .pane-body iframe {
      position: absolute;
      inset: 0;
    }

    .web-tab-frame {
      display: none;
    }

    .web-tab-frame.is-active {
      display: block;
    }

    /* Any active tab — even a freshly opened, not-yet-navigated one — hides
       the terminal underneath it, same as switching a real browser tab
       replaces whatever the previous one showed. Only with zero tabs open
       at all does the terminal stay visible, so Web view has something to
       show rather than a blank pane. */
    .pane.has-active-tab .term-frame {
      display: none;
    }

    .tab-empty {
      display: none;
      position: absolute;
      inset: 0;
      background: var(--terminal);
    }

    .pane.active-tab-empty .tab-empty {
      display: block;
    }

    .pane-title {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pane-header.web-addr-open .pane-title {
      display: none;
    }

    .proxy-addr {
      display: none;
      flex: 1;
      min-width: 0;
      align-items: center;
      background: var(--bg);
      border: 1px solid var(--panel-edge);
      border-radius: 4px;
      padding: 0 6px;
      min-height: 20px;
    }

    .pane-header.web-addr-open .proxy-addr {
      display: flex;
    }

    .pane-header.web-addr-open .proxy-addr:focus-within {
      border-color: var(--accent);
    }

    .proxy-addr.error {
      border-color: #e74c3c;
    }

    .proxy-page-title {
      display: none;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--muted);
      cursor: default;
      padding: 1px;
    }

    .pane-header.web-addr-open .proxy-page-title {
      display: flex;
    }

    .proxy-toggle {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 2px 4px;
      font-size: 13px;
      line-height: 1;
      border-radius: 4px;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .proxy-toggle:hover {
      color: var(--accent);
      background: rgba(47, 141, 255, 0.1);
    }

    .proxy-toggle-term {
      display: none;
    }

    .proxy-toggle.active-web .proxy-toggle-web {
      display: none;
    }

    .proxy-toggle.active-web .proxy-toggle-term {
      display: block;
    }

    .proxy-toggle.active-web {
      order: -1;
      color: var(--accent);
    }

    .md-toggle {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 2px 4px;
      line-height: 1;
      border-radius: 4px;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    /* Same order as the terminal toggle above, and DOM order (toggle comes
       first in the markup) breaks the tie between the two — puts this
       right after it, ahead of the address bar, instead of its natural
       spot after the address bar. */
    .pane.mode-web .md-toggle {
      order: -1;
    }

    .md-toggle:hover {
      color: var(--accent);
      background: rgba(47, 141, 255, 0.1);
    }

    .md-toggle.active-md {
      color: var(--accent);
    }

    .proxy-port-input {
      flex: 1;
      min-width: 0;
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: "JetBrains Mono", "Fira Code", monospace;
      font-size: 11px;
      padding: 2px 4px;
      outline: none;
    }

    .proxy-port-input::placeholder {
      color: #556;
    }

    .proxy-open-tab,
    .proxy-hist-back,
    .proxy-hist-forward,
    .proxy-reload {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 2px 4px;
      font-size: 11px;
      line-height: 1;
      border-radius: 4px;
      flex-shrink: 0;
    }

    /* Reset session: terminal panes only — a web view's tabs are not it. */
    .session-reset {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 2px 4px;
      line-height: 1;
      border-radius: 4px;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .session-reset:hover {
      color: #f87171;
      background: rgba(248, 113, 113, 0.12);
    }

    .pane.mode-web .session-reset {
      display: none;
    }

    .proxy-open-tab:hover,
    .proxy-hist-back:hover,
    .proxy-hist-forward:hover,
    .proxy-reload:hover {
      color: var(--accent);
      background: rgba(47, 141, 255, 0.1);
    }

    .proxy-warning {
      color: #facc15;
      font-size: 11px;
      cursor: help;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--terminal);
    }

    .split-handle {
      position: absolute;
      z-index: 8;
      display: none;
      border-radius: 8px;
      background: color-mix(in srgb, #152338, transparent 25%);
      border: 1px solid color-mix(in srgb, var(--panel-edge), transparent 35%);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
      touch-action: none;
    }

    .split-handle::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      border-radius: 999px;
      background: color-mix(in srgb, var(--accent), #b5cae9 42%);
      opacity: 0.95;
    }

    .split-handle-x {
      width: 12px;
      cursor: col-resize;
    }

    .split-handle-x::after {
      width: 2px;
      height: 34px;
    }

    .split-handle-y {
      height: 12px;
      cursor: row-resize;
    }

    .split-handle-y::after {
      width: 34px;
      height: 2px;
    }

    /* Every layout is a tree (tiling.js) and places its panes absolutely,
       so the pane elements — and the iframes in them — never move in the
       page when the layout changes. */
    .grid .pane.active {
      position: absolute;
    }

    .grid .tree-handle {
      display: block;
      bottom: auto;
      right: auto;
    }

    /* Which pane the shortcuts act on, once there is more than one. */
    .grid.has-focus-ring .pane.focused {
      border-color: color-mix(in srgb, var(--accent), var(--panel-edge) 35%);
    }

    /* i3's split indicator: where the next pane opens. */
    .pane.split-next-h {
      box-shadow: inset -3px 0 0 var(--accent), 0 10px 30px rgba(0, 0, 0, 0.25);
    }

    .pane.split-next-v {
      box-shadow: inset 0 -3px 0 var(--accent), 0 10px 30px rgba(0, 0, 0, 0.25);
    }

    /* CodingBooth Help (booth-message-overlay.html) is a light dialog that
       colours only its paragraphs; the rest would inherit this page's light
       text. The desktop pages it was made for have dark text by default. */
    #bl-help-dialog-overlay .msg-dialog {
      color: #333;
    }

    /* The Keyboard Shortcut Hint: always shown, quiet until a mode
       (resize, full pane, next split) is on, then in the accent colour. */
    .shortcut-hint {
      display: inline-block;
      align-self: center;
      font-family: "JetBrains Mono", "Fira Code", monospace;
      font-size: 11px;
      color: var(--muted);
      border: 1px solid var(--panel-edge);
      border-radius: 8px;
      padding: 4px 8px;
      white-space: nowrap;
      cursor: pointer;
    }

    .shortcut-hint.mode {
      color: var(--accent);
      border-color: var(--accent);
    }

    /* A modifier key in the hint, drawn as an inverted key cap. */
    .shortcut-hint kbd {
      display: inline-block;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 700;
      line-height: 1.2;
      padding: 0 5px;
      margin: 0 1px;
      border-radius: 4px;
      border: 1px solid color-mix(in srgb, currentColor, white 45%);
      background: currentColor;
    }

    .shortcut-hint kbd span {
      color: var(--bg);
    }

    /* Between the Ctrl+Alt keys and the Ctrl+Alt+Shift ones. */
    .shortcut-hint .hint-gap {
      display: inline-block;
      width: 1px;
      height: 12px;
      margin: 0 9px;
      vertical-align: middle;
      background: var(--panel-edge);
    }

    .drag-overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      background: transparent;
      touch-action: none;
    }

    .drag-overlay.active {
      display: block;
    }

    .drag-overlay.axis-x {
      cursor: col-resize;
    }

    .drag-overlay.axis-y {
      cursor: row-resize;
    }

    /* Below this width, side-by-side terminals get too cramped, so every
       column-based layout collapses to a single stacked column. Keep this
       value in sync with the compactQuery matchMedia() in the script below. */
    @media (max-width: 600px) {
      .toolbar {
        align-items: flex-start;
        flex-wrap: wrap;
      }

      /* No room, and rarely a keyboard: only a mode's hint stays. */
      .shortcut-hint:not(.mode) {
        display: none;
      }

      .split-handle {
        display: none !important;
      }
    }
  </style>
</head>

<body>
  <div class="shell">
    <header class="toolbar">
      <span class="title">${BOOTH_CONTAINER_NAME} (${BOOTH_HOST_PORT})</span>
      <div class="controls">
        <button data-layout="single" title="Single">
          <svg width="16" height="14" viewBox="0 0 16 14"><rect x="0.5" y="0.5" width="15" height="13" rx="1.5" fill="none" stroke="currentColor" stroke-width="1"/></svg>
        </button>
        <button data-layout="hsplit" title="Left - Right">
          <svg width="16" height="14" viewBox="0 0 16 14"><rect x="0.5" y="0.5" width="15" height="13" rx="1.5" fill="none" stroke="currentColor" stroke-width="1"/><line x1="8" y1="1" x2="8" y2="13" stroke="currentColor" stroke-width="1"/></svg>
        </button>
        <button data-layout="left-main" title="Left Main">
          <svg width="16" height="14" viewBox="0 0 16 14"><rect x="0.5" y="0.5" width="15" height="13" rx="1.5" fill="none" stroke="currentColor" stroke-width="1"/><line x1="10" y1="1" x2="10" y2="13" stroke="currentColor" stroke-width="1"/><line x1="10" y1="7" x2="15" y2="7" stroke="currentColor" stroke-width="1"/></svg>
        </button>
        <button data-layout="right-main" title="Right Main">
          <svg width="16" height="14" viewBox="0 0 16 14"><rect x="0.5" y="0.5" width="15" height="13" rx="1.5" fill="none" stroke="currentColor" stroke-width="1"/><line x1="6" y1="1" x2="6" y2="13" stroke="currentColor" stroke-width="1"/><line x1="1" y1="7" x2="6" y2="7" stroke="currentColor" stroke-width="1"/></svg>
        </button>
        <button data-layout="vsplit" title="Top - Bottom">
          <svg width="16" height="14" viewBox="0 0 16 14"><rect x="0.5" y="0.5" width="15" height="13" rx="1.5" fill="none" stroke="currentColor" stroke-width="1"/><line x1="1" y1="7" x2="15" y2="7" stroke="currentColor" stroke-width="1"/></svg>
        </button>
        <button data-layout="top-main" title="Top Main">
          <svg width="16" height="14" viewBox="0 0 16 14"><rect x="0.5" y="0.5" width="15" height="13" rx="1.5" fill="none" stroke="currentColor" stroke-width="1"/><line x1="1" y1="8" x2="15" y2="8" stroke="currentColor" stroke-width="1"/><line x1="8" y1="8" x2="8" y2="13" stroke="currentColor" stroke-width="1"/></svg>
        </button>
        <button data-layout="bottom-main" title="Bottom Main">
          <svg width="16" height="14" viewBox="0 0 16 14"><rect x="0.5" y="0.5" width="15" height="13" rx="1.5" fill="none" stroke="currentColor" stroke-width="1"/><line x1="1" y1="6" x2="15" y2="6" stroke="currentColor" stroke-width="1"/><line x1="8" y1="1" x2="8" y2="6" stroke="currentColor" stroke-width="1"/></svg>
        </button>
        <button data-layout="quad" title="Quad">
          <svg width="16" height="14" viewBox="0 0 16 14"><rect x="0.5" y="0.5" width="15" height="13" rx="1.5" fill="none" stroke="currentColor" stroke-width="1"/><line x1="8" y1="1" x2="8" y2="13" stroke="currentColor" stroke-width="1"/><line x1="1" y1="7" x2="15" y2="7" stroke="currentColor" stroke-width="1"/></svg>
        </button>
        <button data-layout="grid6" title="Six (3 columns × 2 rows)">
          <svg width="16" height="14" viewBox="0 0 16 14"><rect x="0.5" y="0.5" width="15" height="13" rx="1.5" fill="none" stroke="currentColor" stroke-width="1"/><line x1="5.5" y1="1" x2="5.5" y2="13" stroke="currentColor" stroke-width="1"/><line x1="10.5" y1="1" x2="10.5" y2="13" stroke="currentColor" stroke-width="1"/><line x1="1" y1="7" x2="15" y2="7" stroke="currentColor" stroke-width="1"/></svg>
        </button>
        <button id="tree-layout" title="Other layout" style="display:none"></button>
        <span id="shortcut-hint" class="shortcut-hint" aria-live="polite"></span>
        <button id="pane-add" class="pane-count" title="Add a pane beside the focused one (Ctrl+Alt+Enter)">+</button>
        <button id="pane-remove" class="pane-count" title="Close the focused pane; its session keeps running (Ctrl+Alt+Shift+q)">&#x2212;</button>
        <button id="reload">Reload</button>
        <button id="kbcapture" title="Full screen mode with full keyboard capture: browser shortcuts like Ctrl+W go to the booth">&#x26F6;</button>
      </div>
    </header>

    <main id="grid" class="grid">
      <!-- The six panes are stamped from #pane-template by the script below. -->
    </main>
    <template id="pane-template">
      <section class="pane pane-__N__" data-pane="__N__">
        <div class="pane-header">
          <span class="pane-title">Session __N__</span>
          <span class="proxy-page-title" data-session="__N__" title="">
            <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 1.5h4.2L9.5 4v6.5H3z" fill="none" stroke="currentColor" stroke-width="1.1"/><path d="M7.2 1.5V4H9.5" fill="none" stroke="currentColor" stroke-width="1.1"/></svg>
          </span>
          <label class="proxy-addr" data-session="__N__">
            <input class="proxy-port-input" data-session="__N__" type="text" placeholder="http://booth" spellcheck="false" autocomplete="off" aria-label="Booth address">
          </label>
          <button class="proxy-toggle" data-session="__N__" title="Web view">
            <span class="proxy-toggle-web" aria-hidden="true">&#x1F310;</span>
            <svg class="proxy-toggle-term" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="1.25" y="1.25" width="11.5" height="11.5" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M4.2 4.4 L7.2 7 L4.2 9.6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="md-toggle" data-session="__N__" title="Markdown viewer">
            <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3.2 1.5h5.1L11.5 4.7v7.8H3.2z" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M8.2 1.5V4.7H11.5" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M5 8.2h4M5 10.3h2.6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
          </button>
          <button class="proxy-reload" data-session="__N__" title="Reload">&#x21BB;</button>
          <button class="session-reset" data-session="__N__" title="Reset session __N__: a fresh shell; stops what runs in it (Ctrl+Alt+Shift+x)">
            <svg width="13" height="13" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1.6v4.2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M4.1 3.3a5 5 0 1 0 5.8 0" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          </button>
          <button class="proxy-hist-back" data-session="__N__" title="Back" style="display:none">&#x2190;</button>
          <button class="proxy-hist-forward" data-session="__N__" title="Forward" style="display:none">&#x2192;</button>
          <button class="proxy-open-tab" data-session="__N__" title="Open in new tab" style="display:none">&#x2197;</button>
          <span class="proxy-warning" data-session="__N__" title="URL rewriting is best-effort. Some apps using dynamic JS URLs may not work correctly. For full compatibility, use booth expose." style="display:none">&#x26A0;</span>
        </div>
        <div class="tab-strip" data-pane="__N__">
          <button class="tab-add" data-pane="__N__" title="New tab">+</button>
          <div class="tab-list" data-pane="__N__"></div>
        </div>
        <div class="pane-body" data-pane="__N__">
          <iframe class="term-frame" title="Session __N__" data-default-src="s__N__/"></iframe>
          <div class="tab-empty" data-pane="__N__"></div>
        </div>
      </section>
    </template>
  </div>
  <div id="drag-overlay" class="drag-overlay" aria-hidden="true"></div>

  <script>
    (() => {
      // Every layout, preset or not, is a tree from tiling.js.
      const Tiling = window.BoothTiling;
      const grid = document.getElementById("grid");
      // One pane per session start-ttyd-split runs (/s1/ … /s6/), stamped
      // from #pane-template before anything below looks them up.
      const paneTemplate = document.getElementById("pane-template").innerHTML;
      for (let n = 1; n <= Tiling.MAX_PANES; n++) {
        grid.insertAdjacentHTML("beforeend", paneTemplate.replace(/__N__/g, String(n)));
      }
      const panes = Array.from(grid.querySelectorAll(".pane"));
      const dragOverlay = document.getElementById("drag-overlay");
      const layoutButtons = Array.from(document.querySelectorAll("[data-layout]"));
      const reloadButton = document.getElementById("reload");
      const paneAddButton = document.getElementById("pane-add");
      const paneRemoveButton = document.getElementById("pane-remove");
      const kbCaptureButton = document.getElementById("kbcapture");
      const projectName = (document.querySelector('meta[name="booth-project"]') || {}).content || "default";

      // Optional project-checked-in starting layout/tabs — see
      // .booth/console.json and start-ttyd-split for how this gets here.
      // type="application/json" (inert text, never JS-parsed) plus our own
      // JSON.parse means a malformed file just yields {} here instead of
      // ever risking a syntax error in this script itself.
      //
      // Whatever the file holds, the console still loads: anything outside
      // the documented shape is dropped with a console.warn saying so, and
      // what is left comes back as { layout, panes } in the shape the code
      // below expects — never a half-valid value for it to trip on.
      let consoleConfigProblems = 0;
      function warnConsoleConfig(message) {
        consoleConfigProblems++;
        console.warn(".booth/console.json: " + message);
      }

      function isPlainObject(value) {
        return !!value && typeof value === "object" && !Array.isArray(value);
      }

      // The smallest toolbar layout that shows panes 1 … highest, so a pane
      // the file gives tabs to is never hidden by a fallback.
      function layoutShowingPanes(highest) {
        if (highest >= 5) return "grid6";
        if (highest === 4) return "quad";
        if (highest === 3) return "left-main";
        if (highest === 2) return "hsplit";
        return "single";
      }

      function readConsoleConfig() {
        const out = { layout: "", panes: {} };
        let raw;
        try {
          const el = document.getElementById("cb-console-config");
          const text = el ? el.textContent.trim() : "";
          raw = text ? JSON.parse(text) : {};
        } catch (_e) {
          warnConsoleConfig("not readable as JSON; ignored");
          return out;
        }
        if (!isPlainObject(raw)) {
          warnConsoleConfig("expected an object like { \"layout\": …, \"panes\": { … } }; ignored");
          return out;
        }

        if (raw.panes !== undefined && !isPlainObject(raw.panes)) {
          warnConsoleConfig("\"panes\" must be an object keyed \"1\" … \"" + Tiling.MAX_PANES + "\"; ignored");
        }
        let highest = 0;
        Object.keys(isPlainObject(raw.panes) ? raw.panes : {}).forEach(function(key) {
          const n = Number(String(key).trim());
          if (!Number.isInteger(n) || n < 1 || n > Tiling.MAX_PANES) {
            warnConsoleConfig("pane \"" + key + "\" is not 1 … " + Tiling.MAX_PANES + "; ignored");
            return;
          }
          const cfg = raw.panes[key];
          if (!isPlainObject(cfg)) {
            warnConsoleConfig("pane " + n + " must be an object like { \"web\": true, \"tabs\": [ … ] }; ignored");
            return;
          }
          const pane = { tabs: [] };
          if (cfg.web === true || cfg.web === false) pane.web = cfg.web;
          else if (cfg.web !== undefined) warnConsoleConfig("pane " + n + ": \"web\" must be true or false; left a terminal");
          if (cfg.force === true) pane.force = true;
          if (cfg.tabs !== undefined && !Array.isArray(cfg.tabs)) {
            warnConsoleConfig("pane " + n + ": \"tabs\" must be a list of addresses; ignored");
          }
          (Array.isArray(cfg.tabs) ? cfg.tabs : []).forEach(function(tab) {
            if (typeof tab === "string" && tab.trim()) pane.tabs.push(tab.trim());
            else if (Number.isInteger(tab) && tab > 0) pane.tabs.push(":" + tab);   // a bare port
            else warnConsoleConfig("pane " + n + ": tab " + JSON.stringify(tab) + " is not an address; skipped");
          });
          out.panes[String(n)] = pane;
          if (pane.web && pane.tabs.length) highest = Math.max(highest, n);
        });

        // A layout that cannot be read falls back to one that shows every
        // pane given tabs above; so does a file with tabs but no layout.
        const layout = typeof raw.layout === "string" ? raw.layout.trim().toLowerCase() : "";
        if (layout && isKnownLayout(layout)) {
          out.layout = layout;
        } else if (raw.layout !== undefined || highest > 1) {
          out.layout = layoutShowingPanes(highest);
          if (raw.layout !== undefined) {
            warnConsoleConfig("\"layout\": " + JSON.stringify(raw.layout) + " is not a layout; using \"" + out.layout + "\"");
          }
        }
        return out;
      }
      const consoleConfig = readConsoleConfig();

      // "shared" or "cache" enables saving the console's current layout/tabs
      // back to .booth/console.json (see console-spec in start-ttyd-split);
      // anything else — including an unset or unrecognized value, already
      // normalized to "" server-side — leaves this read-only, same as before.
      const consoleSpecMode = window.BOOTH_CONSOLE_SPEC === "shared" || window.BOOTH_CONSOLE_SPEC === "cache"
        ? window.BOOTH_CONSOLE_SPEC
        : "";

      // Starts suppressed: applying the checked-in config below, and
      // restoring this browser's own saved tabs, both flow through the same
      // setLayout/saveProxyState calls an interactive change does — without
      // this, loading the page would immediately save right back exactly
      // what it just read. Cleared once initial load finishes, at the very
      // end of this script.
      let suppressConsoleSave = true;

      // Mirrors the shape readConsoleConfig() above expects back — a
      // terminal pane is simply absent, matching how an absent pane in the
      // file already means "leave it as a terminal" on the read side.
      function buildCurrentConsoleSpec() {
        var spec = { layout: consoleLayoutText(), panes: {} };
        panes.forEach(function(pane) {
          if (!pane.classList.contains("mode-web")) return;
          var session = pane.getAttribute("data-pane");
          var tabs = getPaneState(session).tabs
            .map(function(t) { return t.display; })
            .filter(function(d) { return !!d; });
          if (tabs.length) spec.panes[session] = { web: true, tabs: tabs };
        });
        return spec;
      }

      // The layout as console.json gets it: a preset by name while its
      // dividers are where the preset puts them, otherwise the whole tree
      // with its sizes — h(v(1@30,3),v(2,4)) is still quad, and reads back
      // as quad, but the file reproduces the screen exactly. (The URL and
      // localStorage keep the name; this browser has the sizes already.)
      function consoleLayoutText() {
        if (!currentTree || !isPresetName(currentLayout)) return currentLayout;
        var text = Tiling.serialize(currentTree);
        return text === Tiling.serialize(Tiling.presetTree(currentLayout)) ? currentLayout : text;
      }

      // Debounced so a burst of changes (closing several tabs, say) becomes
      // one write, not several — each one is a real file write, and for
      // console-spec=shared a real git-working-tree change.
      let consoleSaveTimer = null;
      // A file that could not be read in full is never saved over: what it
      // got wrong is still the author's, to fix by hand, and a save would
      // replace it with only the part that was understood. Changes then
      // live in this browser alone, as without console-spec.
      let consoleSaveRefusalWarned = false;
      function scheduleConsoleSave() {
        if (!consoleSpecMode || suppressConsoleSave) return;
        if (consoleConfigProblems) {
          if (!consoleSaveRefusalWarned) {
            consoleSaveRefusalWarned = true;
            console.warn(".booth/console.json: not saving layout changes over a file with problems (see above); fix it and restart the booth");
          }
          return;
        }
        clearTimeout(consoleSaveTimer);
        consoleSaveTimer = setTimeout(function() {
          fetch("booth-messages/api/console-config", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(buildCurrentConsoleSpec())
          }).then(function(res) {
            if (res.ok) return;
            return res.json().catch(function() { return {}; }).then(function(body) {
              console.warn("Saving console layout failed:", body.error || res.status);
            });
          }).catch(function(err) {
            console.warn("Saving console layout failed:", err);
          });
        }, 600);
      }

      const layoutStorageKey = "cb.webSplit." + projectName + ".layout";
      const splitStorageKey = "cb.webSplit." + projectName + ".splits";
      const modeHashPrefix = "#mode=";
      // Keep this breakpoint in sync with the @media (max-width: …) rule above.
      const compactQuery = window.matchMedia("(max-width: 600px)");

      // Gate a ttyd pane's first navigation on the Nerd Font actually being
      // decoded, not just requested — the <link rel="preload"> above only
      // starts the fetch. ttyd paints its terminal on <canvas>, which,
      // unlike DOM text, never auto-repaints when a font finishes loading
      // later (see the resize-dispatch workaround in the sub_filter in
      // nginx.conf.template), so racing the iframe's navigation against the
      // font fetch is what produces the fallback-then-swap flash. Waiting
      // here means ttyd's own script shouldn't get to paint before the
      // font is already loaded. Capped so a slow or broken font fetch can
      // never block the terminal from appearing at all.
      const fontsReadyPromise = Promise.race([
        Promise.all([
          document.fonts.load('400 15px "FiraCode Nerd Font Mono"'),
          document.fonts.load('700 15px "FiraCode Nerd Font Mono"')
        ]),
        new Promise((resolve) => setTimeout(resolve, 2000))
      ]).catch(() => {});

      const minSplit = 0.2;
      const maxSplit = 0.8;

      let currentLayout = "single";
      // The two shared divider positions from before presets were trees —
      // the starting positions of a preset this browser has no sizes saved for.
      const split = loadSplitValues();

      // A layout is a preset name (a toolbar button) or a tiling tree written
      // as text — h(1,v(2,3)) — from the Ctrl+Alt shortcuts.
      function isPresetName(mode) {
        return Tiling.PRESET_NAMES.indexOf(mode) >= 0;
      }
      function isKnownLayout(mode) {
        if (typeof mode !== "string") return false;
        return isPresetName(mode) || !!Tiling.parse(mode);
      }

      // Tiling state — see "Tiling" further down. Declared up here because
      // setLayout, which runs on every layout change, reads it.
      let currentTree = null;   // the layout showing, as a tree
      let zoomPane = null;      // Ctrl+Alt+F: the one pane filling the grid
      let focusedPane = 1;      // the pane the shortcuts act on
      let pendingSplit = null;  // Ctrl+Alt+B / V: { pane, dir } for the next open
      let resizeMode = false;   // Ctrl+Alt+R
      let treeDrag = null;      // a tree divider being dragged
      const shortcutHint = document.getElementById("shortcut-hint");
      const treeLayoutButton = document.getElementById("tree-layout");

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function loadSplitValues() {
        const fallback = { x: 0.5, y: 0.5 };
        try {
          const raw = window.localStorage.getItem(splitStorageKey);
          if (!raw) {
            return fallback;
          }
          const parsed = JSON.parse(raw);
          if (typeof parsed !== "object" || parsed === null) {
            return fallback;
          }
          const x = Number(parsed.x);
          const y = Number(parsed.y);
          return {
            x: Number.isFinite(x) ? clamp(x, minSplit, maxSplit) : fallback.x,
            y: Number.isFinite(y) ? clamp(y, minSplit, maxSplit) : fallback.y
          };
        } catch (_error) {
          return fallback;
        }
      }

      // Each preset keeps its own divider positions, so going back to a
      // preset shows it the way it was left: { quad: "h(v(1@40,3),v(2,4))" }.
      const presetSizesStorageKey = "cb.webSplit." + projectName + ".presetSizes";
      const presetSizes = (function() {
        try {
          const parsed = JSON.parse(window.localStorage.getItem(presetSizesStorageKey) || "{}");
          return parsed && typeof parsed === "object" ? parsed : {};
        } catch (_error) {
          return {};
        }
      })();

      function savePresetSizes(name, tree) {
        presetSizes[name] = Tiling.serialize(tree);
        try {
          window.localStorage.setItem(presetSizesStorageKey, JSON.stringify(presetSizes));
        } catch (_error) {
          // Ignore localStorage write failures (private mode / restricted env).
        }
      }

      function presetTreeFor(name) {
        const saved = typeof presetSizes[name] === "string" ? Tiling.parse(presetSizes[name]) : null;
        const match = saved && Tiling.matchPreset(saved);
        return match && match.name === name ? saved : Tiling.presetTree(name, split.x, split.y);
      }

      function loadSavedLayout() {
        try {
          const raw = window.localStorage.getItem(layoutStorageKey);
          if (!raw) {
            return "";
          }
          const mode = raw.trim().toLowerCase();
          return isKnownLayout(mode) ? mode : "";
        } catch (_error) {
          return "";
        }
      }

      function saveLayout(mode) {
        try {
          window.localStorage.setItem(layoutStorageKey, mode);
        } catch (_error) {
          // Ignore localStorage write failures (private mode / restricted env).
        }
        scheduleConsoleSave();
      }

      function parseModeFromHash() {
        const hash = window.location.hash || "";
        if (!hash.startsWith(modeHashPrefix)) {
          return "";
        }

        try {
          const mode = decodeURIComponent(hash.slice(modeHashPrefix.length)).trim().toLowerCase();
          return isKnownLayout(mode) ? mode : "";
        } catch (_error) {
          return "";
        }
      }

      function setHashMode(mode) {
        // "," and "@" left readable in a tree layout: #mode=h(1@60,v(2,3)@40).
        const nextHash = modeHashPrefix + encodeURIComponent(mode).replace(/%2C/gi, ",").replace(/%40/gi, "@");
        if (window.location.hash === nextHash) {
          return;
        }
        const nextUrl = window.location.pathname + window.location.search + nextHash;
        window.history.replaceState(null, "", nextUrl);
      }

      // Shows a layout by name: a preset, or a tree written as text. Anything
      // else shows a single pane.
      function setLayout(layout, options = {}) {
        const tree = isPresetName(layout) ? presetTreeFor(layout) : Tiling.parse(layout || "");
        setTreeLayout(tree || Tiling.presetTree("single"), options);
      }

      layoutButtons.forEach((button) => {
        button.addEventListener("click", () => setLayout(button.dataset.layout));
      });

      if (typeof compactQuery.addEventListener === "function") {
        compactQuery.addEventListener("change", () => showCurrentLayout());
      } else if (typeof compactQuery.addListener === "function") {
        compactQuery.addListener(() => showCurrentLayout());
      }

      window.addEventListener("hashchange", () => {
        const hashMode = parseModeFromHash();
        const savedMode = loadSavedLayout();
        setLayout(hashMode || savedMode || "single", { updateHash: false });
      });

      // Reloads what a pane's iframe shows. A terminal reattaches to its tmux
      // session, so nothing running in it is lost. A booth page is
      // same-origin and reloads in place, keeping its history; an outside
      // site is cross-origin, where location.reload() throws, so it is
      // loaded again from its src — the page the tab opened on, since where
      // a cross-origin page has navigated to cannot be read.
      function reloadFrame(iframe) {
        if (!iframe) return;
        try {
          iframe.contentWindow.location.reload();
        } catch (_e) {
          iframe.src = iframe.src;
        }
      }

      reloadButton.addEventListener("click", () => {
        panes.forEach((pane) => {
          if (!pane.classList.contains("active")) {
            return;
          }
          reloadFrame(activeWebFrame(pane) || pane.querySelector(".term-frame"));
        });
      });

      // ── Keyboard capture ──
      // See booth-keyboard-capture.js: Chromium-only, so a browser without
      // the Keyboard Lock API doesn't get a button that can only half-work.
      if (window.BoothKeyboardCapture && window.BoothKeyboardCapture.isSupported()) {
        kbCaptureButton.addEventListener("click", () => {
          window.BoothKeyboardCapture.toggle();
        });
        window.BoothKeyboardCapture.onChange((active) => {
          kbCaptureButton.classList.toggle("active", active);
          kbCaptureButton.title = active
            ? "Exit full screen mode"
            : "Full screen mode with full keyboard capture: browser shortcuts like Ctrl+W go to the booth";
        });
      } else if (kbCaptureButton) {
        kbCaptureButton.style.display = "none";
      }

      // ── Tiling: i3-style Ctrl+Alt shortcuts ──
      // The same keys as the i3 template's +ctrl-alt bindings (i3--setup.sh),
      // acting on the six panes: focus, move, split, open, close, full,
      // resize. The layout logic is tiling.js; this is the page side.
      //
      // Every layout is a tree, placed absolutely so the pane elements, and
      // the terminals in them, never move in the page. A shortcut edits the
      // tree, and the result shows as a preset whenever it has a preset's
      // shape (tiling.js matchPreset); anything else is "Other".
      //
      // Keys pressed inside a pane arrive in that pane's iframe, not here, so
      // each same-origin frame (the terminals, booth web tabs) gets the same
      // listener. An external site in a web tab is out of reach; click into a
      // terminal pane first.
      const GRID_PAD = 8;   // the .grid padding, px
      const PANE_GAP = 8;   // the .grid --pane-gap, px

      function visiblePanes() {
        return panes
          .filter(function(pane) { return pane.classList.contains("active"); })
          .map(function(pane) { return Number(pane.dataset.pane); });
      }

      function layoutTreeNow() {
        return currentTree || Tiling.presetTree("single");
      }

      function clearTreeGeometry() {
        panes.forEach(function(pane) {
          pane.style.position = "";
          pane.style.left = "";
          pane.style.top = "";
          pane.style.width = "";
          pane.style.height = "";
        });
        grid.querySelectorAll(".tree-handle").forEach(function(handle) { handle.remove(); });
      }

      // Lengths below are [fraction of the grid's content box, px]: a split
      // shares its length minus the gaps between its children, as a CSS grid
      // track list does, so three columns come out equally wide.
      function lin(f, px) { return [f, px]; }
      function css(v) {
        return "calc(" + GRID_PAD + "px + (100% - " + (2 * GRID_PAD) + "px) * " + v[0].toFixed(6) + " + " + v[1].toFixed(3) + "px)";
      }
      function cssLength(v) {
        return "calc((100% - " + (2 * GRID_PAD) + "px) * " + v[0].toFixed(6) + " + " + v[1].toFixed(3) + "px)";
      }

      // Where every pane and divider of a tree goes.
      function treeGeometry(tree) {
        const out = { panes: {}, handles: [] };
        (function walk(node, box, path) {
          if (typeof node.pane === "number") {
            out.panes[node.pane] = box;
            return;
          }
          const across = node.dir === "h";
          const len = across ? box.w : box.h;
          const gaps = PANE_GAP * (node.children.length - 1);
          let at = across ? box.x : box.y;
          node.children.forEach(function(child, i) {
            const size = node.sizes[i];
            const part = lin(len[0] * size, (len[1] - gaps) * size);
            walk(child, across
              ? { x: at, y: box.y, w: part, h: box.h }
              : { x: box.x, y: at, w: box.w, h: part }, path.concat(i));
            at = lin(at[0] + part[0], at[1] + part[1] + PANE_GAP);
            if (i < node.children.length - 1) {
              out.handles.push({
                path: path, index: i, axis: across ? "x" : "y",
                // centred in the gap just passed: 12px wide, 2px in from the ends
                at: lin(at[0], at[1] - PANE_GAP / 2 - 6),
                from: lin((across ? box.y : box.x)[0], (across ? box.y : box.x)[1] + 2),
                length: lin((across ? box.h : box.w)[0], (across ? box.h : box.w)[1] - 4)
              });
            }
          });
        })(tree, { x: lin(0, 0), y: lin(0, 0), w: lin(1, 0), h: lin(1, 0) }, []);
        return out;
      }

      function placeAt(el, box) {
        el.style.left = css(box.x);
        el.style.top = css(box.y);
        el.style.width = cssLength(box.w);
        el.style.height = cssLength(box.h);
      }

      function addTreeHandle(d) {
        const handle = document.createElement("div");
        handle.className = "split-handle tree-handle " + (d.axis === "x" ? "split-handle-x" : "split-handle-y");
        handle.setAttribute("aria-hidden", "true");
        if (d.axis === "x") {
          handle.style.left = css(d.at);
          handle.style.top = css(d.from);
          handle.style.height = cssLength(d.length);
        } else {
          handle.style.top = css(d.at);
          handle.style.left = css(d.from);
          handle.style.width = cssLength(d.length);
        }
        handle.addEventListener("pointerdown", function(event) { beginTreeDrag(d, event); });
        grid.appendChild(handle);
      }

      // Places the panes of `tree` without touching currentTree — the full
      // pane of Ctrl+Alt+F is drawn this way too. Narrow screens stack the
      // panes in tree order.
      function renderTree(tree) {
        clearTreeGeometry();
        const order = Tiling.panes(tree);
        panes.forEach(function(pane, index) {
          pane.classList.toggle("active", order.indexOf(index + 1) >= 0);
        });
        // Narrow: the same panes stacked in tree order, one column.
        const compact = compactQuery.matches;
        const geometry = treeGeometry(compact
          ? (order.length > 1 ? { dir: "v", children: order.map(function(n) { return { pane: n }; }), sizes: order.map(function() { return 1 / order.length; }) } : tree)
          : tree);
        order.forEach(function(n) { placeAt(panes[n - 1], geometry.panes[n]); });
        if (!compact) geometry.handles.forEach(addTreeHandle);
        refreshTilingFocus();
      }

      function setTreeLayout(tree, options = {}) {
        const preset = Tiling.matchPreset(tree);
        currentTree = tree;
        zoomPane = null;
        currentLayout = preset ? preset.name : Tiling.serialize(tree);
        if (preset) savePresetSizes(preset.name, tree);
        renderTree(tree);
        layoutButtons.forEach(function(button) {
          button.classList.toggle("active", button.dataset.layout === currentLayout);
        });
        if (options.persistLayout !== false) saveLayout(currentLayout);
        if (options.updateHash !== false) setHashMode(currentLayout);
        updateTreeLayoutButton();
        updatePaneCountButtons();
        setTilingStatus();
      }

      // "Other": a lit placeholder for a layout that has no toolbar button,
      // drawn in its shape the way the preset icons are. Shown only while
      // such a layout is showing; the layout itself is remembered like any
      // other (URL hash, localStorage, console.json).
      function treeLayoutIcon(tree) {
        const lines = [];
        (function walk(node, x, y, w, h) {
          if (typeof node.pane === "number") return;
          let offset = 0;
          node.children.forEach(function(child, i) {
            const size = node.sizes[i];
            if (node.dir === "h") {
              walk(child, x + w * offset, y, w * size, h);
            } else {
              walk(child, x, y + h * offset, w, h * size);
            }
            offset += size;
            if (i < node.children.length - 1) {
              lines.push(node.dir === "h"
                ? [x + w * offset, y, x + w * offset, y + h]
                : [x, y + h * offset, x + w, y + h * offset]);
            }
          });
        })(tree, 1, 1, 14, 12);
        return '<svg width="16" height="14" viewBox="0 0 16 14">' +
          '<rect x="0.5" y="0.5" width="15" height="13" rx="1.5" fill="none" stroke="currentColor" stroke-width="1"/>' +
          lines.map(function(l) {
            return '<line x1="' + l[0].toFixed(1) + '" y1="' + l[1].toFixed(1) + '" x2="' + l[2].toFixed(1) +
              '" y2="' + l[3].toFixed(1) + '" stroke="currentColor" stroke-width="1"/>';
          }).join("") + "</svg>";
      }

      function updateTreeLayoutButton() {
        const other = currentTree && !Tiling.matchPreset(currentTree) ? currentLayout : "";
        treeLayoutButton.style.display = other ? "" : "none";
        treeLayoutButton.classList.toggle("active", !!other);
        if (!other || treeLayoutButton.dataset.tree === other) return;
        treeLayoutButton.dataset.tree = other;
        treeLayoutButton.innerHTML = treeLayoutIcon(currentTree);
        treeLayoutButton.title = "Other layout: " + other;
      }

      // + and − beside Reload: Ctrl+Alt+Enter and Ctrl+Alt+Shift+q.
      function updatePaneCountButtons() {
        const shown = Tiling.panes(layoutTreeNow()).length;
        paneAddButton.disabled = shown >= Tiling.MAX_PANES;
        paneRemoveButton.disabled = shown < 2;
      }
      paneAddButton.addEventListener("click", function() { tilingOpen(null); });
      paneRemoveButton.addEventListener("click", function() { tilingClose(); });

      // Redraws whatever the current layout is, e.g. to come back from full.
      function showCurrentLayout() {
        setLayout(currentLayout, { updateHash: false, persistLayout: false });
      }

      function applyTree(next) {
        if (next) setTreeLayout(next);
      }

      function beginTreeDrag(d, event) {
        if (!currentTree) return;
        treeDrag = { path: d.path, index: d.index, axis: d.axis };
        document.body.classList.add(d.axis === "x" ? "dragging-col" : "dragging-row");
        dragOverlay.classList.add("active", d.axis === "x" ? "axis-x" : "axis-y");
        event.preventDefault();
      }

      function moveTreeDrag(event) {
        if (!treeDrag || !currentTree) return;
        const rect = grid.getBoundingClientRect();
        const pos = treeDrag.axis === "x"
          ? (event.clientX - rect.left - GRID_PAD) / (rect.width - 2 * GRID_PAD)
          : (event.clientY - rect.top - GRID_PAD) / (rect.height - 2 * GRID_PAD);
        if (!Number.isFinite(pos)) return;
        currentTree = Tiling.dragDivider(currentTree, treeDrag.path, treeDrag.index, pos);
        renderTree(currentTree);
      }

      function endTreeDrag() {
        if (!treeDrag) return;
        treeDrag = null;
        document.body.classList.remove("dragging-col", "dragging-row");
        dragOverlay.classList.remove("active", "axis-x", "axis-y");
        setTreeLayout(currentTree);
      }

      window.addEventListener("pointermove", moveTreeDrag);
      window.addEventListener("pointerup", endTreeDrag);
      window.addEventListener("pointercancel", endTreeDrag);
      window.addEventListener("blur", endTreeDrag);

      // ── Tiling: focus ──
      function refreshTilingFocus() {
        const shown = visiblePanes();
        if (shown.length && shown.indexOf(focusedPane) < 0) focusedPane = shown[0];
        grid.classList.toggle("has-focus-ring", shown.length > 1);
        panes.forEach(function(pane, index) {
          const n = index + 1;
          const pending = pendingSplit && pendingSplit.pane === n ? pendingSplit.dir : "";
          pane.classList.toggle("focused", n === focusedPane);
          pane.classList.toggle("split-next-h", pending === "h");
          pane.classList.toggle("split-next-v", pending === "v");
        });
        setTilingStatus();
      }

      // Puts the keyboard in a pane: its terminal, or its web tab.
      function focusPaneContent(n) {
        const pane = panes[n - 1];
        if (!pane) return;
        const frame = (pane.classList.contains("mode-web") && activeWebFrame(pane)) || pane.querySelector(".term-frame");
        if (!frame) return;
        try {
          frame.contentWindow.focus();
          const term = frame.contentWindow.term;
          if (term && typeof term.focus === "function") term.focus();
        } catch (_e) {
          frame.focus();
        }
      }

      function setFocusedPane(n, moveKeyboard) {
        focusedPane = n;
        refreshTilingFocus();
        if (moveKeyboard) focusPaneContent(n);
      }

      function noteFocus(pane) {
        const n = pane ? Number(pane.dataset.pane) : 0;
        if (n && n !== focusedPane) {
          focusedPane = n;
          refreshTilingFocus();
        }
      }

      // Clicking or tabbing into a pane makes it the focused one. A click
      // into an iframe only shows up here as this window losing focus; a
      // click from one iframe into another, only inside the frames (below).
      window.addEventListener("blur", function() {
        setTimeout(function() {
          const el = document.activeElement;
          noteFocus(el && el.closest ? el.closest(".pane") : null);
        }, 0);
      });
      document.addEventListener("focusin", function(e) {
        noteFocus(e.target && e.target.closest ? e.target.closest(".pane") : null);
      });
      grid.addEventListener("pointerdown", function(e) {
        noteFocus(e.target && e.target.closest ? e.target.closest(".pane") : null);
      }, true);

      // ── Tiling: Keyboard Shortcut Hint ──
      // Always in the toolbar: the main keys, or what the keys do right now
      // while a mode is on. A click leaves the mode, or opens the full table.
      function setTilingStatus() {
        let text = "";
        if (resizeMode) {
          text = "Resize: h j k l or arrows · Enter or Esc to finish";
        } else if (zoomPane !== null) {
          text = "Session " + zoomPane + " full · Ctrl+Alt+F to restore";
        } else if (pendingSplit && pendingSplit.pane === focusedPane) {
          text = "Next pane opens " + (pendingSplit.dir === "h" ? "beside" : "below") +
            " session " + focusedPane + " · Ctrl+Alt+Enter";
        }
        shortcutHint.classList.toggle("mode", !!text);
        // The text is this page's own; only the modifiers become key caps.
        shortcutHint.innerHTML = (text ||
          "Ctrl+Alt+ h j k l focus · Enter open · f full · = equalize | Ctrl+Alt+Shift+ h j k l move · q close · x reset")
          .replace(/(Ctrl\+Alt\+Shift|Ctrl\+Alt)\+ ?/g, '<kbd><span>$1</span></kbd> ')
          .replace(" | ", '<span class="hint-gap"></span>');
        shortcutHint.title = text
          ? "Keyboard Shortcut Hint — click to leave"
          : "Keyboard Shortcut Hint — click for every console shortcut";
      }
      shortcutHint.addEventListener("click", function() {
        if (resizeMode) setResizeMode(false);
        else if (zoomPane !== null) tilingZoom();
        else if (window.BoothHelp && typeof window.BoothHelp.open === "function") window.BoothHelp.open("console");
      });

      // ── Tiling: actions ──
      function unzoom() {
        if (zoomPane === null) return;
        zoomPane = null;
        showCurrentLayout();
      }

      function tilingFocus(dir) {
        unzoom();
        const n = Tiling.neighbor(layoutTreeNow(), focusedPane, dir);
        if (n) setFocusedPane(n, true);
      }

      function tilingMove(dir) {
        unzoom();
        applyTree(Tiling.move(layoutTreeNow(), focusedPane, dir));
        focusPaneContent(focusedPane);
      }

      // Ctrl+Alt+Shift+x or a terminal pane's power button: after asking,
      // ends the pane's tmux session — the shell and anything running in it —
      // and reconnects the pane, which starts a fresh one. Closing a pane
      // (Ctrl+Alt+Shift+q) only hides it; this is the one that really ends it.
      function resetSession(n) {
        const pane = panes[n - 1];
        if (!pane) return;
        if (!window.confirm("Reset session " + n + "?\n\nIts shell, and anything running in it, " +
            "will be stopped and a fresh shell started.")) {
          focusPaneContent(n);
          return;
        }
        fetch("booth-messages/api/session-reset", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session: n })
        }).then(function(res) {
          if (!res.ok) throw new Error("HTTP " + res.status);
          const frame = pane.querySelector(".term-frame");
          frame.src = frame.dataset.boothSrc || frame.dataset.defaultSrc;
          focusPaneContent(n);
        }).catch(function(err) {
          console.warn("Resetting session " + n + " failed:", err);
        });
      }

      document.querySelectorAll(".session-reset").forEach(function(btn) {
        btn.addEventListener("click", function() { resetSession(Number(btn.dataset.session)); });
      });

      function tilingEqualize() {
        unzoom();
        applyTree(Tiling.equalize(layoutTreeNow()));
      }

      function tilingToggleSplit() {
        unzoom();
        applyTree(Tiling.toggleSplit(layoutTreeNow(), focusedPane));
      }

      function setPendingSplit(dir) {
        pendingSplit = { pane: focusedPane, dir: dir };
        refreshTilingFocus();
      }

      // Brings back a hidden pane — the lowest, or `pane` — beside the
      // focused one. Its session kept running while it was hidden.
      function tilingOpen(pane) {
        unzoom();
        const tree = layoutTreeNow();
        const shown = Tiling.panes(tree);
        let next = pane;
        for (let n = 1; !next && n <= Tiling.MAX_PANES; n++) {
          if (shown.indexOf(n) < 0) next = n;
        }
        if (!next || shown.indexOf(next) >= 0) return;
        const dir = pendingSplit && pendingSplit.pane === focusedPane ? pendingSplit.dir : undefined;
        const rect = panes[focusedPane - 1].getBoundingClientRect();
        pendingSplit = null;
        applyTree(Tiling.insert(tree, focusedPane, next, dir, rect.width >= rect.height ? "h" : "v"));
        setFocusedPane(next, true);
      }

      function tilingGoTo(n) {
        if (Tiling.panes(layoutTreeNow()).indexOf(n) >= 0) {
          unzoom();
          setFocusedPane(n, true);
        } else {
          tilingOpen(n);
        }
      }

      // Hides the pane; its tmux session keeps running and Ctrl+Alt+Enter or
      // Ctrl+Alt+<number> brings it back. The last pane stays.
      function tilingClose() {
        unzoom();
        const tree = layoutTreeNow();
        const shown = Tiling.panes(tree);
        if (shown.length < 2) return;
        const closing = focusedPane;
        const next = ["left", "up", "right", "down"]
          .map(function(dir) { return Tiling.neighbor(tree, closing, dir); })
          .find(Boolean) || shown.find(function(n) { return n !== closing; });
        if (pendingSplit && pendingSplit.pane === closing) pendingSplit = null;
        focusedPane = next;
        applyTree(Tiling.remove(tree, closing));
        focusPaneContent(next);
      }

      function tilingZoom() {
        if (zoomPane !== null) {
          unzoom();
          focusPaneContent(focusedPane);
          return;
        }
        if (visiblePanes().length < 2) return;
        zoomPane = focusedPane;
        renderTree({ pane: zoomPane });
        setTilingStatus();
        focusPaneContent(zoomPane);
      }

      function setResizeMode(on) {
        resizeMode = on;
        setTilingStatus();
      }

      // ── Tiling: keys ──
      const tilingDirs = {
        h: "left", j: "down", k: "up", l: "right",
        arrowleft: "left", arrowdown: "down", arrowup: "up", arrowright: "right"
      };
      const resizeSteps = {
        h: ["h", -0.05], arrowleft: ["h", -0.05], l: ["h", 0.05], arrowright: ["h", 0.05],
        k: ["v", -0.05], arrowup: ["v", -0.05], j: ["v", 0.05], arrowdown: ["v", 0.05]
      };

      // By the key's label (i3 binds keysyms), falling back to its position
      // for a layout that gives Ctrl+Alt+<key> no plain character.
      function tilingKeyName(e) {
        if (e.key && e.key.length === 1 && /[a-z0-9]/i.test(e.key)) return e.key.toLowerCase();
        if (/^Key[A-Z]$/.test(e.code || "")) return e.code.slice(3).toLowerCase();
        if (/^Digit[0-9]$/.test(e.code || "")) return e.code.slice(5);
        if (e.code === "Equal" || e.code === "NumpadEqual") return "=";
        return (e.key || "").toLowerCase();
      }

      function tilingAction(key, shift) {
        const dir = tilingDirs[key];
        if (dir) return shift ? function() { tilingMove(dir); } : function() { tilingFocus(dir); };
        if (shift) {
          if (key === "q") return tilingClose;
          if (key === "x") return function() { resetSession(focusedPane); };
          return null;
        }
        switch (key) {
          case "b": return function() { setPendingSplit("h"); };
          case "v": return function() { setPendingSplit("v"); };
          case "e": return tilingToggleSplit;
          case "=": return tilingEqualize;
          // Ctrl+Alt+r (resize mode) is off for now; dragging a divider resizes.
          case "enter": return function() { tilingOpen(null); };
          case "f": return tilingZoom;
          case "1": case "2": case "3": case "4": case "5": case "6":
            return function() { tilingGoTo(Number(key)); };
        }
        return null;
      }

      function handleResizeKey(e) {
        const key = tilingKeyName(e);
        if (key === "control" || key === "alt" || key === "shift" || key === "meta") return;
        // A dialog or address bar on this page keeps its typing.
        const t = e.target;
        if (t && t.ownerDocument === document && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName || "")) return;
        e.preventDefault();
        e.stopImmediatePropagation();
        if (key === "enter" || key === "escape" || (e.ctrlKey && e.altKey && key === "r")) {
          setResizeMode(false);
          return;
        }
        const step = resizeSteps[key];
        if (!step) return;
        unzoom();
        applyTree(Tiling.resize(layoutTreeNow(), focusedPane, step[0], step[1]));
      }

      function onTilingKey(e) {
        if (resizeMode) {
          handleResizeKey(e);
          return;
        }
        if (!e.ctrlKey || !e.altKey || e.metaKey) return;
        // AltGr arrives as Ctrl+Alt on Windows; it is typing a character.
        if (typeof e.getModifierState === "function" && e.getModifierState("AltGraph")) return;
        const action = tilingAction(tilingKeyName(e), e.shiftKey);
        if (!action) return;
        e.preventDefault();
        e.stopImmediatePropagation();
        action();
      }

      // Each same-origin frame gets the key and focus listeners, again after
      // every navigation (a new document means a new window to listen on).
      function hookTilingFrame(iframe) {
        function attach() {
          try {
            const w = iframe.contentWindow;
            if (!w || w.__cbTiling) return;
            w.__cbTiling = true;
            const pane = iframe.closest(".pane");
            w.addEventListener("keydown", onTilingKey, true);
            w.addEventListener("focus", function() { noteFocus(pane); });
            w.addEventListener("pointerdown", function() { noteFocus(pane); }, true);
          } catch (_e) {
            // Cross-origin (an external web tab): out of reach.
          }
        }
        iframe.addEventListener("load", attach);
        attach();
      }

      if (Tiling) {
        window.addEventListener("keydown", onTilingKey, true);
        grid.querySelectorAll("iframe").forEach(hookTilingFrame);
        // Web tabs create their iframes as they open.
        new MutationObserver(function(records) {
          records.forEach(function(record) {
            record.addedNodes.forEach(function(node) {
              if (node.nodeType !== 1) return;
              if (node.tagName === "IFRAME") hookTilingFrame(node);
              else node.querySelectorAll("iframe").forEach(hookTilingFrame);
            });
          });
        }).observe(grid, { childList: true, subtree: true });

        // CodingBooth Help (the overlay, parsed after this script) gets the
        // key table, the way i3--setup.sh's i3-help.js adds the desktop's.
        document.addEventListener("DOMContentLoaded", function() {
          if (!window.BoothHelp || typeof window.BoothHelp.addTab !== "function") return;
          // Ctrl+Alt first, then Ctrl+Alt+Shift.
          const keys = [
            ["Ctrl+Alt+h / j / k / l", "Focus the pane left / down / up / right (arrows work too)"],
            ["Ctrl+Alt+Enter  or  +", "Open a pane (up to six)"],
            ["Ctrl+Alt+b / Ctrl+Alt+v", "Next pane opens beside / below this one"],
            ["Ctrl+Alt+1 … 6", "Go to session 1 … 6, opening it if closed"],
            ["Ctrl+Alt+f", "The pane fills the console / back"],
            ["Ctrl+Alt+e", "Turn the pane's split the other way (side by side ↔ stacked)"],
            ["Ctrl+Alt+=", "Equalize: every pane in the layout the same size"],
            ["Ctrl+Alt+Shift+h / j / k / l", "Move the pane left / down / up / right"],
            ["Ctrl+Alt+Shift+q  or  −", "Close the pane — its session keeps running"],
            ["Ctrl+Alt+Shift+x  or  ⏻", "Reset the session: a fresh shell (asks first; stops what runs in it)"]
          ];
          const rows = keys.map(function(k) {
            return '<tr><td style="padding:2px 12px 2px 0;white-space:nowrap"><code>' + k[0] +
              '</code></td><td style="padding:2px 0">' + k[1] + '</td></tr>';
          }).join("");
          window.BoothHelp.addTab("console", "Console Shortcuts",
            '<p class="msg-dialog-lead">The console tiles its six sessions the way the ' +
            '<strong>i3</strong> window manager tiles windows, with <strong>Ctrl+Alt</strong> ' +
            'as the modifier. The toolbar has every 2×2 layout and the 3×2 grid, and its ' +
            '<strong>+</strong> / <strong>−</strong> buttons open and close panes; a shortcut ' +
            'can reach any arrangement of up to six. A layout without a button shows as ' +
            '<strong>Other</strong>.</p>' +
            '<table style="border-collapse:collapse;font-size:13px">' + rows + '</table>' +
            '<h3>Shortcut did nothing?</h3>' +
            '<p>A web tab showing an outside site keeps its keys to itself: click into a ' +
            'terminal pane first. Ctrl+Alt+arrows may be taken by your own desktop; ' +
            'h/j/k/l always work.</p>' +
            '<img src="console-ui-tile-keys.webp" alt="Hold Ctrl+Alt, then press H J K L to focus ' +
            'the pane left, down, up or right" style="display:block;width:100%;max-width:405px;' +
            'margin:14px auto 0;border-radius:8px" onerror="this.remove()">');
        });
      }

      // ── Web proxy ──
      const proxyStorageKey = "cb.webSplit." + projectName + ".proxy";

      function loadProxyState() {
        try {
          const raw = window.localStorage.getItem(proxyStorageKey);
          return raw ? JSON.parse(raw) : {};
        } catch (_e) {
          return {};
        }
      }

      function saveProxyState(state) {
        try {
          window.localStorage.setItem(proxyStorageKey, JSON.stringify(state));
        } catch (_e) { /* ignore */ }
        scheduleConsoleSave();
      }

      const proxyState = loadProxyState();
      let nextTabSeq = 1;
      function nextTabId() {
        return "t" + (nextTabSeq++) + "_" + Date.now().toString(36);
      }

      // A pane's Web view holds a list of tabs plus which one is active, not
      // one single target — the old shape (`{ port, path, ... }`) can't be
      // mapped onto a specific tab, so it's dropped on upgrade rather than
      // guessed at: the pane just opens fresh in Terminal mode.
      function getPaneState(session) {
        var data = proxyState[session];
        if (!data || !Array.isArray(data.tabs)) {
          data = { tabs: [], activeTabId: null };
          proxyState[session] = data;
        }
        return data;
      }

      function getActiveTab(session) {
        var state = getPaneState(session);
        if (!state.activeTabId) return null;
        for (var i = 0; i < state.tabs.length; i++) {
          if (state.tabs[i].id === state.activeTabId) return state.tabs[i];
        }
        return null;
      }

      // viewmd's default listen port — the Markdown button is a shortcut to
      // the same web view as typing this into the globe bar.
      const VIEWMD_PORT = 8765;

      function setMdToggle(pane, on) {
        var btn = pane && pane.querySelector(".md-toggle");
        if (!btn) return;
        if (on) {
          btn.classList.add("active-md");
          btn.title = "Close Markdown viewer";
        } else {
          btn.classList.remove("active-md");
          btn.title = "Markdown viewer";
        }
      }

      function isViewmdPort(port) {
        return Number(port) === VIEWMD_PORT;
      }

      // Every URL this page builds is relative to where it is served from: "/" on
      // its own port, or e.g. "/proxy/11111/" when a second console is opened
      // through another page's proxy (code-server's Web Preview). An absolute
      // "/s1/" would leave that path and land on the other page's server.
      var CONSOLE_BASE = window.location.pathname.replace(/[^/]*$/, "");

      // A path as this console's own nginx sees it: CONSOLE_BASE taken off.
      function consolePath(pathname) {
        return pathname.indexOf(CONSOLE_BASE) === 0
          ? "/" + pathname.slice(CONSOLE_BASE.length)
          : pathname;
      }

      // Globe bar: `http://booth:{port}{path}` → iframe `proxy/{port}{path}`.
      // Only host "booth" routes through this rewrite (and only over http —
      // the proxy has no TLS to speak of); every other host, including
      // localhost/127.0.0.1, is an externalTarget instead, loaded directly
      // with no rewrite at all.
      function proxySrc(port, path, query, hash) {
        var p = path && path.charAt(0) === "/" ? path : "/" + (path || "");
        if (p === "") p = "/";
        return "proxy/" + port + p + (query || "") + (hash || "");
      }

      function proxyDisplay(port, path, query, hash) {
        var shown = "http://booth:" + port;
        if (path && path !== "/") shown += path;
        else shown += "/";
        return shown + (query || "") + (hash || "");
      }

      function normalizeTarget(portStr, rest) {
        var portNum = parseInt(portStr, 10);
        if (!portNum || portNum < 1 || portNum > 65535) {
          return { error: "port" };
        }
        if (portNum >= 10000 && portNum <= 10007) {
          return { error: "reserved" };
        }

        rest = rest == null ? "" : String(rest);
        var hash = "";
        var hashIdx = rest.indexOf("#");
        if (hashIdx >= 0) {
          hash = rest.slice(hashIdx);
          rest = rest.slice(0, hashIdx);
        }
        var query = "";
        var qIdx = rest.indexOf("?");
        if (qIdx >= 0) {
          query = rest.slice(qIdx);
          rest = rest.slice(0, qIdx);
        }

        var path = "/";
        if (rest) {
          path = rest.charAt(0) === "/" ? rest : "/" + rest;
        }
        if (path === "") path = "/";

        return {
          port: portNum,
          path: path,
          query: query,
          hash: hash,
          src: proxySrc(portNum, path, query, hash),
          display: proxyDisplay(portNum, path, query, hash)
        };
      }

      // "booth" is the only host that means this booth's own proxy — unlike
      // localhost/127.0.0.1, which mean the machine the browser itself is
      // running on, same as typing them into any other address bar.
      function fromBooth(port, rest) {
        if (!port) return { error: "port" };
        return normalizeTarget(port, rest || "/");
      }

      // A non-booth target: loaded directly in the tab's iframe, unproxied,
      // no /proxy/ rewrite. No port of ours to speak of — see every place
      // that reads tab.port as "is this tab non-empty" (it isn't, for
      // these) versus tab.display (always set once a tab has loaded
      // *something*, booth or not).
      function externalTarget(scheme, host, port, rest) {
        rest = rest == null || rest === "" ? "/" : String(rest);
        var url = scheme + "://" + host + (port ? ":" + port : "") + rest;
        return { port: null, src: url, display: url };
      }

      function parseBoothTarget(raw, sessionNum) {
        var s = String(raw || "").trim();
        if (!s) return { error: "empty" };

        // A full scheme://host[:port][/path] URL. Only host "booth" goes
        // through the /proxy/ rewrite below (and only over http — the proxy
        // has no TLS); every other host, localhost/127.0.0.1 included,
        // opens directly in the tab's own iframe — this becomes an iframe
        // src, so any scheme besides http/https (a custom app URI,
        // javascript:, data:, ...) is refused outright rather than handed a
        // free pass.
        var urlMatch = s.match(/^([a-zA-Z][a-zA-Z0-9+.-]*):\/\/([^/:?#]+)(?::(\d+))?([/?#].*)?$/);
        if (urlMatch) {
          var scheme = urlMatch[1].toLowerCase();
          var host = urlMatch[2];
          var port = urlMatch[3];
          var rest = urlMatch[4] || "/";
          var lowerHost = host.toLowerCase();
          if (lowerHost === "booth") {
            if (scheme !== "http") return { error: "https" };
            return fromBooth(port, rest);
          }
          if (scheme !== "http" && scheme !== "https") {
            return { error: "scheme" };
          }
          return externalTarget(scheme, host, port, rest);
        }

        // Globe click prefills `http://booth`; the rest is typed as `:8080/path`.
        var colonPort = s.match(/^:(\d+)([/?#].*)?$/);
        if (colonPort) {
          return normalizeTarget(colonPort[1], colonPort[2] || "/");
        }

        var boothBare = s.match(/^booth:(\d+)([/?#].*)?$/i);
        if (boothBare) {
          return normalizeTarget(boothBare[1], boothBare[2] || "/");
        }

        // Bare `localhost[:port][/path]` / `127.0.0.1[:port][/path]`, no
        // scheme — the machine running the browser, not this booth. Assumes
        // http, since that's overwhelmingly what a local dev server runs.
        var hostPort = s.match(/^(localhost|127\.0\.0\.1)(?::(\d+))?([/?#].*)?$/i);
        if (hostPort) {
          return externalTarget("http", hostPort[1].toLowerCase(), hostPort[2], hostPort[3] || "/");
        }

        if (s.charAt(0) === "/" || s.charAt(0) === "?" || s.charAt(0) === "#") {
          var cur = getActiveTab(sessionNum);
          if (cur && cur.port) {
            if (s.charAt(0) === "/") return normalizeTarget(cur.port, s);
            return normalizeTarget(cur.port, "/" + s);
          }
          return { error: "port" };
        }

        var pm = s.match(/^(\d+)([/?#].*)?$/);
        if (pm) {
          return normalizeTarget(pm[1], pm[2] || "/");
        }

        // A bare host with no scheme — pasting `example.com` or
        // `example.com/path` the way you'd type it into a real address bar.
        // Requires a dot, so a plain typo or word (no TLD-shaped suffix)
        // still isn't treated as a host here.
        var bareHost = s.match(/^([a-zA-Z0-9-]+(?:\.[a-zA-Z0-9-]+)+)(?::(\d+))?([/?#].*)?$/);
        if (bareHost) {
          return externalTarget("https", bareHost[1].toLowerCase(), bareHost[2], bareHost[3] || "/");
        }

        // A single-label host with no dot (`myserver:3000`, an internal/LAN
        // name) is too ambiguous with a plain typo on its own, but paired
        // with an explicit :port it's an unambiguous host:port shorthand —
        // same treatment as any other bare host above.
        var bareHostPort = s.match(/^([a-zA-Z0-9-]+):(\d+)([/?#].*)?$/);
        if (bareHostPort) {
          return externalTarget("https", bareHostPort[1].toLowerCase(), bareHostPort[2], bareHostPort[3] || "/");
        }

        // Nothing above matched — not a URL, not a recognizable host shape.
        // Same fallback a real browser's address bar uses: treat it as a
        // search query. igu=1 is Google's own (undocumented) flag that lets
        // its results page be framed at all — it refuses by default, same
        // as most sites. title carries the "Search: ..." label for the tab
        // chip; display stays the raw typed text, not the constructed URL,
        // so the address bar shows what was actually typed.
        return {
          port: null,
          src: "https://www.google.com/search?q=" + encodeURIComponent(s) + "&igu=1",
          display: s,
          title: "Search: " + s
        };
      }

      function flashAddrError(input, placeholder) {
        var box = input.closest(".proxy-addr");
        if (box) box.classList.add("error");
        var prevPlaceholder = input.placeholder;
        var prevValue = input.value;
