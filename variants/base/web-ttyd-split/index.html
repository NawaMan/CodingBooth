        var clearValue = placeholder && placeholder !== "http only";
        if (clearValue) {
          input.value = "";
          input.placeholder = placeholder;
        }
        setTimeout(function() {
          if (box) box.classList.remove("error");
          if (clearValue) {
            input.placeholder = prevPlaceholder;
            // Only hand the rejected text back if the user hasn't already
            // started typing something else during the flash — restoring
            // it unconditionally would clobber a fresh edit mid-keystroke.
            if (input.value === "") input.value = prevValue;
          }
        }, placeholder ? 1500 : 1000);
      }

      function setAddrOpen(pane, open) {
        var header = pane.querySelector(".pane-header");
        if (!header) return;
        if (open) header.classList.add("web-addr-open");
        else header.classList.remove("web-addr-open");
      }

      function setPageTitleTip(pane, text) {
        var tip = pane.querySelector(".proxy-page-title");
        if (tip) tip.setAttribute("title", text || "");
      }

      // iframe belongs to a specific web tab (dataset.tabId) — the terminal
      // frame has no tabId and is ignored here.
      function syncAddrFromIframe(iframe) {
        var pane = iframe.closest(".pane");
        if (!pane) return;
        var session = pane.getAttribute("data-pane");
        var tabId = iframe.dataset.tabId;
        if (!tabId) return;
        var state = getPaneState(session);
        var tab = null;
        for (var i = 0; i < state.tabs.length; i++) {
          if (state.tabs[i].id === tabId) { tab = state.tabs[i]; break; }
        }
        if (!tab) return;
        try {
          var loc = iframe.contentWindow.location;
          var m = consolePath(loc.pathname).match(/^\/proxy\/(\d+)(\/.*)?$/);
          if (!m) return;
          var target = normalizeTarget(m[1], (m[2] || "/") + loc.search + loc.hash);
          if (target.error) return;

          tab.port = target.port;
          tab.path = target.path;
          tab.query = target.query;
          tab.display = target.display;
          var pageTitle = "";
          try {
            pageTitle = (iframe.contentDocument && iframe.contentDocument.title) || "";
          } catch (_t) { /* ignore */ }
          tab.title = pageTitle || target.display;
          saveProxyState(proxyState);

          if (state.activeTabId === tabId) {
            var input = pane.querySelector(".proxy-port-input");
            if (input && document.activeElement !== input) {
              input.value = target.display;
            }
            setPageTitleTip(pane, tab.title);
            setMdToggle(pane, isViewmdPort(target.port));
          }
          renderTabStrip(session); // the tab pill may have just picked up a real page title
        } catch (_e) { /* cross-origin */ }
      }

      // Only meaningful for a booth (proxied, same-origin) tab: reading
      // .history at all on a genuinely cross-origin frame throws a
      // SecurityError outright, so there's no history to drive for an
      // external tab this way — see updateAddrBarForActiveTab, which hides
      // these buttons entirely rather than showing them permanently
      // disabled for that case. (A parent-tracked, address-bar-only
      // history was tried here and removed: it can't see a link clicked
      // *inside* a cross-origin page, which is how people actually browse
      // one, so it stayed disabled for the common case anyway.)
      function iframeHistory(iframe, delta) {
        if (!iframe) return;
        try {
          if (delta < 0) iframe.contentWindow.history.back();
          else iframe.contentWindow.history.forward();
        } catch (_e) { /* cross-origin */ }
      }

      function activeWebFrame(pane) {
        return pane && pane.querySelector(".web-tab-frame.is-active");
      }

      // "Open in new tab" works the same for any tab, booth or external —
      // window.open() doesn't care about same-origin. The other three
      // web-tools buttons are booth-only; see updateAddrBarForActiveTab.
      function setWebTools(pane, on) {
        var el = pane.querySelector(".proxy-open-tab");
        if (el) el.style.display = on ? "" : "none";
      }

      // A pane's target, recorded on the frame and only loaded while the booth
      // is answering. nginx serves this page before the ttyd processes behind
      // it are listening, so a frame pointed at /s1/ too early shows nginx's
      // 502 rather than a terminal; the readiness gate below loads it, and
      // loads it again whenever the booth comes back. See booth-ready.js.
      function setPaneSrc(iframe, src) {
        iframe.dataset.boothSrc = src;
        if (window.BoothReady && window.BoothReady.isUp()) {
          iframe.src = src;
        }
      }

      // Inject a baseline light-mode style into same-origin iframes that
      // haven't declared their own color-scheme. Lets unstyled apps (hello-world
      // demos) render with a normal white background instead of inheriting the
      // OS dark-mode default. Apps that opt into a theme (color-scheme meta or
      // explicit body background) are left alone.
      function applyIframeFallbackStyle(iframe) {
        try {
          const doc = iframe.contentDocument;
          if (!doc || !doc.head) return;
          if (doc.querySelector('meta[name="color-scheme"]')) return;
          const target = doc.body || doc.documentElement;
          const bg = doc.defaultView.getComputedStyle(target).backgroundColor;
          if (bg && bg !== "rgba(0, 0, 0, 0)" && bg !== "transparent") return;

          const meta = doc.createElement("meta");
          meta.setAttribute("name", "color-scheme");
          meta.setAttribute("content", "light");
          doc.head.appendChild(meta);

          const style = doc.createElement("style");
          style.textContent = "html,body{background:#fff;color:#1a1a1a}";
          doc.head.appendChild(style);
        } catch (_e) {
          // Cross-origin iframe — can't (and shouldn't) inject. Silent no-op.
        }
      }

      // Ctrl/Cmd-click on a link normally opens a new *browser* tab —
      // standard behavior for any link, iframe or not, and not something
      // the parent page can intercept from outside. For a same-origin
      // (booth-proxied) tab we can inject into the frame's own document,
      // same as applyIframeFallbackStyle above, and redirect that click to
      // navigate the frame in place instead. Only possible here — a
      // genuinely cross-origin (external) tab's document is as unreachable
      // as its history object is (see iframeHistory).
      function keepLinkClicksInFrame(iframe) {
        try {
          const doc = iframe.contentDocument;
          if (!doc) return;
          doc.addEventListener("click", function(e) {
            if (!e.ctrlKey && !e.metaKey) return;
            const a = e.target && e.target.closest && e.target.closest("a[href]");
            if (!a) return;
            e.preventDefault();
            e.stopPropagation();
            iframe.contentWindow.location.href = a.href;
          }, true);
        } catch (_e) {
          // Cross-origin iframe — can't reach its document at all. Silent no-op.
        }
      }

      document.querySelectorAll(".pane .term-frame").forEach(function(iframe) {
        iframe.addEventListener("load", function() {
          applyIframeFallbackStyle(iframe);
          syncAddrFromIframe(iframe);
        });
      });

      document.querySelectorAll(".proxy-reload").forEach(function(btn) {
        btn.addEventListener("click", function() {
          reloadFrame(activeWebFrame(btn.closest(".pane")));
        });
      });

      function setGlobeProxyPort(port) {
        if (port) {
          document.cookie = "cb_proxy_port=" + port + "; Path=/; SameSite=Lax";
        } else {
          document.cookie = "cb_proxy_port=; Path=/; Max-Age=0; SameSite=Lax";
        }
      }

      // Rebuilds a pane's tab strip from state — cheap enough (a handful of
      // tabs at most) to just redraw wholesale on every change rather than
      // diff it.
      function renderTabStrip(session) {
        var pane = document.querySelector('.pane[data-pane="' + session + '"]');
        var list = pane && pane.querySelector(".tab-list");
        if (!list) return;
        var state = getPaneState(session);
        list.innerHTML = "";
        state.tabs.forEach(function(tab) {
          var pill = document.createElement("div");
          pill.className = "tab-pill" + (tab.id === state.activeTabId ? " is-active" : "");
          pill.dataset.tabId = tab.id;

          var label = document.createElement("span");
          label.className = "tab-pill-label";
          label.textContent = tab.title || tab.display || "New tab";
          pill.appendChild(label);

          var close = document.createElement("button");
          close.className = "tab-pill-close";
          close.title = "Close tab";
          close.textContent = "×";
          close.addEventListener("click", function(e) {
            e.stopPropagation();
            closeTab(session, tab.id);
          });
          pill.appendChild(close);

          pill.addEventListener("click", function() {
            activateTab(session, tab.id);
          });

          list.appendChild(pill);
        });
      }

      // Address bar, toolbar buttons, page-title tip, and the pane's
      // has-active-tab/active-tab-empty flags all just reflect whichever
      // tab is active — recomputed here after anything changes it.
      function updateAddrBarForActiveTab(session) {
        var pane = document.querySelector('.pane[data-pane="' + session + '"]');
        if (!pane) return;
        var input = pane.querySelector(".proxy-port-input");
        var tab = getActiveTab(session);
        // display, not port: an external tab (see externalTarget) has a real
        // loaded address but no booth port at all, so port alone would read
        // a fully-loaded external tab as still-empty.
        var hasContent = !!(tab && tab.display);
        setWebTools(pane, hasContent);
        if (input) input.value = (tab && tab.display) || "";
        setPageTitleTip(pane, (tab && (tab.title || tab.display)) || "");
        setMdToggle(pane, !!(tab && isViewmdPort(tab.port)));
        // Back/forward and the rewriting-caveat warning only make sense for
        // a booth (proxied, same-origin) tab. Back/forward drive the
        // iframe's own history, and a genuinely cross-origin tab refuses to
        // expose that at all (reading .history on it throws outright) —
        // there's no way to make these work for an external tab, so they're
        // hidden there instead of shown permanently disabled. The warning
        // is about the /proxy/ sub_filter specifically, which an external
        // tab never goes through either.
        var isBoothTab = hasContent && !!tab.port;
        ["proxy-hist-back", "proxy-hist-forward", "proxy-warning"].forEach(function(cls) {
          var el = pane.querySelector("." + cls);
          if (el) el.style.display = isBoothTab ? "" : "none";
        });
        pane.classList.toggle("has-active-tab", !!tab);
        pane.classList.toggle("active-tab-empty", !!tab && !hasContent);
      }

      function activateTab(session, tabId) {
        var pane = document.querySelector('.pane[data-pane="' + session + '"]');
        if (!pane) return;
        var state = getPaneState(session);
        state.activeTabId = tabId;
        saveProxyState(proxyState);

        pane.querySelectorAll(".web-tab-frame").forEach(function(frame) {
          frame.classList.toggle("is-active", frame.dataset.tabId === tabId);
        });

        var tab = getActiveTab(session);
        setGlobeProxyPort(tab ? tab.port : null);
        renderTabStrip(session);
        updateAddrBarForActiveTab(session);
      }

      // One real iframe per tab, kept mounted (just hidden) once created —
      // switching tabs is a visibility toggle, not a reload, so a background
      // tab's scroll position, form state, and websockets survive it.
      function createTabFrame(session, tab) {
        var pane = document.querySelector('.pane[data-pane="' + session + '"]');
        var body = pane && pane.querySelector(".pane-body");
        if (!body) return null;
        var iframe = document.createElement("iframe");
        iframe.className = "web-tab-frame";
        iframe.dataset.tabId = tab.id;
        iframe.title = tab.title || tab.display || "Web tab";
        iframe.addEventListener("load", function() {
          applyIframeFallbackStyle(iframe);
          syncAddrFromIframe(iframe);
          keepLinkClicksInFrame(iframe);
        });
        body.appendChild(iframe);
        iframe.src = tab.src;
        return iframe;
      }

      function openNewTab(session) {
        var pane = document.querySelector('.pane[data-pane="' + session + '"]');
        if (!pane) return;
        var state = getPaneState(session);
        var tab = { id: nextTabId(), port: null, path: null, query: "", display: "", title: "" };
        state.tabs.push(tab);
        pane.classList.add("mode-web");
        activateTab(session, tab.id);

        var input = pane.querySelector(".proxy-port-input");
        if (input) {
          // Prefill the host so the next keys are `:<port>/<path>`.
          input.value = "http://booth";
          input.focus();
          if (typeof input.setSelectionRange === "function") {
            var n = input.value.length;
            input.setSelectionRange(n, n);
          }
        }
      }

      // Navigating the address bar always acts on the active tab — creating
      // one first if the pane somehow has none — matching how a browser's
      // address bar navigates the current tab rather than opening a new one.
      function navigateActiveTab(session, target) {
        var state = getPaneState(session);
        var tab = getActiveTab(session);
        if (!tab) {
          tab = { id: nextTabId() };
          state.tabs.push(tab);
          state.activeTabId = tab.id;
        }
        tab.port = target.port;
        tab.path = target.path;
        tab.query = target.query;
        tab.display = target.display;
        tab.title = target.title || target.display;
        // Stored explicitly rather than always re-derived: a search
        // target's display is the raw typed text (so the address bar shows
        // what was typed, not the constructed URL), not something src can
        // be recomputed from the way a booth target's can.
        tab.src = target.src;
        saveProxyState(proxyState);

        var pane = document.querySelector('.pane[data-pane="' + session + '"]');
        var existingFrame = pane && pane.querySelector('.web-tab-frame[data-tab-id="' + tab.id + '"]');
        if (existingFrame) {
          existingFrame.src = target.src;
        } else {
          createTabFrame(session, { id: tab.id, src: target.src, title: tab.title, display: target.display });
        }

        activateTab(session, tab.id);
      }

      function closeTab(session, tabId) {
        var pane = document.querySelector('.pane[data-pane="' + session + '"]');
        if (!pane) return;
        var state = getPaneState(session);
        var idx = state.tabs.findIndex(function(t) { return t.id === tabId; });
        if (idx === -1) return;

        var frame = pane.querySelector('.web-tab-frame[data-tab-id="' + tabId + '"]');
        if (frame) frame.remove();

        var wasActive = state.activeTabId === tabId;
        state.tabs.splice(idx, 1);

        if (wasActive) {
          var next = state.tabs[idx] || state.tabs[idx - 1] || null;
          state.activeTabId = next ? next.id : null;
        }
        saveProxyState(proxyState);

        if (state.activeTabId) {
          activateTab(session, state.activeTabId);
        } else {
          setGlobeProxyPort(null);
          renderTabStrip(session);
          updateAddrBarForActiveTab(session);
        }
      }

      function switchToWeb(sessionNum) {
        const pane = document.querySelector('.pane[data-pane="' + sessionNum + '"]');
        if (!pane) return;
        const toggleBtn = pane.querySelector(".proxy-toggle");
        const state = getPaneState(sessionNum);

        pane.classList.add("mode-web");
        setAddrOpen(pane, true);
        toggleBtn.classList.add("active-web");
        toggleBtn.title = "Back to terminal";

        if (state.tabs.length === 0) {
          openNewTab(sessionNum);
          return;
        }

        var activeId = state.activeTabId && state.tabs.some(function(t) { return t.id === state.activeTabId; })
          ? state.activeTabId
          : state.tabs[0].id;
        activateTab(sessionNum, activeId);
      }

      function switchToTerminal(sessionNum) {
        const pane = document.querySelector('.pane[data-pane="' + sessionNum + '"]');
        if (!pane) return;
        const toggleBtn = pane.querySelector(".proxy-toggle");

        // Tabs and their iframes stay mounted, just hidden — but the active
        // web-tab-frame's own is-active class has to come off explicitly
        // here too, not just the pane's has-active-tab: that's a separate
        // CSS rule keyed off the iframe itself (.web-tab-frame.is-active {
        // display: block }), so removing has-active-tab alone un-hides the
        // terminal underneath without ever hiding the web tab stacked on
        // top of it. activateTab recomputes is-active correctly the moment
        // Web view is opened again, so this loses no state.
        pane.querySelectorAll(".web-tab-frame.is-active").forEach(function(frame) {
          frame.classList.remove("is-active");
        });
        // The terminal iframe is never repointed by any of this (each web
        // tab gets its own frame now), so it doesn't need reloading here
        // either; toggling back to Web view later restores exactly where
        // this pane left off.
        pane.classList.remove("mode-web", "has-active-tab", "active-tab-empty");
        setAddrOpen(pane, false);
        toggleBtn.classList.remove("active-web");
        toggleBtn.title = "Web view";
        setGlobeProxyPort(null);
      }

      document.querySelectorAll(".proxy-toggle").forEach(function(btn) {
        btn.addEventListener("click", function() {
          if (btn.classList.contains("active-web")) {
            switchToTerminal(btn.dataset.session);
          } else {
            switchToWeb(btn.dataset.session);
          }
        });
      });

      document.querySelectorAll(".tab-add").forEach(function(btn) {
        btn.addEventListener("click", function() {
          openNewTab(btn.dataset.pane);
        });
      });

      function ensureViewmd() {
        return fetch("booth-messages/api/viewmd", { method: "POST" }).then(function(r) {
          if (!r.ok) throw new Error("viewmd start failed");
        });
      }

      // Starts the viewmd service before navigating a tab there by any means
      // other than the Markdown button (which already awaits ensureViewmd()
      // itself, below). Without this, a tab pointed at VIEWMD_PORT — by
      // typing "booth:8765" into the address bar, or by a .booth/console.json
      // starting tab — loads before the service is up and shows nginx's own
      // 502, since nothing else ever asked for it to start. Confirmed by
      // hand: a console.json tab targeting VIEWMD_PORT showed exactly that.
      function ensureViewmdIfTarget(port) {
        return isViewmdPort(port) ? ensureViewmd() : Promise.resolve();
      }

      document.querySelectorAll(".md-toggle").forEach(function(btn) {
        btn.addEventListener("click", function() {
          var session = btn.dataset.session;
          var pane = btn.closest(".pane");
          var toggle = pane && pane.querySelector(".proxy-toggle");
          var active = getActiveTab(session);
          if (toggle && toggle.classList.contains("active-web") && active && isViewmdPort(active.port)) {
            switchToTerminal(session);
            return;
          }
          if (btn.dataset.busy) return;
          btn.dataset.busy = "1";
          ensureViewmd().then(function() {
            var parsed = parseBoothTarget("http://booth:" + VIEWMD_PORT);
            if (parsed.error) return;
            if (!toggle || !toggle.classList.contains("active-web")) {
              switchToWeb(session);
            }
            navigateActiveTab(session, parsed);
          }).catch(function() {
            btn.title = "Markdown viewer failed to start";
          }).then(function() {
            delete btn.dataset.busy;
          });
        });
      });

      document.querySelectorAll(".proxy-port-input").forEach(function(input) {
        input.addEventListener("keydown", function(e) {
          if (e.key === "Enter") {
            e.preventDefault();
            var session = input.dataset.session;
            var parsed = parseBoothTarget(input.value, session);
            if (parsed.error === "reserved") {
              flashAddrError(input, "reserved");
              return;
            }
            if (parsed.error === "https") {
              flashAddrError(input, "http only");
              return;
            }
            if (parsed.error) {
              flashAddrError(input);
              return;
            }
            ensureViewmdIfTarget(parsed.port).finally(function() {
              navigateActiveTab(session, parsed);
            });
          } else if (e.key === "Escape") {
            var session = input.dataset.session;
            var tab = getActiveTab(session);
            if (tab && !tab.display) {
              // Never-navigated tab (the "+"/globe just opened it) — Escape
              // cancels it outright rather than leaving an empty tab behind,
              // since that's a deliberate cancel, not an incidental blur.
              var state = getPaneState(session);
              var wasOnlyTab = state.tabs.length === 1;
              closeTab(session, tab.id);
              if (wasOnlyTab) switchToTerminal(session);
            } else {
              input.blur();
            }
          }
        });

        input.addEventListener("blur", function() {
          var pane = input.closest(".pane");
          var toggle = pane && pane.querySelector(".proxy-toggle");
          if (!toggle || !toggle.classList.contains("active-web")) return;
          var session = input.dataset.session;
          var parsed = parseBoothTarget(input.value, session);
          if (parsed && !parsed.error) {
            input.value = parsed.display;
            return;
          }
          // Unparseable — typically just the "http://booth" prefill or a
          // still-incomplete edit. Revert to the active tab's own known-good
          // address if it has one; otherwise leave the input as the user
          // left it. A blank tab has no display to revert to, and clicking
          // its own empty body is what fires this blur in the first place —
          // wiping the input right back to nothing on that click, every
          // time, is the bug this guards against.
          var tab = getActiveTab(session);
          if (tab && tab.display) {
            input.value = tab.display;
          }
        });
      });

      document.querySelectorAll(".proxy-hist-back").forEach(function(btn) {
        btn.addEventListener("click", function() {
          iframeHistory(activeWebFrame(btn.closest(".pane")), -1);
        });
      });

      document.querySelectorAll(".proxy-hist-forward").forEach(function(btn) {
        btn.addEventListener("click", function() {
          iframeHistory(activeWebFrame(btn.closest(".pane")), 1);
        });
      });

      document.querySelectorAll(".proxy-open-tab").forEach(function(btn) {
        btn.addEventListener("click", function() {
          var session = btn.dataset.session;
          var pane = btn.closest(".pane");
          var input = pane.querySelector(".proxy-port-input");
          var parsed = parseBoothTarget(input && input.value, session);
          if (parsed && !parsed.error) {
            window.open(parsed.src, "_blank");
            return;
          }
          var tab = getActiveTab(session);
          if (tab && tab.port) {
            window.open(proxySrc(tab.port, tab.path || "/", tab.query || ""), "_blank");
          }
        });
      });

      // .booth/console.json can force a pane's state to be cleared before
      // this browser's own saved state ever gets a look-in — either back to
      // plain terminal with an explicit `"web": false`, or (with
      // `"force": true` alongside `"web": true`) so a *changed* set of
      // starting tabs actually takes effect instead of whatever this pane
      // already had saved. Unlike the tabs-restore default further below —
      // a first-visit default only, which never touches a pane the browser
      // already has state for — this is a standing override: for "this
      // pane's config always wins" project configs, not a one-time nudge.
      // `web: false` is inherently a forced terminal — nothing downstream
      // re-populates a cleared pane as web unless the config also says so —
      // so it needs no separate `force` flag of its own. Runs before the
      // restore-from-localStorage loop so a forced pane is simply absent
      // from proxyState by the time that loop looks at it.
      if (consoleConfig.panes && typeof consoleConfig.panes === "object") {
        var forcedPaneChange = false;
        Object.keys(consoleConfig.panes).forEach(function(session) {
          var paneCfg = consoleConfig.panes[session];
          var shouldForce = paneCfg && proxyState[session] &&
            (paneCfg.web === false || paneCfg.force === true);
          if (shouldForce) {
            delete proxyState[session];
            forcedPaneChange = true;
          }
        });
        if (forcedPaneChange) saveProxyState(proxyState);
      }

      // Restore every saved tab's iframe on load (not just the active one),
      // so switching between them post-reload doesn't need a fresh navigate
      // — that persistence is the whole point of tabs surviving a reload.
      Object.keys(proxyState).forEach(function(session) {
        var state = getPaneState(session);
        if (!state.tabs.length) return;
        var pane = document.querySelector('.pane[data-pane="' + session + '"]');
        if (!pane) return;

        pane.classList.add("mode-web");
        setAddrOpen(pane, true);
        var toggleBtn = pane.querySelector(".proxy-toggle");
        if (toggleBtn) {
          toggleBtn.classList.add("active-web");
          toggleBtn.title = "Back to terminal";
        }

        var validTabs = [];
        state.tabs.forEach(function(tab) {
          if (!tab.display) return; // drop a half-open "new tab" from a stale save
          // Prefer the stored src (needed for a search tab — its display is
          // the raw typed text, not a URL, so it can't be recomputed from
          // that). Falls back to reconstructing it for a tab saved before
          // src was persisted: a booth tab's from port/path/query, an
          // external tab's display was always the literal src already.
          var src = tab.src || (tab.port
            ? proxySrc(tab.port, tab.path || "/", tab.query || "")
            : tab.display);
          createTabFrame(session, {
            id: tab.id,
            src: src,
            title: tab.title,
            display: tab.display
          });
          validTabs.push(tab);
        });
        state.tabs = validTabs;
        if (!state.tabs.some(function(t) { return t.id === state.activeTabId; })) {
          state.activeTabId = state.tabs.length ? state.tabs[0].id : null;
        }
        saveProxyState(proxyState);

        if (state.activeTabId) {
          activateTab(session, state.activeTabId);
        } else {
          renderTabStrip(session);
          updateAddrBarForActiveTab(session);
        }
      });

      // Apply .booth/console.json's per-pane starting tabs — but only to a
      // pane the restore-from-localStorage loop above left untouched. This
      // is a first-visit default, not a standing override: once a pane's
      // been opened in this browser (even just to look at it), whatever the
      // user left it as wins on every later load, same as the layout
      // fallback above.
      if (consoleConfig.panes && typeof consoleConfig.panes === "object") {
        Object.keys(consoleConfig.panes).forEach(function(session) {
          if (getPaneState(session).tabs.length) return;
          var paneCfg = consoleConfig.panes[session];
          if (!paneCfg || !paneCfg.web) return;
          var pane = document.querySelector('.pane[data-pane="' + session + '"]');
          if (!pane) return;

          var urls = Array.isArray(paneCfg.tabs) ? paneCfg.tabs : [];
          var opened = false;
          urls.forEach(function(raw, i) {
            var parsed = parseBoothTarget(raw, session);
            if (!parsed || parsed.error) {
              warnConsoleConfig("pane " + session + ": tab " + JSON.stringify(raw) + " cannot be opened (" +
                ((parsed && parsed.error) || "unknown") + "); skipped");
              return;
            }
            // navigateActiveTab always targets *whichever* tab is active
            // *when it runs* — and ensureViewmdIfTarget makes that a real
            // async wait (up to 5s for a cold viewmd, near-instant for
            // anything else), so these settle out of order. Pin each url to
            // its own tab id up front and re-assert it as active right
            // before navigating, so a late viewmd resolution can't land on
            // whatever tab a faster one already claimed.
            var state = getPaneState(session);
            var tabId;
            if (i === 0 && state.tabs.length === 0) {
              var first = { id: nextTabId() };
              state.tabs.push(first);
              tabId = first.id;
            } else if (i === 0) {
              tabId = state.tabs[0].id;
            } else {
              var blank = { id: nextTabId(), port: null, path: null, query: "", display: "", title: "" };
              state.tabs.push(blank);
              tabId = blank.id;
            }
            ensureViewmdIfTarget(parsed.port).finally(function() {
              getPaneState(session).activeTabId = tabId;
              navigateActiveTab(session, parsed);
            });
            opened = true;
          });
          if (opened) switchToWeb(session);
        });
      }

      // Load the panes once the booth answers, and reload them every time it
      // comes back — a booth--restart restarts ttyd under this very tab, and
      // without this the panes would sit on the 502 it left behind.
      window.BoothReady.onUp(function () {
        fontsReadyPromise.then(function () {
          panes.forEach(function (pane) {
            const iframe = pane.querySelector(".term-frame");
            iframe.src = iframe.dataset.boothSrc || iframe.dataset.defaultSrc;
          });
        });
      });

      const hashMode = parseModeFromHash();
      const savedMode = loadSavedLayout();
      const configLayout = consoleConfig.layout;
      setLayout(hashMode || savedMode || (isKnownLayout(configLayout) ? configLayout : "") || "single", { updateHash: false });

      // Initial load — restoring this browser's own tabs, applying the
      // checked-in config, setting the starting layout — is done. From here
      // on, a layout or tab change is a real interactive one, worth saving.
      suppressConsoleSave = false;
    })();
  </script>

  <script>
    window.BOOTH_SHOW_RUN_TIME = "${BOOTH_SHOW_RUN_TIME}";
    window.BOOTH_SHOW_COUNT_DOWN = "${BOOTH_SHOW_COUNT_DOWN}";
    window.BOOTH_IDLE_TIME = "${BOOTH_IDLE_TIME}";
    window.BOOTH_IDLE_SHUTDOWN_TIME = "${BOOTH_IDLE_SHUTDOWN_TIME}";
  </script>
  ${OVERLAY_HTML}
  ${PLUGINS_HTML}
</body>

</html>
