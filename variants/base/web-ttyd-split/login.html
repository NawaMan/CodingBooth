<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — ${BOOTH_CONTAINER_NAME}</title>
  ${BOOTH_FAVICON_LINK}
  <style>
    :root {
      --bg: #0b1018;
      --panel: #141c27;
      --panel-edge: #2b3a4d;
      --text: #e7edf5;
      --muted: #9badc2;
      --accent: #2f8dff;
      --danger: #ff6b6b;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      background: radial-gradient(circle at 20% 0, #1f2a3a 0%, var(--bg) 45%);
      color: var(--text);
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 360px;
      background: var(--panel);
      border: 1px solid var(--panel-edge);
      border-radius: 10px;
      padding: 28px 26px 24px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
    }

    .title {
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 4px;
    }

    .booth {
      font-size: 20px;
      font-weight: 600;
      margin: 0 0 22px;
      word-break: break-all;
    }

    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin: 0 0 6px;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 16px;
      background: #0a0e14;
      color: var(--text);
      border: 1px solid var(--panel-edge);
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .password-field {
      position: relative;
      margin-bottom: 16px;
    }

    .password-field input {
      margin-bottom: 0;
      padding-right: 42px;
    }

    .reveal {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 40px;
      display: grid;
      place-items: center;
      padding: 0;
      background: none;
      border: none;
      border-radius: 0 6px 6px 0;
      color: var(--muted);
      cursor: pointer;
    }

    .reveal:hover,
    .reveal:focus-visible {
      color: var(--text);
    }

    .reveal:focus-visible {
      outline: 1px solid var(--accent);
      outline-offset: -1px;
    }

    .reveal svg {
      width: 18px;
      height: 18px;
    }

    .reveal .icon-hide,
    .reveal[aria-pressed="true"] .icon-show {
      display: none;
    }

    .reveal[aria-pressed="true"] .icon-hide {
      display: block;
    }

    #submit {
      width: 100%;
      padding: 10px 12px;
      background: var(--accent);
      color: #fff;
      border: 1px solid var(--accent);
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    #submit:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .error {
      display: none;
      margin: 14px 0 0;
      font-size: 13px;
      color: var(--danger);
    }

    .error.shown {
      display: block;
    }
  </style>
</head>

<body>
  <form class="card" id="login-form" autocomplete="on">
    <p class="title">Coding Booth</p>
    <p class="booth">${BOOTH_CONTAINER_NAME}</p>

    <label for="username">Username</label>
    <input id="username" name="username" type="text" value="coder" autocomplete="username" spellcheck="false"
      autocapitalize="none">

    <label for="password">Password</label>
    <div class="password-field">
      <input id="password" name="password" type="password" autocomplete="current-password" autofocus>
      <button type="button" class="reveal" id="reveal" aria-label="Show password" aria-pressed="false"
        aria-controls="password" title="Show password">
        <svg class="icon-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" />
          <circle cx="12" cy="12" r="3" />
        </svg>
        <svg class="icon-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-2.2 3.1" />
          <path d="M6.6 6.6C3.8 8.4 2 12 2 12s3.5 7 10 7c1.9 0 3.6-.6 5-1.5" />
          <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
          <path d="M2 2l20 20" />
        </svg>
      </button>
    </div>

    <button type="submit" id="submit">Sign in</button>
    <p class="error" id="error"></p>
  </form>

  <script>
    (function () {
      // A pane whose session expired gets redirected here inside its iframe.
      // Take over the console instead of rendering a login card in a pane. The
      // console, not the top window: opened through another page's proxy (Web
      // Preview) the top window is that page, not this booth's console. And
      // this page's own URL, which that proxy has already rewritten.
      if (window.parent !== window.self) {
        var inConsole = false;
        try { inConsole = !!window.parent.document.querySelector('.term-frame'); } catch (e) { /* cross-origin */ }
        if (inConsole) {
          window.parent.location = window.location.href;
          return;
        }
      }

      var form = document.getElementById('login-form');
      var username = document.getElementById('username');
      var password = document.getElementById('password');
      var submit = document.getElementById('submit');
      var error = document.getElementById('error');
      var reveal = document.getElementById('reveal');

      function setRevealed(shown) {
        password.type = shown ? 'text' : 'password';
        var label = shown ? 'Hide password' : 'Show password';
        reveal.setAttribute('aria-pressed', shown ? 'true' : 'false');
        reveal.setAttribute('aria-label', label);
        reveal.title = label;
      }

      // Show the typed password so a typo can be spotted and fixed in place.
      // Keep the caret where it was: switching the type resets the selection.
      reveal.addEventListener('click', function () {
        var start = password.selectionStart;
        var end = password.selectionEnd;
        setRevealed(password.type === 'password');
        password.focus();
        if (start !== null) password.setSelectionRange(start, end);
      });

      function fail(message) {
        error.textContent = message;
        error.classList.add('shown');
        submit.disabled = false;
        password.value = '';
        password.focus();
      }

      // Base64 so the password survives the trip as an opaque token: the
      // receiving end is a bash server that pulls the field out with sed, and
      // quotes or backslashes in a JSON string would derail it.
      function encode(value) {
        return btoa(String.fromCharCode.apply(null, new TextEncoder().encode(value)));
      }

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        error.classList.remove('shown');
        submit.disabled = true;
        // Back to a masked field, so a password manager offering to save
        // still sees a password input.
        setRevealed(false);

        fetch('booth-messages/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username_b64: encode(username.value),
            password_b64: encode(password.value)
          })
        }).then(function (response) {
          if (response.ok) {
            window.location.replace('./');
            return;
          }
          fail(response.status === 401
            ? 'Wrong username or password.'
            : 'Sign-in failed (' + response.status + ').');
        }).catch(function () {
          fail('Could not reach the booth.');
        });
      });
    })();
  </script>
</body>

</html>
