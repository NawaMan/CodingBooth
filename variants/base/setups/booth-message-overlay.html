<!-- Booth Message Overlay — shared across all variants -->

  .bl-panel {

  .bl-header {

    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .bl-header:active {

  }

  .bl-collapse-btn {

  }

  .bl-body.collapsed {

  .bl-btn {

  .bl-btn-icon {

  .bl-btn-cancel {

  .bl-btn-cancel:hover {

  .bl-spinner {

  .bl-stopped {

  /* Idle-monitor status chip */

    display: none;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 5px 10px;
    border-radius: 6px;
    font-family: -apple-system, "Segoe UI", sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.3px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: background 0.15s, border-color 0.15s;
  }

  .bl-idle-chip.visible {
    display: flex;
  }

  .bl-idle-chip-active {
    background: #163527;
    color: #4ade80;
    border-color: #1e4a36;
  }

  .bl-idle-chip-active:hover {
    background: #1b4432;
  }

  .bl-idle-chip-pause {
    background: #162b43;
    color: #60a5fa;

  }

  .bl-idle-chip-pause:hover {

  }

  .bl-idle-chip-disable {

  .bl-idle-chip-disable:hover {

    }

  /* Chip-click "Idle shutdown" and timeout "Still using this booth?" dialog
     share this sectioned layout. */
  .msg-idle-dialog {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 1.25rem 1.5rem;

    font-family: -apple-system, "Segoe UI", sans-serif;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
  }

  .msg-idle-dialog h2 {
    margin: 0 0 0.5rem;
    font-size: 18px;
    font-weight: 500;
    color: #111827;
  }

  .msg-idle-dialog>p {
    margin: 0 0 1.25rem;
    font-size: 14px;
    line-height: 1.6;
    color: #6b7280;
  }

  .msg-idle-dialog>p strong {
    font-weight: 500;
    color: #111827;
  }

  .msg-idle-section {
    padding: 12px 0;
    border-top: 1px solid #e5e7eb;
  }

  .msg-idle-section:last-of-type {
    padding-bottom: 0;
  }

  .msg-idle-section h3 {
    margin: 0 0 2px;
    font-size: 14px;
    font-weight: 500;

  }

  }

  .msg-idle-controls button {
    padding: 0 14px;
    height: 32px;
    margin-left: auto;
    font-size: 13px;
    font-weight: 500;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    background: #fff;
    color: #111827;
    cursor: pointer;
    font-family: inherit;
  }

  .msg-idle-controls button:hover {

  }

  .msg-idle-controls button.danger {

  }

  .bl-fullscreen {
    display: none;

    inset: 0;

    background: #000;
    color: #e2e8f0;

  .bl-fullscreen .bl-fs-title {

    font-weight: 600;
  }

  .bl-fullscreen .bl-fs-msg {

    color: #94a3b8;
  }

  /* Toast notifications — bottom-right corner, stackable */
  .toast-container {
    position: fixed;
    bottom: 16px;
    right: 16px;
    z-index: 10001;
    display: flex;
    flex-direction: column-reverse;
    gap: 8px;
    max-height: 80vh;
    overflow-y: auto;
    pointer-events: none;
  }

  .toast {
    pointer-events: auto;
    background: #1e293b;
    color: #f1f5f9;
    border-radius: 8px;
    padding: 12px 16px;
    min-width: 280px;
    max-width: 380px;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
    font-family: -apple-system, "Segoe UI", sans-serif;
    cursor: pointer;
    position: relative;
    animation: toast-in 0.3s ease-out;
  }

  .toast.toast-out {
    animation: toast-out 0.3s ease-in forwards;
  }

  .toast h3 {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 3px;
    color: #fff;
  }

  .toast p {
    font-size: 12px;
    color: #94a3b8;
    margin: 0;
  }

  .toast-progress {
    position: absolute;
    bottom: 0;
    left: 0;
    height: 3px;
    background: #3b82f6;
    border-radius: 0 0 0 8px;
    transition: width linear;
  }

  @keyframes toast-in {
    from {
      opacity: 0;
      transform: translateX(40px);
    }

    to {
      opacity: 1;
      transform: translateX(0);
    }
  }

  @keyframes toast-out {
    from {
      opacity: 1;
      transform: translateX(0);
    }

    to {
      opacity: 0;
      transform: translateX(40px);
    }
  }

  /* Banner notifications — top-centered, non-blocking, explicit OK to dismiss.
     Lower z-index than modal/idle overlays so a modal still wins focus, but
     above the iframe so the banner stays visible while the user keeps working.
     Container is pointer-events:none so the iframe edges remain clickable;
     only the banner card itself accepts pointer events. */
  .banner-container {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: calc(100% - 32px);
    max-width: 480px;
    pointer-events: none;
  }

  .banner {
    pointer-events: auto;
    background: #fff;
    color: #111827;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    padding: 12px 14px;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18);
    font-family: -apple-system, "Segoe UI", sans-serif;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    animation: banner-in 0.25s ease-out;
  }

  .banner-content {
    flex: 1;
    min-width: 0;
  }

  .banner h3 {
    font-size: 13px;
    font-weight: 600;
    margin: 0 0 3px;
    color: #111827;
  }

  .banner p {
    font-size: 13px;
    color: #4b5563;
    margin: 0;
    word-wrap: break-word;
  }

  .banner-close {
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 5px 14px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    flex-shrink: 0;
  }

  .banner-close:hover {
    background: #1d4ed8;
  }

  .banner.banner-out {
    animation: banner-out 0.25s ease-in forwards;
  }

  @keyframes banner-in {
    from {
      opacity: 0;
      transform: translateY(-12px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes banner-out {
    from {
      opacity: 1;
      transform: translateY(0);
    }

    to {
      opacity: 0;
      transform: translateY(-12px);
    }
  }
</style>

<div class="msg-overlay" id="msg-overlay">
  <div class="msg-stack" id="msg-dialogs"></div>
</div>
<div class="msg-overlay" id="bl-idle-overlay" style="z-index:10001;">
  <div class="msg-stack" id="bl-idle-stack"></div>
</div>
<div class="toast-container" id="toast-container"></div>
<div class="banner-container" id="banner-container"></div>

<div class="bl-fullscreen" id="bl-fullscreen">
  <div class="bl-fs-icon">&#x2713;</div>
  <div class="bl-fs-title">Booth stopped</div>
  <div class="bl-fs-msg">The CodingBooth session has ended. You can close this tab.</div>
</div>

<div id="booth-lifecycle">
  <div class="bl-panel" id="bl-panel">
    <div class="bl-header" id="bl-drag-handle">
      <span>Booth</span>
      <button class="bl-collapse-btn" id="bl-toggle" title="Collapse">&#x25BC;</button>
    </div>
    <div class="bl-body" id="bl-body">
      <div class="bl-timer bl-timer-white" id="bl-run-time" data-priority="10" style="display:none"
        title="Total time this booth session has been running"></div>
      <div class="bl-timer bl-timer-green" id="bl-count-down" data-priority="20" style="display:none"
        title="Time remaining before the booth session ends"></div>
      <div class="bl-idle-chip bl-idle-chip-active" id="bl-idle-chip" data-priority="50"
        title="Idle shutdown is active — click to pause or disable"></div>
      <button class="bl-btn bl-btn-restart" id="bl-restart-btn" data-priority="90"
        title="Restart the booth container (re-reads config and rebuilds)">
        <span class="bl-btn-icon">&#x21BB;</span> Restart
      </button>
      <button class="bl-btn bl-btn-shutdown" id="bl-shutdown-btn" data-priority="100"
        title="Shut down and stop the booth container">
        <span class="bl-btn-icon">&#x23FB;</span> Shut Down
      </button>
    </div>
    <div class="bl-confirm" id="bl-confirm" style="display:none">
      <p id="bl-confirm-text"></p>
      <div class="bl-confirm-actions">
        <button class="bl-btn-yes" id="bl-confirm-yes"></button>
        <button class="bl-btn-cancel" id="bl-confirm-cancel">Cancel</button>
      </div>
    </div>
    <div class="bl-progress" id="bl-progress" style="display:none">
      <div class="bl-spinner"></div>
      <div id="bl-progress-text"></div>
    </div>
    <div class="bl-stopped" id="bl-stopped" style="display:none">
      <div style="font-size:24px;margin-bottom:6px;">&#x2713;</div>
      <div id="bl-stopped-text">Container stopped.</div>
    </div>
  </div>
</div>

<script>
  (function () {
    var overlay = document.getElementById("msg-overlay");
    var dialogs = document.getElementById("msg-dialogs");
    var toastContainer = document.getElementById("toast-container");
    var bannerContainer = document.getElementById("banner-container");
    var lastMsgIds = "";
    var activeToasts = {};  // id -> element, tracks toasts currently shown
    // id -> {el, titleEl, bodyEl, title, body} so reconciliation can patch
    // text in place instead of re-rendering (which would replay the entry
    // animation every poll and feel jittery).
    var activeBanners = {};

    // API base — override via window.BOOTH_MSG_API_BASE if needed
    var apiBase = window.BOOTH_MSG_API_BASE || "/booth-messages/api";

    function esc(s) {
      var d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }

    function getCookie(name) {
      var m = document.cookie.match(new RegExp("(?:^|; )" + name + "=([^;]*)"));
      return m ? decodeURIComponent(m[1]) : "";
    }

    function dismissToast(id, el) {
      if (!activeToasts[id]) return;
      delete activeToasts[id];
      el.classList.add("toast-out");
      // Respond so the API stops returning it
      respond(id, "dismissed");
      setTimeout(function () { el.remove(); }, 300);
    }

    function showToast(m) {
      if (activeToasts[m.id]) return;  // already visible

      var el = document.createElement("div");
      el.className = "toast";
      el.innerHTML = '<h3>' + esc(m.title) + '</h3><p>' + esc(m.body) + '</p>' +
        '<div class="toast-progress" data-id="' + m.id + '"></div>';
      el.onclick = function () { dismissToast(m.id, el); };

      toastContainer.appendChild(el);
      activeToasts[m.id] = el;

      // Calculate remaining duration from expires
      var durationMs = 30000;  // fallback 30s
      if (m.expires) {
        var remaining = new Date(m.expires).getTime() - Date.now();
        if (remaining > 0) durationMs = remaining;
      }

      // Animate progress bar
      var bar = el.querySelector(".toast-progress");
      bar.style.width = "100%";
      // Force reflow so the transition starts from 100%
      bar.offsetWidth;
      bar.style.transitionDuration = durationMs + "ms";
      bar.style.width = "0%";

      // Auto-dismiss when timer expires
      setTimeout(function () { dismissToast(m.id, el); }, durationMs);
    }

    function dismissBanner(id, el) {
      if (!activeBanners[id]) return;
      delete activeBanners[id];
      el.classList.add("banner-out");
      respond(id, "ok");
      setTimeout(function () { el.remove(); }, 250);
    }

    // Reconciles a banner message with the DOM. New id → create element;
    // existing id with changed title/body → patch in place; unchanged → no-op.
    // Removal happens in pollMessages once the id leaves the /list response.
    function syncBanner(m) {
      var existing = activeBanners[m.id];
      var nextTitle = m.title || "";
      var nextBody = m.body || "";
      if (existing) {
        if (existing.title !== nextTitle) {
          existing.titleEl.textContent = nextTitle;
          existing.title = nextTitle;
        }
        if (existing.body !== nextBody) {
          existing.bodyEl.textContent = nextBody;
          existing.body = nextBody;
        }
        return;
      }
      var el = document.createElement("div");
      el.className = "banner";
      el.innerHTML =
        '<div class="banner-content"><h3></h3><p></p></div>' +
        '<button class="banner-close" type="button">OK</button>';
      var titleEl = el.querySelector("h3");
      var bodyEl = el.querySelector("p");
      titleEl.textContent = nextTitle;
      bodyEl.textContent = nextBody;
      el.querySelector(".banner-close").onclick = function () {
        dismissBanner(m.id, el);
      };
      bannerContainer.appendChild(el);
      activeBanners[m.id] = {
        el: el, titleEl: titleEl, bodyEl: bodyEl,
        title: nextTitle, body: nextBody
      };
    }

    // Drop banners whose backing message file is gone (host-side cancel,
    // adjust-then-respond, or another client posted /respond first).
    function reapBanners(seenIds) {
      Object.keys(activeBanners).forEach(function (id) {
        if (seenIds[id]) return;
        var entry = activeBanners[id];
        delete activeBanners[id];
        if (!entry || !entry.el) return;
        entry.el.classList.add("banner-out");
        setTimeout(function () { entry.el.remove(); }, 250);
      });
    }

    function respond(id, answer) {
      var headers = { "Content-Type": "application/json" };
      var xsrf = getCookie("_xsrf");
      if (xsrf) headers["X-XSRFToken"] = xsrf;
      fetch(apiBase + "/respond/" + id, {
        method: "POST",
        headers: headers,
        body: JSON.stringify({ answer: answer })
      });
    }

    // Render the "Still there?" idle timeout as a sectioned dialog that mirrors
    // the chip-click dialog, with a live-counting shutdown-in-N-seconds label.
    function renderIdlePromptDialog(m) {
      var pauseInputId = "idle-prompt-pause-" + m.id;
      var timeoutInputId = "idle-prompt-timeout-" + m.id;
      var pauseSubmit =
        "(function(){var v=parseInt(document.getElementById('" + pauseInputId + "').value,10);" +
        "if(v>0) window._msgRespond('" + m.id + "','pause:'+(v*60));})()";
      var setTimeSubmit =
        "(function(){var v=parseInt(document.getElementById('" + timeoutInputId + "').value,10);" +
        "if(v>0) window._idleSetTime(v*60," + JSON.stringify(m.id) + ");})()";

      // Current base idle time in minutes, for the Change-the-timeout input.
      var baseSec = parseInt(window.BOOTH_IDLE_TIME || "0", 10) || 0;
      var baseMin = Math.max(1, Math.round(baseSec / 60));

      var expiresMs = m.expires ? Date.parse(m.expires) : Date.now();
      var initialSec = Math.max(0, Math.ceil((expiresMs - Date.now()) / 1000));
      var initialLabel = initialSec + " second" + (initialSec === 1 ? "" : "s");

      return '<div class="msg-idle-dialog">' +
        '<h2>' + esc(m.title || "Still using this booth?") + '</h2>' +
        '<p>This booth will shut down in ' +
        '<strong data-idle-countdown-ms="' + expiresMs + '">' + initialLabel + '</strong>' +
        ' if you do not respond.</p>' +

        // Section 1: I'm here (primary acknowledge)
        '<div class="msg-idle-section">' +
        '<h3>I&rsquo;m still here</h3>' +
        '<p>Reset the timer and keep watching for inactivity.</p>' +
        '<div class="msg-idle-controls">' +
        '<button onclick="window._msgRespond(\'' + m.id + '\',\'ok\')">I&rsquo;m here</button>' +
        '</div>' +
        '</div>' +

        // Section 2: Pause (time-boxed)
        '<div class="msg-idle-section">' +
        '<h3>Hold off for a while</h3>' +
        '<p>Running a long build, or stepping away for coffee? Pause the idle timeout for a while.</p>' +
        '<form class="msg-idle-controls" onsubmit="' + pauseSubmit + ';return false;">' +
        '<input id="' + pauseInputId + '" type="number" min="1" max="10080" value="60">' +
        '<span style="font-size:13px;color:#6b7280;">minutes</span>' +
        '<button type="submit">Pause</button>' +
        '</form>' +
        '</div>' +

        // Section 3: Change the base timeout for this session.
        '<div class="msg-idle-section">' +
        '<h3>Change the timeout</h3>' +
        '<p>Use a different inactivity threshold for this booth. Reverts on restart.</p>' +
        '<form class="msg-idle-controls" onsubmit="' + setTimeSubmit + ';return false;">' +
        '<input id="' + timeoutInputId + '" type="number" min="1" max="10080" value="' + baseMin + '">' +
        '<span style="font-size:13px;color:#6b7280;">minutes</span>' +
        '<button type="submit">Apply</button>' +
        '</form>' +
        '</div>' +

        // Section 4: Disable
        '<div class="msg-idle-section">' +
        '<h3 class="danger">Turn it off entirely</h3>' +
        "<p>Cost isn&rsquo;t a concern for this booth. You&rsquo;ll lose the safety net against runaway charges.</p>" +
        '<div class="msg-idle-controls">' +
        '<button class="danger" onclick="window._msgRespond(\'' + m.id + '\',\'disable\')">Disable idle shutdown</button>' +
        '</div>' +
        '</div>' +

        '</div>';
    }

    // Update any countdown <strong data-idle-countdown-ms="N"> elements.
    function tickCountdowns() {
      var now = Date.now();
      var nodes = document.querySelectorAll("[data-idle-countdown-ms]");
      for (var i = 0; i < nodes.length; i++) {
        var el = nodes[i];
        var expMs = parseInt(el.getAttribute("data-idle-countdown-ms"), 10);
        if (!expMs) continue;
        var remSec = Math.max(0, Math.ceil((expMs - now) / 1000));
        el.textContent = remSec + " second" + (remSec === 1 ? "" : "s");
      }
    }

    function pollMessages() {
      fetch(apiBase + "/list").then(function (resp) {
        if (!resp.ok) return;
        pollFails = 0;
        checkConnectionLost();
        return resp.json();
      }).then(function (msgs) {
        if (!msgs) return;

        // Separate toasts and banners from modal interactive messages.
        var interactive = [];
        var seenBannerIds = {};
        msgs.forEach(function (m) {
          if (m.type === "toast") {
            showToast(m);
          } else if (m.type === "banner") {
            seenBannerIds[m.id] = true;
            syncBanner(m);
          } else {
            interactive.push(m);
          }
        });
        reapBanners(seenBannerIds);

        if (!interactive.length) {
          // Don't clear if a countdown warning dialog is showing
          if (!dialogs.querySelector("[id^='bl-warn-']")) {
            overlay.classList.remove("visible");
            document.body.classList.remove("msg-active");
            dialogs.innerHTML = "";
          }
          lastMsgIds = "";
          return;
        }
        var ids = interactive.map(function (m) { return m.id; }).join(",");
        if (ids === lastMsgIds) return;
        lastMsgIds = ids;

        overlay.classList.add("visible");
        document.body.classList.add("msg-active");
        dialogs.innerHTML = interactive.map(function (m) {
          if (m.type === "idle-prompt") return renderIdlePromptDialog(m);
          var h = '<div class="msg-dialog"><h2>' + esc(m.title) + '</h2><p>' + esc(m.body) + '</p>';
          if (m.type === "text") {
            h += '<form class="msg-actions" onsubmit="window._msgRespond(\'' + m.id + '\', this.answer.value); return false;">' +
              '<input type="text" name="answer" class="msg-input" placeholder="Type response...">' +
              '<button type="submit" class="msg-btn msg-btn-submit">Send</button></form>';
          } else if (m.type === "password") {
            h += '<form class="msg-actions" onsubmit="window._msgRespond(\'' + m.id + '\', this.answer.value); return false;">' +
              '<input type="password" name="answer" class="msg-input" placeholder="Enter password...">' +
              '<button type="submit" class="msg-btn msg-btn-submit">Send</button></form>';
          } else if (m.type === "ok") {
            h += '<div class="msg-actions">' +
              '<button class="msg-btn msg-btn-yes" onclick="window._msgRespond(\'' + m.id + '\',\'ok\')">OK</button></div>';
          } else if (m.type === "choice" && m.options) {
            h += '<div class="msg-actions" style="flex-wrap:wrap;">';
            m.options.forEach(function (opt) {
              h += '<button class="msg-btn msg-btn-no" onclick="window._msgRespond(\'' + m.id + '\',\'' + esc(opt) + '\')">' + esc(opt) + '</button>';
            });
            h += '</div>';
          } else if (m.type === "choice-text" && m.options) {
            h += '<div style="display:flex;flex-direction:column;gap:6px;margin-bottom:10px;">';
            m.options.forEach(function (opt) {
              h += '<button class="msg-btn msg-btn-no" style="width:100%;text-align:left;" onclick="window._msgRespond(\'' + m.id + '\',\'' + esc(opt) + '\')">' + esc(opt) + '</button>';
            });
            h += '</div>';
            h += '<form class="msg-actions" onsubmit="window._msgRespond(\'' + m.id + '\', this.answer.value); return false;">' +
              '<input type="text" name="answer" class="msg-input" placeholder="Or type your own...">' +
              '<button type="submit" class="msg-btn msg-btn-submit">Send</button></form>';
          } else if (m.type === "radio" && m.options) {
            h += '<form onsubmit="var r=this.querySelector(\'input[name=radio]:checked\'); if(r) window._msgRespond(\'' + m.id + '\',r.value); return false;">';
            h += '<div class="msg-options-list">';
            m.options.forEach(function (opt, i) {
              h += '<label><input type="radio" name="radio" value="' + esc(opt) + '"' + (i === 0 ? ' checked' : '') + '>' + esc(opt) + '</label>';
            });
            h += '</div>';
            h += '<div class="msg-actions"><button type="submit" class="msg-btn msg-btn-yes">Submit</button></div></form>';
          } else if (m.type === "checkbox" && m.options) {
            h += '<form onsubmit="var c=[].slice.call(this.querySelectorAll(\'input[name=chk]:checked\')).map(function(e){return e.value}).join(\',\'); window._msgRespond(\'' + m.id + '\',c||\'none\'); return false;">';
            h += '<div class="msg-options-list">';
            m.options.forEach(function (opt) {
              h += '<label><input type="checkbox" name="chk" value="' + esc(opt) + '">' + esc(opt) + '</label>';
            });
            h += '</div>';
            h += '<div class="msg-actions"><button type="submit" class="msg-btn msg-btn-yes">Submit</button></div></form>';
          } else if (m.type === "yes-no-cancel") {
            h += '<div class="msg-actions">' +
              '<button class="msg-btn msg-btn-yes" onclick="window._msgRespond(\'' + m.id + '\',\'yes\')">Yes</button>' +
              '<button class="msg-btn msg-btn-no" onclick="window._msgRespond(\'' + m.id + '\',\'no\')">No</button>' +
              '<button class="msg-btn msg-btn-no" onclick="window._msgRespond(\'' + m.id + '\',\'cancel\')">Cancel</button></div>';
          } else {
            h += '<div class="msg-actions">' +
              '<button class="msg-btn msg-btn-yes" onclick="window._msgRespond(\'' + m.id + '\',\'yes\')">Yes</button>' +
              '<button class="msg-btn msg-btn-no" onclick="window._msgRespond(\'' + m.id + '\',\'no\')">No</button></div>';
          }
          return h + '</div>';
        }).join("");
      }).catch(function () { pollFails++; checkConnectionLost(); });
    }

    // Detect container shutdown (e.g. idle timeout) by consecutive poll failures.
    // Threshold > 1 so a single transient blip (network, API restart, malformed
    // response) doesn't lock the UI; recovery hides the overlay if polls resume.
    // data-poll marker scopes the hide so we don't undo a deliberately-shown
    // fullscreen (e.g. user-confirmed shutdown, BoothPanel.showStopped).
    var pollFails = 0;
    function checkConnectionLost() {
      var fs = document.getElementById("bl-fullscreen");
      if (!fs) return;
      if (pollFails >= 3) {
        fs.classList.add("visible");
        fs.dataset.pollDriven = "1";
      } else if (pollFails === 0 && fs.dataset.pollDriven === "1") {
        fs.classList.remove("visible");
        delete fs.dataset.pollDriven;
      }
    }

    window._msgRespond = function (id, answer) {
      respond(id, answer);
      setTimeout(pollMessages, 100);
      // If this was an idle prompt, refresh the chip so the user sees pause/extend reflected.
      if (typeof id === "string" && id.indexOf("idle-") === 0 && window._boothIdleRefresh) {
        setTimeout(window._boothIdleRefresh, 300);
      }
    };

    // Used by the idle-prompt's "Change the timeout" form. Applies the new
    // base, then acknowledges the prompt so the pending shutdown is cancelled.
    window._idleSetTime = function (seconds, promptId) {
      var headers = { "Content-Type": "application/json" };
      var xsrf = getCookie("_xsrf");
      if (xsrf) headers["X-XSRFToken"] = xsrf;
      fetch(apiBase + "/idle/set-time", {
        method: "POST",
        headers: headers,
        body: JSON.stringify({ seconds: seconds })
      }).then(function () {
        window._msgRespond(promptId, "ok");
      }).catch(function () { });
    };

    // Reclaim focus from iframes when overlay is visible
    overlay.addEventListener("click", function () {
      var input = overlay.querySelector(".msg-input");
      if (input) input.focus();
    });
    window.addEventListener("blur", function () {
      if (overlay.classList.contains("visible")) {
        setTimeout(function () {
          var input = overlay.querySelector(".msg-input");
          if (input) input.focus();
        }, 50);
      }
    });

    pollMessages();
    setInterval(pollMessages, 2000);
    setInterval(tickCountdowns, 1000);
  })();

  // Lifecycle panel — draggable restart/shutdown
  (function () {
    var panel = document.getElementById("bl-panel");
    var container = document.getElementById("booth-lifecycle");
    var handle = document.getElementById("bl-drag-handle");
    var toggle = document.getElementById("bl-toggle");
    var body = document.getElementById("bl-body");
    var confirm = document.getElementById("bl-confirm");
    var confirmTxt = document.getElementById("bl-confirm-text");
    var confirmYes = document.getElementById("bl-confirm-yes");
    var confirmNo = document.getElementById("bl-confirm-cancel");
    var progress = document.getElementById("bl-progress");
    var progressTxt = document.getElementById("bl-progress-text");
    var stopped = document.getElementById("bl-stopped");
    var stoppedTxt = document.getElementById("bl-stopped-text");

    var fullscreen = document.getElementById("bl-fullscreen");

    var apiBase = window.BOOTH_MSG_API_BASE || "/booth-messages/api";
    var pendingAction = null;   // "shutdown" or "restart" (built-in)
    var pendingConfirm = null;  // {text, yesLabel, yesVariant, progressText, onConfirm} from BoothPanel.confirm()

    // --- Collapse / Expand ---
    var collapsed = localStorage.getItem("booth-lc-collapsed") === "true";
    function applyCollapsed() {
      body.classList.toggle("collapsed", collapsed);
      panel.classList.toggle("collapsed", collapsed);
      toggle.innerHTML = collapsed ? "&#x25B2;" : "&#x25BC;";
      toggle.title = collapsed ? "Expand" : "Collapse";
    }
    applyCollapsed();
    toggle.addEventListener("click", function (e) {
      e.stopPropagation();
      collapsed = !collapsed;
      localStorage.setItem("booth-lc-collapsed", collapsed);
      applyCollapsed();
    });

    // --- Drag ---
    var dragState = { active: false, startX: 0, startY: 0 };

    // Clamp current (x, y) to keep the panel fully in the viewport.
    // Works whether reading from rect.left or from saved localStorage.
    function clampPos(x, y) {
      var maxX = Math.max(0, window.innerWidth - panel.offsetWidth);
      var maxY = Math.max(0, window.innerHeight - panel.offsetHeight);
      return {
        x: Math.max(0, Math.min(x, maxX)),
        y: Math.max(0, Math.min(y, maxY))
      };
    }

    // Apply the saved position (if any), then re-clamp to the current viewport
    // so a shrunk window or stale localStorage can't leave the panel off-screen.
    function applyClampedPosition() {
      var pos = JSON.parse(localStorage.getItem("booth-lc-pos") || "null");
      var rect = container.getBoundingClientRect();
      var src = pos || { x: rect.left, y: rect.top };
      var c = clampPos(src.x, src.y);
      container.style.left = c.x + "px";
      container.style.bottom = "auto";
      container.style.top = c.y + "px";
      localStorage.setItem("booth-lc-pos", JSON.stringify(c));
    }

    // Wait for layout before measuring offsetWidth/offsetHeight.
    requestAnimationFrame(applyClampedPosition);
    window.addEventListener("resize", applyClampedPosition);

    handle.addEventListener("pointerdown", function (e) {
      if (e.target === toggle) return;
      dragState.active = true;
      var rect = container.getBoundingClientRect();
      dragState.startX = e.clientX - rect.left;
      dragState.startY = e.clientY - rect.top;
      handle.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    handle.addEventListener("pointermove", function (e) {
      if (!dragState.active) return;
      var c = clampPos(e.clientX - dragState.startX, e.clientY - dragState.startY);
      container.style.left = c.x + "px";
      container.style.bottom = "auto";
      container.style.top = c.y + "px";
      localStorage.setItem("booth-lc-pos", JSON.stringify(c));
    });
    handle.addEventListener("pointerup", function () { dragState.active = false; });
    handle.addEventListener("pointercancel", function () { dragState.active = false; });

    // --- Actions ---
    function showState(state) {
      body.style.display = state === "buttons" ? "" : "none";
      confirm.style.display = state === "confirm" ? "" : "none";
      progress.style.display = state === "progress" ? "" : "none";
      stopped.style.display = state === "stopped" ? "" : "none";
      // Ensure body section visibility follows collapse state only in buttons mode
      if (state === "buttons") applyCollapsed();
    }

    document.getElementById("bl-shutdown-btn").addEventListener("click", function () {
      pendingAction = "shutdown";
      confirmTxt.textContent = "Shut down this Booth?";
      confirmYes.textContent = "Shut Down";
      confirmYes.className = "bl-btn-yes shutdown";
      showState("confirm");
    });

    document.getElementById("bl-restart-btn").addEventListener("click", function () {
      pendingAction = "restart";
      confirmTxt.textContent = "Restart this Booth?";
      confirmYes.textContent = "Restart";
      confirmYes.className = "bl-btn-yes restart";
      showState("confirm");
    });

    confirmNo.addEventListener("click", function () {
      pendingAction = null;
      pendingConfirm = null;
      showState("buttons");
    });

    confirmYes.addEventListener("click", function () {
      // Plugin-initiated confirm (BoothPanel.confirm) takes precedence over the
      // built-in shutdown/restart flow when set.
      if (pendingConfirm) {
        var c = pendingConfirm;
        pendingConfirm = null;
        if (c.progressText) {
          progressTxt.textContent = c.progressText;
          showState("progress");
        }
        try {
          if (typeof c.onConfirm === "function") c.onConfirm(panelApi);
        } catch (e) { console.error("[BoothPanel.confirm] onConfirm failed:", e); }
        return;
      }

      var action = pendingAction;
      if (!action) return;
      progressTxt.textContent = action === "shutdown" ? "Shutting down\u2026" : "Restarting\u2026";
      showState("progress");

      fetch(apiBase + "/" + action, { method: "POST" }).then(function () {
        if (action === "shutdown") {
          fullscreen.classList.add("visible");
        } else {
          // Poll until server is fully ready (require consecutive successes
          // so the inner service has time to start, not just nginx)
          var readyCount = 0;
          var poll = setInterval(function () {
            fetch("/booth", { method: "HEAD", cache: "no-store" }).then(function (r) {
              if (r.ok) {
                readyCount++;
                if (readyCount >= 3) {
                  clearInterval(poll);
                  location.reload();
                }
              } else {
                readyCount = 0;
              }
            }).catch(function () { readyCount = 0; });
          }, 2000);
        }
      }).catch(function () {
        // Connection lost — likely shutdown in progress
        if (action === "shutdown") {
          fullscreen.classList.add("visible");
        }
      });
    });

    // --- BoothPanel: a tiny registry so variants and users can drop in more
    // buttons / chips / timers without editing overlay.html. Built-in items
    // keep their own HTML + click handlers; registered items get appended to
    // #bl-body and the body is sorted by data-priority. Lower number = higher
    // up the panel (built-ins: run-time=10, countdown=20, idle=50, restart=90,
    // shutdown=100). Plugins typically pick a gap between these to position.
    var registered = {};
    function sortBody() {
      var items = Array.prototype.slice.call(body.children);
      items.sort(function (a, b) {
        var pa = parseInt(a.getAttribute("data-priority") || "50", 10);
        var pb = parseInt(b.getAttribute("data-priority") || "50", 10);
        return pa - pb;
      });
      items.forEach(function (el) { body.appendChild(el); });
    }
    sortBody();

    var panelApi = {
      // Drop a new element into #bl-body at a given priority and wire it up.
      register: function (def) {
        if (!def || !def.id) return null;
        if (!def.html && !def.element) {
          console.warn("[BoothPanel.register] needs { id, html | element } —", def.id);
          return null;
        }
        if (registered[def.id]) {
          registered[def.id].remove();
          delete registered[def.id];
        }
        var el;
        if (def.element) {
          el = def.element;
        } else {
          var w = document.createElement("div");
          w.innerHTML = String(def.html).trim();
          el = w.firstElementChild;
        }
        if (!el) return null;
        el.setAttribute("data-booth-plugin-id", def.id);
        if (def.priority != null) el.setAttribute("data-priority", String(def.priority));
        else if (!el.hasAttribute("data-priority")) el.setAttribute("data-priority", "50");
        body.appendChild(el);
        sortBody();
        registered[def.id] = el;
        if (typeof def.onMount === "function") {
          try { def.onMount(el, panelApi); }
          catch (e) { console.error("[BoothPanel]", def.id, "onMount:", e); }
        }
        return el;
      },
      // Remove a previously-registered plugin by id. Returns true on removal.
      unregister: function (id) {
        var el = registered[id];
        if (!el) return false;
        el.remove();
        delete registered[id];
        return true;
      },
      // Plugin-initiated confirm dialog; reuses the built-in confirm DOM.
      confirm: function (opts) {
        pendingAction = null;  // take over from any in-flight built-in confirm
        pendingConfirm = opts || {};
        confirmTxt.textContent = (opts && opts.text) || "Confirm?";
        confirmYes.textContent = (opts && opts.yesLabel) || "Yes";
        confirmYes.className = "bl-btn-yes" +
          (opts && opts.yesVariant ? " " + opts.yesVariant : "");
        showState("confirm");
      },
      showProgress: function (text) {
        if (text) progressTxt.textContent = text;
        showState("progress");
      },
      showStopped: function (text) {
        if (text) stoppedTxt.textContent = text;
        showState("stopped");
        fullscreen.classList.add("visible");
      },
      // Expose the API base so plugins don't need to guess.
      apiBase: apiBase
    };
    window.BoothPanel = panelApi;
    // Fire a DOM event so plugin <script>s loaded after this point know when
    // the registry is available. Plugins can alternatively guard on
    // `if (window.BoothPanel) { ... }`.
    document.dispatchEvent(new Event("booth-panel-ready"));

    // --- Timers ---
    var runTimeEl = document.getElementById("bl-run-time");
    var countDownEl = document.getElementById("bl-count-down");
    var showRunTime = (window.BOOTH_SHOW_RUN_TIME || "").trim();
    var showCountDown = (window.BOOTH_SHOW_COUNT_DOWN || "").trim();

    function fmtTime(totalSec) {
      var s = Math.abs(Math.floor(totalSec));
      var h = Math.floor(s / 3600);
      var m = Math.floor((s % 3600) / 60);
      var sec = s % 60;
      var pad = function (n) { return n < 10 ? "0" + n : "" + n; };
      return h > 0 ? h + ":" + pad(m) + ":" + pad(sec) : pad(m) + ":" + pad(sec);
    }

    // Run time (count up)
    if (showRunTime) {
      var startEpoch = showRunTime === "now"
        ? Math.floor(Date.now() / 1000)
        : parseInt(showRunTime, 10);
      if (!isNaN(startEpoch)) {
        runTimeEl.style.display = "";
        setInterval(function () {
          var elapsed = Math.floor(Date.now() / 1000) - startEpoch;
          if (elapsed < 0) elapsed = 0;
          runTimeEl.textContent = fmtTime(elapsed);
        }, 1000);
      }
    }

    // Countdown
    if (showCountDown) {
      var endEpoch = parseInt(showCountDown, 10);
      if (!isNaN(endEpoch)) {
        countDownEl.style.display = "";
        var countdownExpired = false;
        var warnShown = {};
        var initialRemaining = endEpoch - Math.floor(Date.now() / 1000);

        function showCountdownWarning(id, threshold, title, body, autoDismissSec) {
          // Skip if the session started with less time than this threshold
          if (initialRemaining <= threshold) return;
          if (warnShown[id]) return;
          warnShown[id] = true;
          var warnId = "bl-warn-" + id;
          var overlay = document.getElementById("msg-overlay");
          var dialogs = document.getElementById("msg-dialogs");
          var dismissFn = "document.getElementById('" + warnId + "').remove();" +
            "var d=document.getElementById('msg-dialogs');" +
            "if(!d.children.length){document.getElementById('msg-overlay').classList.remove('visible');" +
            "document.body.classList.remove('msg-active');}";
          var h = '<div class="msg-dialog"><h2>' + title + '</h2>' +
            '<p>' + body + '</p>' +
            '<div class="msg-actions">' +
            '<button class="msg-btn msg-btn-yes" onclick="' + dismissFn + '">OK</button></div></div>';
          var wrapper = document.createElement("div");
          wrapper.id = warnId;
          wrapper.innerHTML = h;
          dialogs.appendChild(wrapper);
          overlay.classList.add("visible");
          document.body.classList.add("msg-active");
          if (autoDismissSec) {
            setTimeout(function () {
              var el = document.getElementById(warnId);
              if (el) { eval(dismissFn); }
            }, autoDismissSec * 1000);
          }
        }

        setInterval(function () {
          var remaining = endEpoch - Math.floor(Date.now() / 1000);
          if (remaining <= 0 && !countdownExpired) {
            countdownExpired = true;
            countDownEl.textContent = "TIME'S UP";
            countDownEl.className = "bl-timer bl-timer-red flash";
            // Force expand if collapsed
            if (collapsed) {
              collapsed = false;
              localStorage.setItem("booth-lc-collapsed", false);
              applyCollapsed();
            }
            // Auto-shutdown with countdown exit code
            fetch(apiBase + "/countdown-shutdown", { method: "POST" }).catch(function () { });
            return;
          }
          if (countdownExpired) return;
          countDownEl.textContent = fmtTime(remaining);
          // Warning dialogs at thresholds
          if (remaining <= 900) {
            showCountdownWarning("15min", 900, "15 Minutes Remaining",
              "This booth session will end in approximately 15 minutes.", 60);
          }
          if (remaining <= 600) {
            showCountdownWarning("10min", 600, "10 Minutes Remaining",
              "This booth session will end in approximately 10 minutes. Please save your work.", 0);
          }
          if (remaining <= 300) {
            showCountdownWarning("5min", 300, "5 Minutes Remaining",
              "This booth session will end in approximately 5 minutes. Please save your work.", 0);
          }
          // Color thresholds
          var cls = "bl-timer ";
          if (remaining > 900) cls += "bl-timer-green";
          else if (remaining > 600) cls += "bl-timer-yellow";
          else if (remaining > 300) cls += "bl-timer-orange";
          else cls += "bl-timer-red";
          countDownEl.className = cls;
        }, 1000);
      }
    }
  })();

  // Idle-monitor status chip + pause/disable control dialog
  (function () {
    var chipEl = document.getElementById("bl-idle-chip");
    var idleOverlay = document.getElementById("bl-idle-overlay");
    var idleStack = document.getElementById("bl-idle-stack");
    var apiBase = window.BOOTH_MSG_API_BASE || "/booth-messages/api";

    var baseIdleSec = parseInt(window.BOOTH_IDLE_TIME || "0", 10) || 0;
    if (!baseIdleSec) return;  // idle monitoring not armed for this booth

    var state = { disabled: false, pause_until: 0 };

    function fmtDuration(secs) {
      if (secs <= 0) return "0m";
      var h = Math.floor(secs / 3600);
      var m = Math.round((secs % 3600) / 60);
      if (h > 0 && m > 0) return h + "h " + m + "m";
      if (h > 0) return h + "h";
      if (m > 0) return m + "m";
      return "<1m";
    }

    function renderChip() {
      chipEl.classList.remove("bl-idle-chip-active", "bl-idle-chip-pause", "bl-idle-chip-disable");
      chipEl.classList.add("visible");
      if (state.disabled) {
        chipEl.classList.add("bl-idle-chip-disable");
        chipEl.innerHTML = "&#x23F1; Idle: DISABLED";
        chipEl.title = "Idle monitoring is disabled — click to resume normal cadence";
        return;
      }
      if (state.pause_until) {
        var remaining = state.pause_until - Math.floor(Date.now() / 1000);
        if (remaining > 0) {
          chipEl.classList.add("bl-idle-chip-pause");
          chipEl.innerHTML = "&#x23F1; Idle: PAUSE " + fmtDuration(remaining);
          chipEl.title = "Idle paused (time-boxed) — click to change";
          return;
        }
        state.pause_until = 0;  // fell through the pause window
      }
      chipEl.classList.add("bl-idle-chip-active");
      chipEl.innerHTML = "&#x23F1; Idle: " + fmtDuration(baseIdleSec);
      chipEl.title = "Idle shutdown after " + fmtDuration(baseIdleSec) + " inactivity — click to pause or disable";
    }

    function fetchState() {
      fetch(apiBase + "/idle/state").then(function (r) {
        return r.ok ? r.json() : null;
      }).then(function (s) {
        if (!s || !s.enabled) {
          chipEl.classList.remove("visible");
          return;
        }
        state.disabled = !!s.disabled;
        state.pause_until = parseInt(s.pause_until || 0, 10) || 0;
        // Effective base idle time (reflects any runtime override from /idle/set-time).
        // Also republish on window so the idle-prompt renderer (in another IIFE)
        // picks up the same value — otherwise one dialog could show a stale default.
        var effective = parseInt(s.idle_time || 0, 10);
        if (effective > 0) {
          baseIdleSec = effective;
          window.BOOTH_IDLE_TIME = String(effective);
        }
        renderChip();
      }).catch(function () { });
    }

    function closeDialog() {
      idleStack.innerHTML = "";
      idleOverlay.classList.remove("visible");
      // Only drop msg-active if no other message overlay is currently showing.
      var mo = document.getElementById("msg-overlay");
      if (!mo || !mo.classList.contains("visible")) {
        document.body.classList.remove("msg-active");
      }
    }

    function postJson(path, body) {
      var opts = { method: "POST", headers: { "Content-Type": "application/json" } };
      if (body) opts.body = JSON.stringify(body);
      return fetch(apiBase + path, opts);
    }

    function esc(s) {
      var d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }

    // Spell duration out in full words for the dialog body copy.
    function fmtLongDuration(secs) {
      if (secs <= 0) return "0 minutes";
      var h = Math.floor(secs / 3600);
      var m = Math.round((secs % 3600) / 60);
      var parts = [];
      if (h > 0) parts.push(h + (h === 1 ? " hour" : " hours"));
      if (m > 0) parts.push(m + (m === 1 ? " minute" : " minutes"));
      if (parts.length === 0) return "less than a minute";
      return parts.join(" ");
    }

    function openDialog() {
      var baseLong = fmtLongDuration(baseIdleSec);   // "2 minutes"
      var baseShort = fmtDuration(baseIdleSec);      // "2m"

      var descHtml;
      var inHold = state.disabled || state.pause_until;
      if (state.disabled) {
        descHtml = "Idle monitoring is currently <strong>disabled</strong>. " +
          "No shutdown checks run until you resume or the booth restarts.";
      } else if (state.pause_until) {
        var remaining = Math.max(0, state.pause_until - Math.floor(Date.now() / 1000));
        descHtml = "Idle shutdown is <strong>paused</strong> for " +
          esc(fmtDuration(remaining)) + ". Normal " + esc(baseShort) +
          " cadence resumes automatically after.";
      } else {
        descHtml = "This booth shuts down after <strong>" + esc(baseLong) +
          "</strong> of keyboard or mouse inactivity, so an idle run doesn't rack up unexpected costs.";
      }

      var pauseId = "bl-idle-dialog-pause-input";
      var timeoutId = "bl-idle-dialog-timeout-input";
      var baseMin = Math.max(1, Math.round(baseIdleSec / 60));

      var pauseCopy = inHold
        ? "Replace the current hold with a new time-boxed pause."
        : "Running a long build, or stepping away for coffee? Pause the idle timeout for a while.";

      var closeCopy = inHold
        ? "Close this without changing the current hold."
        : "Close this and let the " + esc(baseShort) + " timer keep watching.";

      // Section 1: Close (primary "dismiss and carry on")
      var h = '<div class="msg-idle-dialog">' +
        '<h2>Idle shutdown</h2>' +
        '<p>' + descHtml + '</p>' +

        '<div class="msg-idle-section">' +
        '<h3>Got it, carry on</h3>' +
        '<p>' + closeCopy + '</p>' +
        '<div class="msg-idle-controls">' +
        '<button data-action="close">Close</button>' +
        '</div>' +
        '</div>' +

        // Section 2: Pause (time-boxed)
        '<div class="msg-idle-section">' +
        '<h3>Hold off for a while</h3>' +
        '<p>' + pauseCopy + '</p>' +
        '<form class="msg-idle-controls" data-form="pause">' +
        '<input id="' + pauseId + '" type="number" min="1" max="10080" value="60">' +
        '<span style="font-size:13px;color:#6b7280;">minutes</span>' +
        '<button type="submit">Pause</button>' +
        '</form>' +
        '</div>' +

        // Section 3: Change the base idle timeout for this session.
        '<div class="msg-idle-section">' +
        '<h3>Change the timeout</h3>' +
        '<p>Use a different inactivity threshold for this booth. Reverts on restart.</p>' +
        '<form class="msg-idle-controls" data-form="set-time">' +
        '<input id="' + timeoutId + '" type="number" min="1" max="10080" value="' + baseMin + '">' +
        '<span style="font-size:13px;color:#6b7280;">minutes</span>' +
        '<button type="submit">Apply</button>' +
        '</form>' +
        '</div>';

      // Section 4: Disable (normal state) OR Resume (when already held)
      if (inHold) {
        h += '<div class="msg-idle-section">' +
          '<h3>Back to normal</h3>' +
          '<p>Resume the regular ' + esc(baseLong) + ' idle shutdown checks.</p>' +
          '<div class="msg-idle-controls">' +
          '<button data-action="resume">Resume normal idle</button>' +
          '</div>' +
          '</div>';
      } else {
        h += '<div class="msg-idle-section">' +
          '<h3 class="danger">Turn it off entirely</h3>' +
          "<p>Cost isn&rsquo;t a concern for this booth. You&rsquo;ll lose the safety net against runaway charges.</p>" +
          '<div class="msg-idle-controls">' +
          '<button class="danger" data-action="disable">Disable idle shutdown</button>' +
          '</div>' +
          '</div>';
      }

      h += '</div>';

      idleStack.innerHTML = h;
      idleOverlay.classList.add("visible");
      document.body.classList.add("msg-active");

      var dialog = idleStack.querySelector(".msg-idle-dialog");

      dialog.querySelector('[data-form="pause"]').addEventListener("submit", function (e) {
        e.preventDefault();
        var mins = parseInt(document.getElementById(pauseId).value, 10);
        if (!mins || mins <= 0) return;
        postJson("/idle/pause", { seconds: mins * 60 }).then(function () {
          closeDialog();
          fetchState();
        });
      });

      dialog.querySelector('[data-form="set-time"]').addEventListener("submit", function (e) {
        e.preventDefault();
        var mins = parseInt(document.getElementById(timeoutId).value, 10);
        if (!mins || mins <= 0) return;
        postJson("/idle/set-time", { seconds: mins * 60 }).then(function () {
          closeDialog();
          fetchState();
        });
      });

      var disableBtn = dialog.querySelector('[data-action="disable"]');
      if (disableBtn) {
        disableBtn.addEventListener("click", function () {
          postJson("/idle/disable").then(function () { closeDialog(); fetchState(); });
        });
      }

      var resumeBtn = dialog.querySelector('[data-action="resume"]');
      if (resumeBtn) {
        resumeBtn.addEventListener("click", function () {
          postJson("/idle/resume").then(function () { closeDialog(); fetchState(); });
        });
      }

      dialog.querySelector('[data-action="close"]').addEventListener("click", closeDialog);
    }

    idleOverlay.addEventListener("click", function (e) {
      if (e.target === idleOverlay) closeDialog();
    });
    chipEl.addEventListener("click", openDialog);

    window._boothIdleRefresh = fetchState;
    fetchState();
    setInterval(fetchState, 30000);
    // Live countdown when extension is active
    setInterval(function () {
      if (state.pause_until && !state.disabled) renderChip();
    }, 1000);
  })();

  // Activity tracker for idle detection — write last-activity timestamp via API
  (function () {
    var apiBase = window.BOOTH_MSG_API_BASE || "/booth-messages/api";
    var lastReport = 0;
    var THROTTLE = 60000; // report at most once per minute
    // Mousemove deadband: sub-threshold drift (table vibration, sensor jitter)
    // shouldn't reset the idle timer. The anchor only moves when we report, so
    // sustained creeping motion eventually crosses the threshold; pure jitter
    // around a point never does. Keys/clicks/wheel/touch stay immediate since
    // they're hard to trigger accidentally.
    var MOVE_THRESHOLD_PX = 10;
    var moveAnchorX = null;
    var moveAnchorY = null;
    function reportActivity() {
      var now = Date.now();
      if (now - lastReport < THROTTLE) return;
      lastReport = now;
      fetch(apiBase + "/activity", { method: "POST" }).catch(function () { });
    }
    function onMouseMove(e) {
      if (moveAnchorX === null) {
        moveAnchorX = e.clientX;
        moveAnchorY = e.clientY;
        return;
      }
      var dx = e.clientX - moveAnchorX;
      var dy = e.clientY - moveAnchorY;
      if (dx * dx + dy * dy < MOVE_THRESHOLD_PX * MOVE_THRESHOLD_PX) return;
      moveAnchorX = e.clientX;
      moveAnchorY = e.clientY;
      reportActivity();
    }
    document.addEventListener("keydown", reportActivity, true);
    document.addEventListener("mousemove", onMouseMove, true);
    document.addEventListener("mousedown", reportActivity, true);
    document.addEventListener("wheel", reportActivity, true);
    document.addEventListener("touchstart", reportActivity, true);
  })();
</script>
