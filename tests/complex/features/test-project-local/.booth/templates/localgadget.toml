# Project-local template used by tests/complex/test-project-local.
# Emits a unique Boothfile marker and installs two setups:
#   - localgadget       (inline under [files.setups])
#   - local-hand        (hand-placed under .booth/setups/ — pure local setup)
display-name = "Local Gadget"
display-disc = "Complex-test project-local template"
display-order = 1
primary = true
tags = ["test", "local", "project-local"]

[segments]
Boothfile = """
# CB_DETECT_TEMPLATE_v1
setup localgadget
setup local-hand
"""

[files.setups]
"localgadget--setup.sh" = """
#!/usr/bin/env bash
# Project-local template setup (from localgadget.toml [files.setups])
set -euo pipefail

MARKER="CB_DETECT_TEMPLATE_v1"
echo "$MARKER" > /tmp/cb-local-template-marker.txt
mkdir -p /opt/cb-local-detect
echo "$MARKER" > /opt/cb-local-detect/template.txt

cat > /usr/local/bin/cb-local-template <<'EOF'
#!/usr/bin/env bash
echo "CB_DETECT_TEMPLATE_v1"
EOF
chmod 755 /usr/local/bin/cb-local-template

cat > /etc/profile.d/70-cb-local-template--profile.sh <<'EOF'
export CB_LOCAL_TEMPLATE_MARKER=CB_DETECT_TEMPLATE_v1
EOF
chmod 644 /etc/profile.d/70-cb-local-template--profile.sh
"""
