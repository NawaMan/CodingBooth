name = "gleam_example"
version = "1.0.0"
description = "A tiny Wisp web service, run inside a CodingBooth"

[dependencies]
gleam_stdlib = ">= 1.0.5 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_http = ">= 4.4.0 and < 5.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
mist = ">= 6.0.3 and < 7.0.0"
wisp = ">= 2.2.2 and < 3.0.0"
gleam_httpc = ">= 5.0.0 and < 6.0.0"
argv = ">= 1.1.0 and < 2.0.0"
envoy = ">= 1.2.0 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.11.0 and < 2.0.0"
