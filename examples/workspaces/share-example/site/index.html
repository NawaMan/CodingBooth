<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shared from a booth</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 36rem; margin: 4rem auto; padding: 0 1rem; line-height: 1.5; }
    code { background: #eee; padding: 0 .3em; border-radius: 3px; }
  </style>
</head>
<body>
  <h1>Hello from a CodingBooth</h1>
  <!-- The tests look for this marker to prove the public URL reaches this page. -->
  <p id="marker">share-example is live</p>
  <p>This page is served by <code>caddy</code> inside a booth and reached through a
     temporary tunnel (<code>cloudflared-share</code> or <code>ngrok-share</code>).
     No port is published on the host.</p>
  <p>Page loaded at <span id="now"></span>.</p>
  <script>document.getElementById('now').textContent = new Date().toLocaleString();</script>
</body>
</html>
